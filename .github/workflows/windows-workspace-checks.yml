name: "🧪 Windows Workspace — Verification"
on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - ".github/workflows/windows-remote-workspace-with-apps.yml"
      - ".github/workflows/windows-workspace-checks.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows-remote-workspace-with-apps.yml"
      - ".github/workflows/windows-workspace-checks.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: "Audit Windows workflow and shared trading installer"
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: "🔍 YAML, defaults, isolation, and sources"
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q 'PyYAML==6.0.3'
          python3 - <<'PY'
          import pathlib, yaml
          w = pathlib.Path(".github/workflows/windows-remote-workspace-with-apps.yml")
          data = yaml.load(w.read_text("utf-8"), Loader=yaml.BaseLoader)
          assert "jobs" in data and "secure-rdp" in data["jobs"]
          inputs = data["on"]["workflow_dispatch"]["inputs"]
          assert inputs["remote_access"]["default"] == "rdp"
          assert inputs["metatrader_choice"]["options"] == ["none", "mt4", "mt5", "both"]
          assert inputs["tailscale_hostname"]["default"] == "rdp-runner"
          assert data["jobs"]["secure-rdp"]["timeout-minutes"] == "360"
          source = w.read_text("utf-8")
          installer = pathlib.Path("windows/Install-MetaTrader.ps1").read_text("utf-8")
          for needle in ("actions/checkout@v4", "windows/Install-MetaTrader.ps1",
                         "Invoke-OptionalInstall 'MetaTrader 4'", "Invoke-OptionalInstall 'MetaTrader 5'",
                         "MT4_TERMINAL_EXE", "MT5_TERMINAL_EXE", "tailscale"):
              assert needle in source or needle in installer, needle
          for needle in ("Get-AuthenticodeSignature", "Find-Terminal",
                         "terminal64.exe", "terminal.exe", "download.terminal.free",
                         "download.mql5.com", "Get-FileHash", "GITHUB_ENV"):
              assert needle in installer, needle
          print("PASS: Windows workflow defaults, native trading options and signed shared installer")
          PY
      - name: "🧩 PowerShell parser (no side effects)"
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$env:GITHUB_WORKSPACE/windows/Install-MetaTrader.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-Table | Out-Host; throw "PowerShell parse failed" }
          Write-Host 'PASS: shared Windows installer parses without errors.'

  smoke-trading:
    name: "Install signed Windows terminal: ${{ matrix.terminal }}"
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 23
    strategy:
      fail-fast: false
      matrix:
        terminal: [mt4, mt5]
    steps:
      - uses: actions/checkout@v4
      - name: "🛡️ Prepare Windows Installer policy (hosted runner only)"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'Installer policy modifications forbidden outside hosted runners'
          }
          if ((Get-CimInstance Win32_ComputerSystem).PartOfDomain) {
            throw 'Domain-joined runner: refuse MSI policy override'
          }
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DisableMSI -PropertyType DWord -Value 0 -Force | Out-Null
          New-ItemProperty -Path $key -Name DisableUserInstalls -PropertyType DWord -Value 0 -Force | Out-Null
          $policy = Get-ItemProperty $key
          if ($policy.DisableMSI -ne 0 -or $policy.DisableUserInstalls -ne 0) { throw 'MSI policy check failed' }
          $service = Get-Service msiserver
          if ($service.StartType -eq 'Disabled') { Set-Service msiserver -StartupType Manual }
          Start-Service msiserver -ErrorAction Stop
          Write-Host 'PASS: hosted-runner Windows Installer policy matches production workflow.'
      - name: "📈 Verify signature, install, and confirm terminal binary"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ matrix.terminal }}'
          & "$env:GITHUB_WORKSPACE/windows/Install-MetaTrader.ps1" -Version $version -TimeoutSeconds 420 | Out-Host
          $varName = if ($version -eq 'mt4') { 'MT4_TERMINAL_EXE' } else { 'MT5_TERMINAL_EXE' }
          $line = Get-Content -LiteralPath $env:GITHUB_ENV | Where-Object { $_.StartsWith("$varName=") } | Select-Object -Last 1
          if (-not $line) { throw "Missing verified terminal export: $varName" }
          $exe = $line.Substring($varName.Length + 1)
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "Terminal missing after installer: $exe" }
          if ($version -eq 'mt4' -and (Split-Path $exe -Leaf) -cne 'terminal.exe') { throw 'MT4 resolved to wrong binary' }
          if ($version -eq 'mt5' -and (Split-Path $exe -Leaf) -cne 'terminal64.exe') { throw 'MT5 resolved to wrong binary' }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          Write-Host "PASS: verified native Windows $version at $exe; SHA256=$hash"
          @(
            "## Windows $version install acceptance",
            "",
            "| Check | Result |",
            "|---|---|",
            "| Authenticode installer signature | Verified by shared PowerShell script |",
            "| Version-matched terminal executable | Verified |",
            "| SHA256 of terminal | " + $hash + " |",
            "| Broker login / charts / EA | Not performed |"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
