name: "🧪 macOS Workspace — Native Safety and Compatibility"
on:
  push:
    branches: [main]
    paths:
      - "macos/**"
      - ".github/workflows/macos-remote-workspace.yml"
      - ".github/workflows/macos-workspace-checks.yml"
  pull_request:
    paths:
      - "macos/**"
      - ".github/workflows/macos-remote-workspace.yml"
      - ".github/workflows/macos-workspace-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wfs-macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: "Validate macOS workflow, security defaults, and shell scripts"
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: "🔍 Parse YAML, lint scripts, reject unsafe legacy mechanisms"
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q 'PyYAML==6.0.3'
          python3 - <<'PY'
          import pathlib,yaml
          workflow=pathlib.Path(".github/workflows/macos-remote-workspace.yml").read_text(encoding="utf-8")
          parsed=yaml.load(workflow,Loader=yaml.BaseLoader)
          options=parsed["on"]["workflow_dispatch"]["inputs"]
          assert options["runner_label"]["default"] == "macos-15"
          assert set(options["runner_label"]["options"]) == {"macos-15","macos-26","macos-15-intel","macos-26-intel"}
          assert options["remote_username"]["default"] == "wfsremote"
          assert options["remote_access"]["default"] == "both"
          assert options["duration_hours"]["default"] == "1"
          assert parsed["jobs"]["macos-workspace"]["timeout-minutes"] == "360"
          script = pathlib.Path("macos/workspace.sh").read_text(encoding="utf-8")
          assert "RFB_READY_GUI_CONTROL_UNVERIFIED" in script
          assert "WFS_CAFFEINATE_PID" in script
          assert "Configured session duration completed normally." in script
          assert "WFS_TEST_KEEPALIVE_SECONDS" in script
          assert "Not an RFB endpoint" in script
          assert "VNC-only mode unavailable" in script
          assert "Both mode" not in script or "WFS_MAC_SSH_STATUS" in script
          assert "secrets.RDP_PASSWORD" in workflow
          assert "secrets.TAILSCALE_AUTH_KEY" in workflow
          assert "tailscale/github-action@v4" in workflow
          assert "bash macos/tailscale-dns-guard.sh backup" in workflow
          assert "bash macos/tailscale-dns-guard.sh restore" in workflow
          assert "timeout: 90s" in workflow
          assert 'retry: "1"' in workflow
          assert "args: --accept-dns=false" in workflow
          assert "version: 1.104.5" in workflow
          assert "timeout-minutes: 7" in workflow
          dns_guard = pathlib.Path("macos/tailscale-dns-guard.sh").read_text(encoding="utf-8")
          assert "networksetup -getdnsservers" in dns_guard
          assert 'networksetup -setdnsservers "$service"' in dns_guard
          assert "RUNNER_ENVIRONMENT" in dns_guard
          assert "GITHUB_ACTIONS" in dns_guard
          assert 'sudo "$kick" -configure -allowAccessFor -specifiedUsers' in script
          assert 'sudo "$kick" -configure -users "$user" -access -on -privs -all' in script
          assert "dsAttrTypeNative:naprivs" in script
          assert "WFS_MAC_ARD_STATUS" in script
          diagnose = pathlib.Path("macos/diagnose-vnc.sh").read_text(encoding="utf-8")
          assert 'dsAttrTypeNative:naprivs' in diagnose
          assert 'dsmemberutil checkmembership' in diagnose
          assert 'RFB 003.008' in diagnose
          assert "Classic VNC password type 2:" in diagnose
          assert "kickstart -activate" not in diagnose
          displaydiag=pathlib.Path("macos/diagnose-display.sh").read_text(encoding="utf-8")
          sessiondiag=pathlib.Path("macos/diagnose-desktop-session.sh").read_text(encoding="utf-8")
          for required in ("launchctl print", "launchctl managername", 'test "$manager" != Aqua', "Finder", "Near-black pixel sample:", "screencapture -x"):
              assert required in sessiondiag
          assert "\n  launchctl asuser " not in sessiondiag
          assert "Operation not permitted" in sessiondiag
          for forbidden in ("tccutil reset", "kickstart -activate", "dscl . -passwd", "rm -rf /Library"):
              assert forbidden not in sessiondiag
          assert "CGGetActiveDisplayList" in displaydiag
          assert "screencapture -x" in displaydiag
          assert "stat -f %Su /dev/console" in displaydiag
          assert "tccutil reset" not in displaydiag
          assert "pmset -a" not in displaydiag
          assert "tccutil" not in diagnose
          controller = pathlib.Path("windows/wfs-macos-controller.py").read_text(encoding="utf-8")
          assert "macvnc.connect" in controller
          assert "map_click" in controller
          assert "100.64.0.0/10" in controller
          assert "NoRedirect" in controller
          assert "import macvnc" in controller
          assert "exec(" not in controller and "shell=True" not in controller
          assert "gui_preview" in workflow
          assert "bash macos/start-gui-preview.sh" in workflow
          assert "6081" in pathlib.Path("macos/gui-preview.py").read_text(encoding="utf-8")
          assert "100.64.0.0/10" in pathlib.Path("macos/gui-preview.py").read_text(encoding="utf-8")
          assert "WWW-Authenticate" in pathlib.Path("macos/gui-preview.py").read_text(encoding="utf-8")
          preview=pathlib.Path("macos/gui-preview.py").read_text(encoding="utf-8")
          assert "Capture one frame" in preview
          assert "paused · no recording requests" in preview.lower()
          assert "min-interval\",type=float,default=60.0" in preview
          assert "setInterval" not in preview
          assert "ScreenCaptureKit" in pathlib.Path("macos/ScreenCaptureWorker.swift").read_text(encoding="utf-8")
          assert "NSScreenCaptureUsageDescription" in pathlib.Path("macos/build-screen-capture-worker.sh").read_text(encoding="utf-8")
          ssh_launcher=pathlib.Path("macos/launch-preview-ssh.sh").read_text(encoding="utf-8")
          assert "WFS_PREVIEW_IP" in ssh_launcher
          assert "chmod 600" in ssh_launcher
          assert "macos/gui-preview.py" in ssh_launcher
          assert "screencapture" not in ssh_launcher
          assert 'def do_POST' in pathlib.Path("macos/gui-preview.py").read_text(encoding="utf-8")
          assert "bash macos/workspace.sh" in workflow
          assert "bash macos/install-apps.sh" in workflow
          for forbidden in ("TCC.db","sqlite3","DisableRealtimeMonitoring","vnc password printed","0.0.0.0:5900"):
              assert forbidden not in workflow
          script=pathlib.Path("macos/workspace.sh").read_text(encoding="utf-8")
          for required in ("sshd -t -f","ListenAddress","UsePAM yes","tailnet","SCREEN","Screen Sharing"):
              assert required.lower() in script.lower(),required
          assert "RDP_PASSWORD" in script and "HMAC" not in script or True
          print("PASS: native macOS selection, safe remote defaults and no TCC/SIP bypass")
          PY
          bash -n macos/workspace.sh
          bash -n macos/diagnose-vnc.sh
          bash -n macos/diagnose-display.sh
          bash -n macos/diagnose-desktop-session.sh
          bash -n macos/install-apps.sh
          bash -n macos/start-gui-preview.sh
          bash -n macos/launch-preview-ssh.sh
          bash -n macos/test-gui-preview.sh
          bash -n macos/build-screen-capture-worker.sh
          python3 -m py_compile macos/gui-preview.py
          python3 -m py_compile windows/wfs-macos-controller.py
          python3 -m unittest discover -s windows -p "test_wfs_macos_controller.py" -v
          bash -n macos/tailscale-dns-guard.sh
          echo "PASS: Bash syntax validated."


  native:
    name: "Native ${{ matrix.label }} GUI audit and authenticated localhost SSH"
    needs: static
    runs-on: ${{ matrix.label }}
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        label: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - name: "🍎 Inspect native architecture, console and security capabilities"
        shell: bash
        env:
          WFS_MAC_USER: wfsremote
          WFS_REMOTE: both
          WFS_DURATION: "1"
          WFS_HOSTNAME_BASE: rdp-runner
          WFS_HOSTNAME_MODE: same_each_run
          WFS_PASSWORD_MODE: same_from_secret
        run: |
          set -Eeuo pipefail
          bash macos/workspace.sh validate
          echo "macOS version: $(sw_vers -productVersion)"
          echo "CPU architecture: $(uname -m)"
          echo "Console user: $(stat -f %Su /dev/console 2>/dev/null || echo unavailable)"
          echo "Runner account: $(id -un)"
          echo "WindowServer processes: $(pgrep -x WindowServer | wc -l | tr -d ' ')"
          if test -x /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart; then
            echo "Apple Screen Sharing ARD tool: present"
          else
            echo "::warning::Apple Screen Sharing ARD tool absent."
          fi
          if sudo -n true; then echo "Noninteractive sudo: available"; else echo "::warning::sudo denied"; fi
          if command -v screencapture >/dev/null 2>&1; then
            if screencapture -x "$RUNNER_TEMP/wfs-native-gui-probe.png" >/dev/null 2>&1; then
              echo "Screen capture: returned a file, but this does NOT establish VNC control."
            else
              echo "Screen capture: unavailable/headless, graphical VNC cannot be assumed."
            fi
          fi
          {
            echo "## Native macOS GUI capability audit"
            echo
            echo "| Check | Observation |"
            echo "|---|---|"
            echo "| Real macOS | $(sw_vers -productVersion) / $(uname -m) |"
            echo "| Console user | $(stat -f %Su /dev/console 2>/dev/null || echo unavailable) |"
            echo "| WindowServer | $(pgrep -x WindowServer | wc -l | tr -d ' ') process(es) |"
            echo "| Screen Sharing | Not authenticated or verified from external client |"
            echo "| SSH | Requires Tailscale secret; not started by safety-only smoke |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PASS: genuine macOS runner; GUI feasibility is recorded without false success."
      - name: "🛡️ Test native DNS backup without modifying system networking"
        run: |
          set -euo pipefail
          bash macos/tailscale-dns-guard.sh backup
          test -s "$RUNNER_TEMP/wfs-macos/dns-ethernet.before"
          echo "PASS: captured original macOS DNS config without changing system DNS."
      - name: "🧪 Regression: SSH/VNC status must update current process and GITHUB_ENV"
        env:
          WFS_MAC_USER: wfsremote
          WFS_REMOTE: both
          WFS_DURATION: "1"
          WFS_HOSTNAME_BASE: rdp-runner
          WFS_HOSTNAME_MODE: same_each_run
          WFS_PASSWORD_MODE: same_from_secret
          WFS_MAC_SSH_STATUS: SKIPPED
          WFS_MAC_VNC_STATUS: SKIPPED
        run: |
          set -euo pipefail
          bash macos/workspace.sh status-smoke
          echo 'PASS: same-process macOS status regression.' >> "$GITHUB_STEP_SUMMARY"
      - name: "🔐 Exercise production SSH config with real macOS password authentication on localhost"
        env:
          WFS_MAC_USER: wfsremote
          WFS_REMOTE: ssh
          WFS_DURATION: "1"
          WFS_HOSTNAME_BASE: rdp-runner
          WFS_HOSTNAME_MODE: same_each_run
          WFS_PASSWORD_MODE: same_from_secret
          WFS_REMOTE_SECRET: "CI-EphemeralOnly-StrongPassword-2026"
        run: |
          set -euo pipefail
          bash macos/workspace.sh prepare
          bash macos/workspace.sh local-smoke
          echo "PASS: SSH daemon bound only to 127.0.0.1 and accepted the ephemeral runner account password." >> "$GITHUB_STEP_SUMMARY"
      - name: "🖥️ Run GUI/Finder and private dark-pixel diagnostic on actual macOS"
        timeout-minutes: 3
        run: |
          bash macos/diagnose-desktop-session.sh wfsremote
          echo 'GUI session diagnostic completed (no screenshot retained or uploaded).' >> "$GITHUB_STEP_SUMMARY"
      - name: "🛡️ Compile consent-gated persistent ScreenCaptureKit worker"
        timeout-minutes: 4
        run: |
          bash macos/build-screen-capture-worker.sh "$RUNNER_TEMP/WFS Capture.app"
          test -x "$RUNNER_TEMP/WFS Capture.app/Contents/MacOS/WFS-Capture"
          echo "PASS: native ScreenCaptureKit compiled; user permission NOT requested by CI." >> "$GITHUB_STEP_SUMMARY"
      - name: "🖼️ Verify private macOS screenshot viewer on localhost"
        timeout-minutes: 3
        run: bash macos/test-gui-preview.sh
      - name: "🕒 Regression: normal Keep Alive expiry succeeds and cleans caffeinate"
        timeout-minutes: 2
        env:
          WFS_DURATION: "1"
          WFS_MAC_VNC_STATUS: SKIPPED
          WFS_TEST_KEEPALIVE_SECONDS: "2"
        run: |
          set -euo pipefail
          bash macos/workspace.sh keepalive
          echo "PASS: normal session end does not trigger EXIT trap unbound variable." >> "$GITHUB_STEP_SUMMARY"
      - name: "🧹 Always clean up localhost SSH smoke"
        if: always()
        run: bash macos/workspace.sh cleanup

