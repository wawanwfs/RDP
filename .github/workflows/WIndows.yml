name: 🪟 Windows RDP

on:
  workflow_dispatch:
    inputs:
      windows_version:
        description: 'Pilih Versi Windows (OS)'
        required: true
        default: 'windows-2022'
        type: choice
        options:
          - 'windows-latest'
          - 'windows-2022'
          - 'windows-2019'

      duration_hours:
        description: 'Durasi RDP Aktif (Jam)'
        required: true
        default: '6'
        type: choice
        options:
          - '1'
          - '3'
          - '6'

jobs:
  secure-rdp:
    name: 🖥️ Windows Remote Desktop
    runs-on: ${{ inputs.windows_version }}
    timeout-minutes: 360

    env:
      RDP_USER: RDP

    steps:
      - name: ⚡ Optimize Windows Performance
        shell: pwsh
        run: |
          Write-Host "==========================================="
          Write-Host " Optimizing Windows for RDP Performance"
          Write-Host "==========================================="

          # Visual & animation tweaks
          $regPath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects"
          Set-ItemProperty -Path $regPath -Name "VisualFXSetting" -Value 2 -Force -ErrorAction SilentlyContinue

          $perf = "HKCU:\Control Panel\Desktop"
          Set-ItemProperty -Path $perf -Name "MenuShowDelay" -Value "0" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $perf -Name "DragFullWindows" -Value "0" -Force -ErrorAction SilentlyContinue

          # High performance power plan
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          powercfg -hibernate off

          # Disable unnecessary services
          $services = @(
            "SysMain",
            "WSearch",
            "DiagTrack",
            "dmwappushservice",
            "MapsBroker",
            "XblGameSave",
            "XboxNetApiSvc",
            "RetailDemo",
            "TabletInputService"
          )

          foreach ($svc in $services) {
            Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
            Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
          }

          # Enable audio service
          Set-Service -Name "Audiosrv" -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name "Audiosrv" -ErrorAction SilentlyContinue

          # Optional Defender optimization
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue

          # Network tweaks
          netsh int tcp set global autotuninglevel=normal
          netsh int tcp set global chimney=disabled
          netsh int tcp set supplemental internet congestionprovider=ctcp

          Write-Host "✅ Windows optimization completed"

      - name: 🔐 Configure RDP
        shell: pwsh
        run: |
          Write-Host "Configuring Remote Desktop..."

          # Enable RDP
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          # Compatibility mode for GitHub Actions RDP
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          # 32-bit color depth
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "ColorDepth" `
            -Value 4 `
            -Force `
            -ErrorAction SilentlyContinue

          # Firewall rule
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          Restart-Service -Name TermService -Force

          Write-Host "✅ RDP configured"

      - name: 👤 Create RDP User
        shell: pwsh
        run: |
          Write-Host "Generating secure password..."

          # Password generator that works on GitHub Actions Windows runner
          $upper   = [char[]](65..90)   | Get-Random -Count 4
          $lower   = [char[]](97..122)  | Get-Random -Count 4
          $number  = [char[]](48..57)   | Get-Random -Count 4
          $special = [char[]]@(33,64,35,36,42,43,45,61) | Get-Random -Count 4

          $password = -join ($upper + $lower + $number + $special | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          # Remove old user if exists
          if (Get-LocalUser -Name $env:RDP_USER -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name $env:RDP_USER
          }

          New-LocalUser `
            -Name $env:RDP_USER `
            -Password $securePass `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -UserMayNotChangePassword

          Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USER
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:RDP_USER

          "RDP_PASSWORD=$password" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

          Write-Host "✅ User RDP created"
          Write-Host "Username: $env:RDP_USER"
          Write-Host "Password: $password"

      - name: 🐾 Install Tailscale
        shell: pwsh
        run: |
          Write-Host "Downloading Tailscale MSI..."

          # Stable explicit Tailscale version.
          # Jika suatu saat error, buka https://pkgs.tailscale.com/stable/ lalu ganti versinya.
          $tsUrl  = "https://pkgs.tailscale.com/stable/tailscale-setup-1.98.2-amd64.msi"
          $tsPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $tsPath `
            -UseBasicParsing

          Write-Host "Installing Tailscale silently..."

          Start-Process msiexec.exe `
            -ArgumentList "/i", "`"$tsPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $tsPath -Force -ErrorAction SilentlyContinue

          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tsExe)) {
            Write-Error "❌ Tailscale installation failed"
            exit 1
          }

          Write-Host "✅ Tailscale installed"

      - name: 🌐 Connect Tailscale
        shell: pwsh
        run: |
          Write-Host "Checking Tailscale auth key..."

          if ([string]::IsNullOrWhiteSpace("${{ secrets.TAILSCALE_AUTH_KEY }}")) {
            Write-Error "❌ Secret TAILSCALE_AUTH_KEY belum diset di GitHub Repository Secrets"
            exit 1
          }

          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tsExe)) {
            Write-Error "❌ tailscale.exe not found"
            exit 1
          }

          Write-Host "Connecting to Tailscale..."

          & $tsExe up `
            --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" `
            --hostname="rdp-runner-${{ github.run_id }}" `
            --unattended `
            --accept-routes

          $tsIP = $null
          $retry = 0

          while (-not $tsIP -and $retry -lt 20) {
            Start-Sleep -Seconds 5
            $tsIP = (& $tsExe ip -4 2>$null).Trim()
            $retry++
            Write-Host "Waiting for Tailscale IP... attempt $retry"
          }

          if (-not $tsIP) {
            Write-Error "❌ Tailscale IP not assigned"
            exit 1
          }

          "TAILSCALE_IP=$tsIP" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

          Write-Host "✅ Tailscale connected"
          Write-Host "Tailscale IP: $tsIP"

      - name: ✅ Verify RDP Port
        shell: pwsh
        run: |
          Write-Host "Verifying RDP port..."

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {
            Write-Error "❌ RDP port 3389 unreachable"
            exit 1
          }

          Write-Host "✅ RDP port verified"

      - name: 📊 Generate Dashboard Summary
        shell: pwsh
        run: |
          $summary = @"
          ## 🚀 Windows RDP Session Ready

          | Parameter | Value |
          |-----------|-------|
          | 🖥️ OS | `${{ inputs.windows_version }}` |
          | 🌐 Tailscale IP | `$env:TAILSCALE_IP` |
          | 👤 Username | `$env:RDP_USER` |
          | 🔑 Password | `$env:RDP_PASSWORD` |
          | ⏱️ Duration | `${{ inputs.duration_hours }} Hour(s)` |

          ---

          ### Cara Login

          1. Buka Microsoft Remote Desktop.
          2. Masukkan Tailscale IP.
          3. Username: `RDP`
          4. Password: lihat tabel di atas.
          5. Pastikan perangkat Anda sudah login ke Tailscale yang sama.

          "@

          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: ⏳ Show Access Info & Keep Alive
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "╔══════════════════════════════════════╗"
          Write-Host "║          WINDOWS RDP READY           ║"
          Write-Host "╠══════════════════════════════════════╣"
          Write-Host "║  Host     : $env:TAILSCALE_IP"
          Write-Host "║  Username : $env:RDP_USER"
          Write-Host "║  Password : $env:RDP_PASSWORD"
          Write-Host "╚══════════════════════════════════════╝"
          Write-Host ""

          $hours = [int]'${{ inputs.duration_hours }}'
          $seconds = $hours * 3600
          $elapsed = 0

          while ($elapsed -lt $seconds) {
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] ✅ Session active — elapsed $elapsed seconds"
            Start-Sleep -Seconds 300
            $elapsed += 300
          }

          Write-Host "Session completed."
