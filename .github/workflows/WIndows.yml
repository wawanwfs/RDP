name: 🪟 Windows RDP

on:
  workflow_dispatch:
    inputs:
      windows_version:
        description: 'Pilih Versi Windows (OS)'
        required: true
        default: 'windows-2022'
        type: choice
        options:
          - 'windows-latest'
          - 'windows-2022'
          - 'windows-2019'

      duration_hours:
        description: 'Durasi RDP Aktif (Jam)'
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '3'
          - '6'

jobs:
  secure-rdp:
    name: 🖥️ Windows Remote Desktop
    runs-on: ${{ inputs.windows_version }}
    timeout-minutes: 360

    env:
      RDP_USER: RDP

    steps:
      - name: ⚡ Windows Performance Optimization
        shell: pwsh
        run: |
          Write-Host "==========================================="
          Write-Host " Optimizing Windows for RDP Performance "
          Write-Host "==========================================="

          # Power Optimization
          powercfg -setactive SCHEME_MIN
          powercfg -hibernate off

          # Disable unnecessary services safely
          $services = @(
            'SysMain',
            'WSearch'
          )

          foreach ($svc in $services) {
            try {
              Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
              Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
              Write-Host "Disabled service: $svc"
            }
            catch {
              Write-Host "Skipped service: $svc"
            }
          }

          # Enable Audio Service
          try {
            Set-Service -Name 'Audiosrv' -StartupType Automatic
            Start-Service -Name 'Audiosrv'
          }
          catch {
            Write-Host "Audio service already active"
          }

          Write-Host 'Session completed.'
