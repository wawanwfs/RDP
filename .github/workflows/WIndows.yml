name: 🪟 Windows RDP

on:
  workflow_dispatch:
    inputs:
      windows_version:
        description: 'Pilih Versi Windows (OS)'
        required: true
        default: 'windows-2022'
        type: choice
        options:
          - 'windows-latest'
          - 'windows-2022'
          - 'windows-2019'

      duration_hours:
        description: 'Durasi RDP Aktif (Jam)'
        required: true
        default: '6'
        type: choice
        options:
          - '1'
          - '3'
          - '6'

jobs:
  secure-rdp:
    name: 🖥️ Windows Remote Desktop
    runs-on: ${{ inputs.windows_version }}
    timeout-minutes: 360

    env:
      RDP_USER: RDP

    steps:
      - name: ⚡ Windows Performance Optimization
        shell: pwsh
        run: |
          Write-Host "==========================================="
          Write-Host " Optimizing Windows for RDP Performance "
          Write-Host "==========================================="

          # Power optimization
          powercfg -setactive SCHEME_MIN
          powercfg -hibernate off

          # Disable unnecessary services safely
          $services = @(
            'SysMain',
            'WSearch'
          )

          foreach ($svc in $services) {
            try {
              Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
              Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
              Write-Host "Disabled service: $svc"
            }
            catch {
              Write-Host "Skipped service: $svc"
            }
          }

          # Enable audio service
          try {
            Set-Service -Name 'Audiosrv' -StartupType Automatic -ErrorAction SilentlyContinue
            Start-Service -Name 'Audiosrv' -ErrorAction SilentlyContinue
            Write-Host "Audio service enabled"
          }
          catch {
            Write-Host "Audio service skipped"
          }

          # Improve UI responsiveness
          New-ItemProperty `
            -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' `
            -Name 'VisualFXSetting' `
            -Value 2 `
            -PropertyType DWORD `
            -Force | Out-Null

          Write-Host "Optimization completed successfully ✅"

      - name: 🔐 Configure Secure RDP
        shell: pwsh
        run: |
          Write-Host "Configuring Remote Desktop..."

          # Enable RDP
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          # Enable Network Level Authentication
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1

          # Use TLS security layer
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' `
            -Value 2

          # Clean old firewall rule if exists
          netsh advfirewall firewall delete rule name='RDP-Tailscale' | Out-Null

          # Add RDP firewall rule
          netsh advfirewall firewall add rule `
            name='RDP-Tailscale' `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389 | Out-Null

          # Enable default Remote Desktop firewall group
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue

          # Restart RDP service
          Restart-Service -Name TermService -Force

          Write-Host "RDP configured securely ✅"

      - name: 👤 Create Secure Local User
        shell: pwsh
        run: |
          Write-Host "Generating secure password..."

          # Secure password generator compatible with GitHub Actions Windows runner
          function Get-SecureRandomChar {
            param(
              [string]$Characters
            )

            $index = [System.Security.Cryptography.RandomNumberGenerator]::GetInt32(0, $Characters.Length)
            return $Characters[$index]
          }

          function New-SecurePassword {
            param(
              [int]$Length = 24
            )

            $upper   = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'
            $lower   = 'abcdefghijklmnopqrstuvwxyz'
            $numbers = '0123456789'
            $special = '!@#$%^&*()-_=+[]{}:,.?'
            $all     = $upper + $lower + $numbers + $special

            $passwordChars = New-Object System.Collections.Generic.List[char]

            # Ensure password complexity
            $passwordChars.Add((Get-SecureRandomChar -Characters $upper))
            $passwordChars.Add((Get-SecureRandomChar -Characters $lower))
            $passwordChars.Add((Get-SecureRandomChar -Characters $numbers))
            $passwordChars.Add((Get-SecureRandomChar -Characters $special))

            while ($passwordChars.Count -lt $Length) {
              $passwordChars.Add((Get-SecureRandomChar -Characters $all))
            }

            # Secure shuffle
            for ($i = $passwordChars.Count - 1; $i -gt 0; $i--) {
              $j = [System.Security.Cryptography.RandomNumberGenerator]::GetInt32(0, $i + 1)

              $temp = $passwordChars[$i]
              $passwordChars[$i] = $passwordChars[$j]
              $passwordChars[$j] = $temp
            }

            return -join $passwordChars
          }

          $password = New-SecurePassword -Length 24
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          # Remove old user if exists
          if (Get-LocalUser -Name $env:RDP_USER -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name $env:RDP_USER
          }

          # Create local RDP user
          New-LocalUser `
            -Name $env:RDP_USER `
            -Password $securePass `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -UserMayNotChangePassword

          Add-LocalGroupMember -Group 'Administrators' -Member $env:RDP_USER
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member $env:RDP_USER

          "RDP_PASS=$password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Secure user created successfully ✅"

      - name: 🐾 Install Tailscale
        shell: pwsh
        run: |
          Write-Host "Checking Tailscale auth key..."

          if ([string]::IsNullOrWhiteSpace("${{ secrets.TAILSCALE_AUTH_KEY }}")) {
            Write-Error "Secret TAILSCALE_AUTH_KEY belum diset di GitHub repository secrets!"
            exit 1
          }

          Write-Host "Downloading latest Tailscale installer..."

          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.msi' `
            -OutFile $installerPath

          Write-Host "Installing Tailscale silently..."

          Start-Process msiexec.exe `
            -ArgumentList '/i', "`"$installerPath`"", '/quiet', '/norestart' `
            -Wait

          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tsExe)) {
            Write-Error "Tailscale installation failed!"
            exit 1
          }

          Write-Host "Connecting to Tailscale network..."

          & $tsExe up `
            --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" `
            --hostname="gh-rdp-${{ github.run_id }}" `
            --unattended `
            --accept-routes

          Start-Sleep -Seconds 15

          Write-Host "Tailscale connected successfully ✅"

      - name: 🌐 Verify RDP Connectivity
        shell: pwsh
        run: |
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tsExe)) {
            Write-Error "Tailscale executable not found!"
            exit 1
          }

          $tsIP = (& $tsExe ip -4).Trim()

          if (-not $tsIP) {
            Write-Error "Failed to obtain Tailscale IP!"
            exit 1
          }

          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Testing RDP port accessibility..."
          Write-Host "Tailscale IP: $tsIP"

          $test = Test-NetConnection `
            -ComputerName $tsIP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $test.TcpTestSucceeded) {
            Write-Error "RDP port test failed!"
            exit 1
          }

          Write-Host "RDP is reachable ✅"

      - name: 📊 Generate Dashboard Summary
        shell: pwsh
        run: |
          $summary = @"
          ## 🚀 Windows RDP Session Ready

          | Parameter | Value |
          |-----------|-------|
          | 🖥️ OS | `${{ inputs.windows_version }}` |
          | 🌐 Tailscale IP | `$env:TAILSCALE_IP` |
          | 👤 Username | `$env:RDP_USER` |
          | 🔑 Password | `$env:RDP_PASS` |
          | ⏱️ Duration | `${{ inputs.duration_hours }} Hour(s)` |

          ---

          ### 📌 Important Notes

          - Connect using Microsoft Remote Desktop Client.
          - Make sure your device is connected to the same Tailscale network.
          - Keep the GitHub Actions workflow running.
          - Session ends automatically after selected duration.
          - Access is only available through Tailscale VPN.

          "@

          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: ⏳ Keep Session Alive
        shell: pwsh
        run: |
          Write-Host "========================================="
          Write-Host "        WINDOWS RDP SESSION ACTIVE       "
          Write-Host "========================================="
          Write-Host "OS       : ${{ inputs.windows_version }}"
          Write-Host "IP       : $env:TAILSCALE_IP"
          Write-Host "Username : $env:RDP_USER"
          Write-Host "Password : $env:RDP_PASS"
          Write-Host "========================================="

          $hours = [int]'${{ inputs.duration_hours }}'
          $seconds = $hours * 3600

          Write-Host "Maintaining session for $hours hour(s)..."

          for ($elapsed = 0; $elapsed -lt $seconds; $elapsed += 60) {
            Start-Sleep -Seconds 60
            Write-Host "Session active... elapsed: $elapsed seconds"
          }

          Write-Host "Session completed."
