# 🎯 Log markers: 🚀 start | ⏭️ SKIP | 📥 download | ⚙️ install
# ✅ success | ⚠️ warning | ❌ error | ⏱️ TIME | 🛡️ admin | 🎨 ArtCraft Launcher
# Text labels remain searchable; machine-readable paths, IDs and secrets are unchanged.
name: "🪟 Windows Remote Workspace"
run-name: "🚀 Windows Workspace • ${{ inputs.remote_access }} • ${{ inputs.windows_version }}"

"on":
  workflow_dispatch:
    inputs:
      windows_version:
        description: "Pilih Versi Windows (OS)"
        required: true
        default: "windows-2025"
        type: choice
        options:
          # Recommended stable Windows x64 runners
          - "windows-latest"
          - "windows-2025"
          - "windows-2022"

          # Windows ARM64 runner
          - "windows-11-arm"

          # Public repository only / Visual Studio 2026 image
          # Jika repo private gagal, gunakan windows-2025 atau windows-2022
          - "windows-2025-vs2026"

      remote_access:
        description: "Metode akses: RDP, noVNC (browser), atau keduanya"
        required: true
        default: "rdp"
        type: choice
        options:
          - "rdp"
          - "novnc"
          - "both"

      duration_hours:
        description: "Durasi RDP Aktif (Jam)"
        required: true
        default: "6"
        type: choice
        options:
          - "1"
          - "3"
          - "6"

      ide_choice:
        description: "Pilih IDE yang akan diinstall"
        required: true
        default: "none"
        type: choice
        options:
          - "none"
          - "antigravity"
          - "vscode"
          - "both"

      editor_choice:
        description: "Pilih video editor"
        required: true
        default: "none"
        type: choice
        options:
          - "none"
          - "capcut"
          - "shotcut"
          - "both"

      metatrader_choice:
        description: "Pilih MetaTrader"
        required: true
        default: "none"
        type: choice
        options:
          - "none"
          - "mt4"
          - "mt5"
          - "both"

      router_choice:
        description: "Pilih AI API Router"
        required: true
        default: "none"
        type: choice
        options:
          - "none"
          - "9router"
          - "omniroute"
          - "both"

      coding_agent_choice:
        description: "Pilih coding agent"
        required: true
        default: "none"
        type: choice
        options:
          - "none"
          - "codex"
          - "claude"
          - "both"

      ai_agent_choice:
        description: "Pilih AI agent (Hermes, OpenClaw, atau OpenCode)"
        required: true
        default: "none"
        type: choice
        options:
          - "none"
          - "hermes"
          - "openclaw"
          - "opencode"
          - "both"
          - "all"

      install_artcraft:
        description: "Install ArtCraft Launcher stable terbaru (release resmi GitHub, checksum SHA-256)"
        required: true
        default: true
        type: boolean

      tailscale_hostname:
        description: "Nama hostname Tailscale untuk Windows Workspace"
        required: true
        default: "rdp-runner"
        type: string

      hostname_mode:
        description: "Mode hostname: sama setiap running atau unik per running"
        required: true
        default: "same_each_run"
        type: choice
        options:
          - "unique_each_run"
          - "same_each_run"

      rdp_password_mode:
        description: "Password RDP: acak per run atau tetap dari secrets.RDP_PASSWORD"
        required: true
        default: "same_from_secret"
        type: choice
        options:
          - "random_each_run"
          - "same_from_secret"

      vnc_password_mode:
        description: "Password noVNC: acak per run atau tetap dari secrets.VNC_PASSWORD"
        required: true
        default: "same_from_secret"
        type: choice
        options:
          - "random_each_run"
          - "same_from_secret"

      novnc_transport:
        description: "Satu port untuk noVNC: TCP 6082 atau HTTPS 443 (perlu sertifikat HTTPS Tailscale)"
        required: true
        default: "tailscale_tcp"
        type: choice
        options:
          - "tailscale_tcp"
          - "tailscale_https"

jobs:
  secure-rdp:
    name: 🪟 Windows Remote Workspace (RDP / noVNC)
    runs-on: ${{ inputs.windows_version }}
    timeout-minutes: 360
    permissions:
      contents: read

    env:
      RDP_USER: RDP

    steps:
      - name: "📦 Checkout shared WFS installers and tests"
        uses: actions/checkout@v4

      - name: ⚡ Optimize Windows Performance
        shell: pwsh
        run: |
          Write-Host "==========================================="
          Write-Host " Optimizing Windows for RDP Performance"
          Write-Host "==========================================="

          # Do not force VisualFXSetting=2 (best performance). Some runner
          # images/sessions intentionally use a plain black background, and
          # this override is not needed for a usable noVNC desktop.
          $perf = "HKCU:\Control Panel\Desktop"
          Set-ItemProperty -Path $perf -Name "MenuShowDelay" -Value "0" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $perf -Name "DragFullWindows" -Value "0" -Force -ErrorAction SilentlyContinue

          # Use a built-in Windows wallpaper only if this runner account has
          # no valid wallpaper selected. Do not download images, override
          # existing personalization, or fail the remote workflow on errors.
          try {
            $wallpaperPath = [string](Get-ItemProperty -Path $perf -Name Wallpaper -ErrorAction SilentlyContinue).Wallpaper
            if ([string]::IsNullOrWhiteSpace($wallpaperPath) -or -not (Test-Path -LiteralPath $wallpaperPath)) {
              $wallpaperRoot = Join-Path $env:WINDIR 'Web\Wallpaper'
              $stock = Get-ChildItem -Path $wallpaperRoot -Include *.jpg,*.jpeg,*.png -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
              if ($stock) {
                Set-ItemProperty -Path $perf -Name Wallpaper -Value $stock -Force
                Set-ItemProperty -Path $perf -Name WallpaperStyle -Value '10' -Force
                Set-ItemProperty -Path $perf -Name TileWallpaper -Value '0' -Force
                Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class WfsDesktopWallpaper {
            [DllImport("user32.dll", CharSet = CharSet.Unicode)]
            public static extern bool SystemParametersInfo(uint action, uint param, string path, uint flags);
          }
          '@
                $applied = [WfsDesktopWallpaper]::SystemParametersInfo(20,0,$stock,3)
                Write-Host "Desktop wallpaper: Windows stock image configured (live refresh: $applied)."
              } else {
                Write-Host 'No built-in Windows wallpaper was found; preserve current background.'
              }
            } else {
              Write-Host 'Existing desktop wallpaper retained.'
            }
          } catch {
            Write-Warning "Optional desktop wallpaper setup was skipped: $($_.Exception.Message)"
          }

          # High performance power plan
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          powercfg -hibernate off

          # Disable unnecessary services
          $services = @(
            "SysMain",
            "WSearch",
            "DiagTrack",
            "dmwappushservice",
            "MapsBroker",
            "XblGameSave",
            "XboxNetApiSvc",
            "RetailDemo",
            "TabletInputService"
          )

          foreach ($svc in $services) {
            Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
            Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
          }

          # Enable audio service
          Set-Service -Name "Audiosrv" -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name "Audiosrv" -ErrorAction SilentlyContinue

          # Keep Microsoft Defender real-time protection enabled.
          # Network tweaks
          netsh int tcp set global autotuninglevel=normal
          # Chimney offload is unsupported by netsh on current Windows images.
          netsh int tcp set supplemental internet congestionprovider=ctcp

          Write-Host "✅ Windows optimization completed"

      - name: 🔐 Configure RDP
        shell: pwsh
        run: |
          Write-Host "Configuring Remote Desktop..."

          # Enable RDP
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          # Keep Network Level Authentication (NLA) and TLS enabled.
          # RDP access is restricted to Tailscale IPv4 clients by the firewall rule below.
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 2 `
            -Force

          # 32-bit color depth
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "ColorDepth" `
            -Value 4 `
            -Force `
            -ErrorAction SilentlyContinue

          # Disable broad built-in RDP rules and allow RDP only from Tailscale IPv4 space.
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue |
            Disable-NetFirewallRule -ErrorAction SilentlyContinue

          # netsh delete on a missing rule leaves LASTEXITCODE=1; use a
          # PowerShell idempotent removal instead.
          Get-NetFirewallRule -Name 'RDP-Tailscale' -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule -ErrorAction SilentlyContinue

          # Do not publish native RDP over Tailscale in noVNC-only mode.
          if ('${{ inputs.remote_access }}' -ne 'novnc') {
            netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10 profile=any
            if ($LASTEXITCODE -ne 0) { throw "❌ Failed to create the Tailscale-only RDP firewall rule." }
          } else {
            Write-Host "⏭️ RDP inbound rule skipped for noVNC-only mode."
          }

          Restart-Service -Name TermService -Force

          Write-Host "✅ RDP configured"
          # The Actions pwsh wrapper exits using the last native program's code;
          # explicitly checked netsh add errors above must still fail.
          $global:LASTEXITCODE = 0

      - name: 👤 Create RDP User
        shell: pwsh
        env:
          RDP_PASSWORD_SECRET: ${{ secrets.RDP_PASSWORD }}
        run: |
          $passwordMode = '${{ inputs.rdp_password_mode }}'

          Write-Host "🔐 Preparing RDP password..."
          Write-Host "🔐 Password mode: $passwordMode"

          if ($passwordMode -eq "same_from_secret") {
            if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD_SECRET)) {
              Write-Error "❌ rdp_password_mode=same_from_secret dipilih, tapi GitHub Secret RDP_PASSWORD belum diset. Tambahkan di Settings > Secrets and variables > Actions > Repository secrets."
              exit 1
            }

            $password = $env:RDP_PASSWORD_SECRET
            Write-Host "::add-mask::$password"
            Write-Host "🔐 Using fixed password from GitHub Secret: RDP_PASSWORD"
          } else {
            # Password generator that works on GitHub Actions Windows runner
            $upper   = [char[]](65..90)   | Get-Random -Count 4
            $lower   = [char[]](97..122)  | Get-Random -Count 4
            $number  = [char[]](48..57)   | Get-Random -Count 4
            $special = [char[]]@(33,64,35,36,42,43,45,61) | Get-Random -Count 4

            $password = -join ($upper + $lower + $number + $special | Sort-Object { Get-Random })
          }

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          # Remove old user if exists
          if (Get-LocalUser -Name $env:RDP_USER -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name $env:RDP_USER
          }

          New-LocalUser `
            -Name $env:RDP_USER `
            -Password $securePass `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -UserMayNotChangePassword

          # 🛡️ Administrator access is mandatory. Resolve built-in groups by SID,
          # so this also works on non-English Windows images. Keep UAC enabled.
          $rdpAccount = Get-LocalUser -Name $env:RDP_USER -ErrorAction Stop
          foreach ($groupSid in @('S-1-5-32-544', 'S-1-5-32-555')) {
            $group = Get-LocalGroup -SID $groupSid -ErrorAction Stop
            $members = @(Get-LocalGroupMember -Group $group -ErrorAction Stop)
            if (-not ($members | Where-Object { $_.SID.Value -eq $rdpAccount.SID.Value })) {
              Add-LocalGroupMember -Group $group -Member $rdpAccount -ErrorAction Stop
            }
            $verified = Get-LocalGroupMember -Group $group -ErrorAction Stop |
              Where-Object { $_.SID.Value -eq $rdpAccount.SID.Value }
            if (-not $verified) { throw "❌ Required group membership could not be verified: $groupSid" }
            Write-Host "🛡️ ✅ Verified $env:RDP_USER membership: $($group.Name) [$groupSid]"
          }
          Write-Host '🛡️ RDP account has verified local Administrator access (UAC unchanged).'

          "RDP_PASSWORD=$password" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "RDP_PASSWORD_MODE=$passwordMode" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

          Write-Host "✅ User RDP created"
          Write-Host "Username: $env:RDP_USER"

          if ($passwordMode -eq "same_from_secret") {
            Write-Host "Password: using GitHub Secret RDP_PASSWORD"
          } else {
            Write-Host "Password: $password"
          }

      # Reuse installed apps; parallelize independent groups, not competing installers.
      - name: 🛡️ Prepare MSI Policy on Disposable Runner
        shell: pwsh
        run: |
          Write-Host '🛡️ Checking Windows Installer policy for the disposable GitHub runner...'
          $policyPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
          $policy = Get-ItemProperty -LiteralPath $policyPath -ErrorAction SilentlyContinue
          Write-Host "🔎 Before: DisableMSI=$($policy.DisableMSI); DisableUserInstalls=$($policy.DisableUserInstalls)"
          # Never override domain, self-hosted, AppLocker or WDAC policy. These two local
          # MSI settings apply only to this disposable GitHub-hosted Windows machine.
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw '❌ Refusing MSI policy changes outside a disposable GitHub-hosted runner.'
          }
          $computer = Get-CimInstance -ClassName Win32_ComputerSystem -ErrorAction Stop
          if ($computer.PartOfDomain) { throw '❌ Domain-joined host detected: ask the domain administrator to approve installation.' }
          $backupDir = Join-Path $env:ProgramData 'RDP-Setup'
          New-Item $backupDir -ItemType Directory -Force | Out-Null
          @{ DisableMSI = $policy.DisableMSI; DisableUserInstalls = $policy.DisableUserInstalls } |
            ConvertTo-Json | Set-Content (Join-Path $backupDir 'msi-policy-before.json') -Encoding UTF8
          New-Item -Path $policyPath -Force | Out-Null
          # Permit normal MSI installation and per-user packages (the launcher is per-user).
          # Do NOT enable AlwaysInstallElevated and do NOT disable UAC.
          New-ItemProperty -LiteralPath $policyPath -Name DisableMSI -PropertyType DWord -Value 0 -Force -ErrorAction Stop | Out-Null
          New-ItemProperty -LiteralPath $policyPath -Name DisableUserInstalls -PropertyType DWord -Value 0 -Force -ErrorAction Stop | Out-Null
          $verified = Get-ItemProperty -LiteralPath $policyPath -ErrorAction Stop
          if ($verified.DisableMSI -ne 0 -or $verified.DisableUserInstalls -ne 0) { throw '❌ Windows Installer policy did not accept the requested local settings.' }
          $service = Get-Service -Name msiserver -ErrorAction Stop
          if ($service.StartType -eq 'Disabled') { Set-Service -Name msiserver -StartupType Manual -ErrorAction Stop }
          Start-Service -Name msiserver -ErrorAction Stop
          Write-Host '✅ MSI and per-user installs allowed on this temporary runner; UAC and application-control policies unchanged.'

      - name: 🧰 Prepare Installation Helpers (1/2)
        shell: pwsh
        run: |
          function Invoke-RdpUserTask {
            param([string] $Name, [scriptblock] $Script, [hashtable] $Context = @{}, [int] $TimeoutSeconds = 600)
            if (-not $env:RDP_PASSWORD) { throw '❌ Missing credentials for RDP user task.' }
            $id = 'RdpSetup-' + $Name + '-' + [guid]::NewGuid().ToString('N').Substring(0,8)
            $dir = Join-Path $env:ProgramData "RDP-Setup\UserTasks\$id"
            New-Item $dir -ItemType Directory -Force | Out-Null
            $sid = (Get-LocalUser -Name $env:RDP_USER -ErrorAction Stop).SID.Value
            & icacls.exe $dir /grant "*${sid}:(OI)(CI)M" /Q | Out-Host
            if ($LASTEXITCODE -ne 0) { throw '❌ Cannot grant access to RDP task files.' }
            $Context | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $dir 'context.json') -Encoding UTF8
            $header = @'
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $ctx = Get-Content (Join-Path $PSScriptRoot 'context.json') -Raw | ConvertFrom-Json
          $env:PATH = [Environment]::GetEnvironmentVariable('PATH','Machine') + ';' + [Environment]::GetEnvironmentVariable('PATH','User')
          Set-Content (Join-Path $PSScriptRoot 'pid.txt') $PID
          $result = @{ Success = $false; Data = $null; Message = ''; User = [Security.Principal.WindowsIdentity]::GetCurrent().Name }
          Start-Transcript (Join-Path $PSScriptRoot 'install.log') -Force | Out-Null
          try {
            $principal = [Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())
            if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'RDP task did not receive elevated Administrator privileges.' }
            Write-Host "🛡️ Running as $($result.User), elevated Administrator"
            $msiPolicy = Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer' -ErrorAction SilentlyContinue
            Write-Host "🔎 MSI policy: DisableMSI=$($msiPolicy.DisableMSI), DisableUserInstalls=$($msiPolicy.DisableUserInstalls)"
            $userPolicy = Get-ItemProperty 'HKCU:\SOFTWARE\Policies\Microsoft\Windows\Installer' -ErrorAction SilentlyContinue
            Write-Host "🔎 Current-user installer policy: DisableMSI=$($userPolicy.DisableMSI)"
            $result.Data = & {
          '@
            $footer = @'
            }
            $result.Success = $true
          } catch {
            $result.Message = $_.Exception.Message
            Write-Host "❌ $($result.Message)"
          } finally {
            Stop-Transcript | Out-Null
            $result | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $PSScriptRoot 'result.tmp') -Encoding UTF8
            Move-Item (Join-Path $PSScriptRoot 'result.tmp') (Join-Path $PSScriptRoot 'result.json') -Force
          }
          if (-not $result.Success) { exit 1 }
          exit 0
          '@
            $file = Join-Path $dir 'run.ps1'
            # Windows PowerShell 5.1 requires UTF8 BOM for emoji/non-ASCII source.
            [IO.File]::WriteAllText($file, ($header + "`r`n" + $Script.ToString() + "`r`n" + $footer), [Text.UTF8Encoding]::new($true))
            $action = New-ScheduledTaskAction -Execute "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -Argument "-NoProfile -ExecutionPolicy Bypass -File `"$file`"" -WorkingDirectory $dir
            $settings = New-ScheduledTaskSettingsSet -ExecutionTimeLimit ([timespan]::FromSeconds($TimeoutSeconds + 30)) -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries
            $registered = $false
            try {
              Register-ScheduledTask -TaskName $id -Action $action -Settings $settings -User "$env:COMPUTERNAME\$env:RDP_USER" -Password $env:RDP_PASSWORD -RunLevel Highest -Force -ErrorAction Stop | Out-Null
              $registered = $true
              Start-ScheduledTask -TaskName $id -ErrorAction Stop
              $clock = [Diagnostics.Stopwatch]::StartNew()
              $resultFile = Join-Path $dir 'result.json'
              while (-not (Test-Path $resultFile)) {
                if ($clock.Elapsed.TotalSeconds -gt $TimeoutSeconds) { throw "❌ $Name exceeded $TimeoutSeconds seconds. Logs: $dir" }
                $task = Get-ScheduledTask -TaskName $id -ErrorAction Stop
                if ($clock.Elapsed.TotalSeconds -gt 10 -and $task.State -eq 'Ready') {
                  $info = Get-ScheduledTaskInfo -TaskName $id
                  throw "❌ $Name task stopped without a result (code $($info.LastTaskResult)). Logs: $dir"
                }
                Start-Sleep -Seconds 2
              }
              $result = Get-Content $resultFile -Raw | ConvertFrom-Json
              if (-not $result.Success) { throw "❌ $Name failed for RDP: $($result.Message). Logs: $dir" }
              Write-Host "✅ $Name verified as $($result.User)"
              return $result.Data
            } finally {
              if ($registered) {
                Stop-ScheduledTask -TaskName $id -ErrorAction SilentlyContinue
                $pidFile = Join-Path $dir 'pid.txt'
                if (Test-Path $pidFile) {
                  $workerPid = [int](Get-Content $pidFile -Raw).Trim()
                  if (Get-Process -Id $workerPid -ErrorAction SilentlyContinue) { & taskkill.exe /PID $workerPid /T /F 2>&1 | Out-Host }
                }
                Unregister-ScheduledTask -TaskName $id -Confirm:$false -ErrorAction SilentlyContinue
              }
              $log = Join-Path $dir 'install.log'
              if (Test-Path $log) { Get-Content $log -Tail 100 | Out-Host }
              Write-Host "📁 $Name diagnostic files: $dir"
            }
          }

          function Install-CapCutForRdp {
            # Pinned x64 installer and switches from microsoft/winget-pkgs ByteDance.CapCut.
            $dir = Join-Path $env:ProgramData 'RDP-Setup\CapCut-Installer'
            New-Item $dir -ItemType Directory -Force | Out-Null
            $file = Join-Path $dir 'CapCut_9.4.0.4015.exe'
            $url = 'https://sf16-web-tos-buz.capcutstatic.com/obj/capcut-web-buz-sg/packages/CapCut_9_4_0_4015_capcutpc_0_creatortool.exe'
            Write-Host '🎬 📥 Downloading CapCut 9.4.0.4015 (per-user installer)...'
            try {
              Invoke-WebRequest -Uri $url -OutFile $file -UseBasicParsing -TimeoutSec 300 -ErrorAction Stop
              if ((Get-FileHash $file -Algorithm SHA256).Hash -ne '8911B37A756AA8741BE8E0489CD1500CF140968CAFA09832C0FB48FAB0188CE3') { throw '❌ CapCut SHA256 mismatch.' }
              $mutex = [Threading.Mutex]::new($false, 'Global\RdpWorkflowWingetInstall'); $locked = $false
              try {
                try { $locked = $mutex.WaitOne(300000) } catch [Threading.AbandonedMutexException] { $locked = $true }
                if (-not $locked) { throw '❌ CapCut installer queue timeout.' }
                $data = Invoke-RdpUserTask -Name CapCut -Context @{ Installer = $file } -TimeoutSeconds 600 -Script {
                  $dest = Join-Path $env:LOCALAPPDATA 'Programs\CapCut'
                  $found = Get-ChildItem $dest -Filter CapCut.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
                  if (-not $found) {
                    $p = Start-Process -FilePath $ctx.Installer -ArgumentList @('/silent_install=1', "/install_path=`"$dest`"") -PassThru -Wait
                    if ($p.ExitCode -notin @(0,3010)) { throw "CapCut installer exit: $($p.ExitCode)" }
                    for ($i=0; $i -lt 30 -and -not $found; $i++) {
                      $found = Get-ChildItem $dest -Filter CapCut.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
                      if (-not $found) { Start-Sleep -Seconds 2 }
                    }
                  }
                  if (-not $found) { throw 'CapCut.exe not found in the RDP profile after installation.' }
                  [pscustomobject]@{ Executable = $found.FullName; Version = $found.VersionInfo.FileVersion }
                }
                "CAPCUT_EXE=$($data.Executable)" | Add-Content $env:GITHUB_ENV -Encoding UTF8
                Write-Host "✅ CapCut binary detected for RDP: $($data.Executable) ($($data.Version))"
              } finally { if ($locked) { $mutex.ReleaseMutex() }; $mutex.Dispose() }
            } finally { Remove-Item $file -Force -ErrorAction SilentlyContinue }
          }

          function Install-ClaudeForRdp {
            $data = Invoke-RdpUserTask -Name ClaudeCode -TimeoutSeconds 600 -Script {
              $exe = Join-Path $env:USERPROFILE '.local\bin\claude.exe'
              if (-not (Test-Path $exe)) {
                $file = Join-Path $PSScriptRoot 'claude-install.ps1'
                Invoke-WebRequest 'https://claude.ai/install.ps1' -UseBasicParsing -OutFile $file -TimeoutSec 120 -ErrorAction Stop
                & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File $file | Out-Host
                if ($LASTEXITCODE -ne 0) { throw "Claude native installer exit: $LASTEXITCODE" }
              }
              if (-not (Test-Path $exe)) { throw 'Claude native executable not found in RDP profile.' }
              $version = & $exe --version 2>&1
              if ($LASTEXITCODE -ne 0) { throw "Claude --version failed: $version" }
              $bin = Split-Path $exe
              $userPath = [Environment]::GetEnvironmentVariable('Path','User')
              if ($bin -notin @($userPath -split ';')) { [Environment]::SetEnvironmentVariable('Path', "$bin;$userPath",'User') }
              [pscustomobject]@{ Executable = $exe; Version = ($version -join ' ') }
            }
            "CLAUDE_EXE=$($data.Executable)" | Add-Content $env:GITHUB_ENV -Encoding UTF8
            Write-Host "✅ Claude Code --version as RDP: $($data.Version)"
          }

          function Test-RdpPackageInstalled {
            param([string] $Id)
            # Fast exact locations first; no recursive scan of the whole disk.
            $paths = switch ($Id) {
              'Google.Chrome' { @("$env:ProgramFiles\Google\Chrome\Application\chrome.exe", "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe", "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe") }
              'RARLab.WinRAR' { @("$env:ProgramFiles\WinRAR\WinRAR.exe", "${env:ProgramFiles(x86)}\WinRAR\WinRAR.exe") }
              'OpenJS.NodeJS.LTS' { @("$env:ProgramFiles\nodejs\node.exe", "${env:ProgramFiles(x86)}\nodejs\node.exe") }
              'Microsoft.VisualStudioCode' { @("$env:ProgramFiles\Microsoft VS Code\Code.exe", "${env:ProgramFiles(x86)}\Microsoft VS Code\Code.exe", "$env:LOCALAPPDATA\Programs\Microsoft VS Code\Code.exe") }
              'Google.AntigravityIDE' { @("$env:LOCALAPPDATA\Programs\Antigravity IDE\Antigravity IDE.exe", "$env:ProgramFiles\Antigravity IDE\Antigravity IDE.exe") }
              '7zip.7zip' { @("$env:ProgramFiles\7-Zip\7z.exe", "${env:ProgramFiles(x86)}\7-Zip\7z.exe") }
              default { @() }
            }
            foreach ($path in $paths) {
              if (Test-Path -LiteralPath $path -PathType Leaf) { return $true }
            }
            if ($Id -eq 'OpenJS.NodeJS.LTS') {
              return [bool](Get-Command node.exe -ErrorAction SilentlyContinue)
            }
            # Installed-program registry is much cheaper than winget list/source refresh.
            $pattern = switch ($Id) {
              'Google.Chrome' { '^Google Chrome$' }
              'RARLab.WinRAR' { '^WinRAR(?:\s|$)' }
              'Microsoft.VisualStudioCode' { '^Microsoft Visual Studio Code(?:\s|$)' }
              'Google.AntigravityIDE' { '^Antigravity IDE(?:\s|$)' }
              'ByteDance.CapCut' { '^CapCut(?:\s|$)' }
              'Meltytech.Shotcut' { '^Shotcut(?:\s|$)' }
              '7zip.7zip' { '^7-Zip(?:\s|$)' }
              default { $null }
            }
            if ($pattern) {
              foreach ($key in @('HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*')) {
                $match = Get-ItemProperty -Path $key -ErrorAction SilentlyContinue |
                  Where-Object { $_.DisplayName -match $pattern } | Select-Object -First 1
                if ($match) { return $true }
              }
            }
            return $false
          }

          function Invoke-BoundedInstaller {
            param([string] $FilePath, [string[]] $Arguments, [int] $TimeoutSeconds = 300, [pscredential] $Credential = $null)
            $logBase = Join-Path $env:TEMP ("rdp-installer-" + [guid]::NewGuid().ToString('N'))
            $identity = @{}
            if ($Credential) { $identity = @{ Credential = $Credential; LoadUserProfile = $true; WorkingDirectory = $env:SystemRoot } }
            $process = Start-Process -FilePath $FilePath -ArgumentList $Arguments -PassThru -NoNewWindow `
              -RedirectStandardOutput "$logBase.out" -RedirectStandardError "$logBase.err" @identity
            try {
              if (-not $process.WaitForExit($TimeoutSeconds * 1000)) {
                & taskkill.exe /PID $process.Id /T /F 2>&1 | Out-Host
                throw "❌ Installer exceeded $TimeoutSeconds seconds; process tree terminated."
              }
              $process.WaitForExit()
              return [int]$process.ExitCode
            } finally {
              foreach ($file in @("$logBase.out", "$logBase.err")) {
                if (Test-Path -LiteralPath $file) {
                  Get-Content -LiteralPath $file -Tail 60 | Out-Host
                  Remove-Item -LiteralPath $file -Force -ErrorAction SilentlyContinue
                }
              }
              $process.Dispose()
            }
          }

          function Install-WingetPackage {
            param(
              [Parameter(Mandatory = $true)] [string] $Id,
              [Parameter(Mandatory = $true)] [string] $Name,
              [string[]] $FallbackIds = @(),
              [scriptblock] $FallbackInstaller = $null,
              [string] $Scope = '',
              [switch] $Optional
            )
            $clock = [Diagnostics.Stopwatch]::StartNew()
            # One machine-wide queue also protects the optional ArtCraft worker.
            $mutex = [Threading.Mutex]::new($false, 'Global\RdpWorkflowWingetInstall')
            $locked = $false
            try {
              if (Test-RdpPackageInstalled $Id) {
                Write-Host "⏭️ SKIP $Name : already installed (no download/update)."
                return $true
              }
              try { $locked = $mutex.WaitOne(600000) }
              catch [Threading.AbandonedMutexException] { $locked = $true }
              if (-not $locked) { throw "❌ Timed out waiting for installer lock: $Name" }
              if (Test-RdpPackageInstalled $Id) { return $true }
              if (-not $winget -or -not (Test-Path -LiteralPath $winget)) {
                throw "❌ winget.exe unavailable; cannot install missing application $Name."
              }
              foreach ($packageId in (@($Id) + $FallbackIds)) {
                $installArgs = @('install', '--id', $packageId, '--exact', '--source', 'winget', '--silent', '--accept-package-agreements', '--accept-source-agreements', '--disable-interactivity')
                if ($Scope) { $installArgs += @('--scope', $Scope) }
                # One attempt only; use a known alternative instead of repeating a slow failure.
                $code = Invoke-BoundedInstaller -FilePath $winget -Arguments $installArgs
                if ($code -in @(0, 3010, 1641) -or (Test-RdpPackageInstalled $Id)) {
                  Write-Host "✅ OK $Name installed/detected."
                  return $true
                }
                Write-Warning "⚠️ winget $packageId exited with $code."
              }
              # A failed winget command alone is NOT evidence that Chrome is missing.
              if ($FallbackInstaller -and -not (Test-RdpPackageInstalled $Id)) {
                Write-Host "🔄 Fallback needed: $Name is still missing."
                & $FallbackInstaller | Out-Host
                if (-not (Test-RdpPackageInstalled $Id)) { throw "❌ $Name not detected after fallback." }
                return $true
              }
              throw "❌ Unable to install missing application $Name."
            } catch {
              if ($Optional) { Write-Warning ("⚠️ " + $_.Exception.Message); return $false }
              throw
            } finally {
              if ($locked) { $mutex.ReleaseMutex() }
              $mutex.Dispose()
              Write-Host ("⏱️ TIME {0}: {1:N1}s" -f $Name, $clock.Elapsed.TotalSeconds)
            }
          }

          function Resolve-AppTarget {
            param(
              [string[]] $CandidatePaths = @(),
              [string[]] $SearchRoots = @(),
              [string[]] $ExecutableNames = @()
            )

            foreach ($candidate in $CandidatePaths) {
              if ([string]::IsNullOrWhiteSpace($candidate)) { continue }

              $expanded = [Environment]::ExpandEnvironmentVariables($candidate)
              if (Test-Path $expanded) {
                return (Resolve-Path $expanded).Path
              }
            }

            foreach ($root in $SearchRoots) {
              if ([string]::IsNullOrWhiteSpace($root)) { continue }

              $expandedRoot = [Environment]::ExpandEnvironmentVariables($root)
              if (-not (Test-Path $expandedRoot)) { continue }

              foreach ($exeName in $ExecutableNames) {
                $found = Get-ChildItem `
                  -Path $expandedRoot `
                  -Filter $exeName `
                  -File `
                  -Recurse -Depth 3 `
                  -ErrorAction SilentlyContinue |
                  Select-Object -First 1

                if ($found) {
                  return $found.FullName
                }
              }
            }

            return $null
          }

          function Refresh-InstallerPath {
            $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
            $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
            $currentPathEntries = @($env:Path -split ';' | Where-Object { $_ })
            $storedPathEntries = @($machinePath -split ';') + @($userPath -split ';')
            $missingPathEntries = @(
              $storedPathEntries |
                Where-Object { $_ -and $_ -notin $currentPathEntries }
            )

            if ($missingPathEntries.Count -gt 0) {
              $env:Path = (@($currentPathEntries + $missingPathEntries) | Select-Object -Unique) -join ';'
            }
          }

          function Invoke-OptionalInstall {
            param(
              [Parameter(Mandatory = $true)] [string] $Name,
              [Parameter(Mandatory = $true)] [scriptblock] $Action
            )

            try {
              $optionalClock = [Diagnostics.Stopwatch]::StartNew()
              Write-Host "⚙️ Starting optional installation: $Name"
              & $Action
              Write-Host "🏁 Finished optional installation attempt: $Name"
            } catch {
              if ($Name -in @('CapCut', 'Codex CLI', 'Claude Code')) { throw }
              Write-Warning "⚠️ Optional installation failed for ${Name}: $($_.Exception.Message)"
            } finally {
              Write-Host ("⏱️ TIME {0}: {1:N1}s" -f $Name, $optionalClock.Elapsed.TotalSeconds)
            }
          }


          $helperPath = Join-Path $env:RUNNER_TEMP 'rdp-install-helpers.ps1'
          $names = @('Invoke-RdpUserTask', 'Install-CapCutForRdp', 'Install-ClaudeForRdp', 'Test-RdpPackageInstalled', 'Invoke-BoundedInstaller', 'Install-WingetPackage', 'Resolve-AppTarget', 'Refresh-InstallerPath', 'Invoke-OptionalInstall')
          $definitions = foreach ($name in $names) {
            $definition = (Get-Command $name -CommandType Function -ErrorAction Stop).Definition
            "function $name {`n$definition`n}"
          }
          Set-Content -LiteralPath $helperPath -Value ($definitions -join "`n`n") -Encoding UTF8

      - name: 🧰 Prepare Installation Helpers (2/2)
        shell: pwsh
        run: |
          function Install-NpmGlobalPackage {
            param([Parameter(Mandatory = $true)] [string] $PackageName)
            $prefix = Join-Path $env:ProgramData 'RDP-Tools\npm'
            New-Item $prefix -ItemType Directory -Force | Out-Null
            $command = switch ($PackageName) {
              '@openai/codex' { 'codex' }; '9router' { '9router' }; 'omniroute' { 'omniroute' }; 'opencode-ai' { 'opencode' }
              default { throw "Unknown npm executable mapping: $PackageName" }
            }
            if (-not $npm -or -not (Test-Path $npm)) { throw '❌ npm.cmd is not available.' }
            $exe = Join-Path $prefix "$command.cmd"
            $working = $false
            if (Test-Path $exe) {
              if ($command -eq 'codex') { & $exe --version | Out-Host; $working = $LASTEXITCODE -eq 0 }
              else { $working = $true }
            }
            if (-not $working) {
              Write-Host "📦 Installing $PackageName in shared RDP-accessible prefix: $prefix"
              & $npm install --global --prefix $prefix --include=optional --no-audit --no-fund "$PackageName@latest" | Out-Host
              if ($LASTEXITCODE -ne 0 -or -not (Test-Path $exe)) { throw "❌ npm package failed verification: $PackageName" }
            }
            $node = (Get-Command node.exe -ErrorAction Stop).Source
            $nodeDir = Split-Path $node
            $machine = [Environment]::GetEnvironmentVariable('Path','Machine')
            $entries = @($machine -split ';' | Where-Object { $_ })
            foreach ($entry in @($prefix,$nodeDir)) { if ($entry -notin $entries) { $entries += $entry } }
            [Environment]::SetEnvironmentVariable('Path', ($entries -join ';'), 'Machine')
            $env:Path = "$prefix;$nodeDir;" + $env:Path
            "RDP_NPM_PREFIX=$prefix" | Add-Content $env:GITHUB_ENV -Encoding UTF8
            $prefix | Add-Content $env:GITHUB_PATH -Encoding UTF8
            if ($command -eq 'codex') {
              $data = Invoke-RdpUserTask -Name CodexVersion -TimeoutSeconds 90 -Context @{ Executable = $exe } -Script {
                $version = & $ctx.Executable --version 2>&1
                if ($LASTEXITCODE -ne 0) { throw "Codex --version failed for RDP: $version" }
                [pscustomobject]@{ Executable = $ctx.Executable; Version = ($version -join ' ') }
              }
              "CODEX_EXE=$exe" | Add-Content $env:GITHUB_ENV -Encoding UTF8
              Write-Host "✅ Codex --version as RDP: $($data.Version)"
            }
          }

          function Install-MetaTrader {
            param(
              [Parameter(Mandatory = $true)]
              [ValidateSet('mt4', 'mt5')]
              [string] $Version
            )
            # Same checked installer is run by Windows CI, not an untested
            # inline copy. Start-Job workers inherit GITHUB_WORKSPACE.
