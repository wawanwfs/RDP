            }

            Write-Warning "⚠️ Extension install failed: $ExtensionName [$ExtensionId]"
            return $false
          }

          function Register-RdpLogonTask {
            param(
              [Parameter(Mandatory = $true)] [string] $TaskName,
              [Parameter(Mandatory = $true)] [string] $ScriptPath
            )

            try {
              $action = New-ScheduledTaskAction `
                -Execute "powershell.exe" `
                -Argument "-NoProfile -ExecutionPolicy Bypass -File `"$ScriptPath`""

              $trigger = New-ScheduledTaskTrigger -AtLogOn -User $env:RDP_USER

              try {
                $trigger.Delay = "PT1M"
              } catch {
                Write-Host "Trigger delay is not supported on this runner. Continuing without delay."
              }

              Register-ScheduledTask `
                -TaskName $TaskName `
                -Action $action `
                -Trigger $trigger `
                -User $env:RDP_USER `
                -Password $env:RDP_PASSWORD `
                -RunLevel Highest `
                -Force | Out-Null

              Write-Host "✅ Logon task registered for ${env:RDP_USER}: $TaskName"
            } catch {
              Write-Warning "⚠️ Could not register logon task '$TaskName': $($_.Exception.Message)"
            }
          }


          $helperPath = Join-Path $env:RUNNER_TEMP 'rdp-install-helpers.ps1'
          $names = @('Install-NpmGlobalPackage', 'Install-MetaTrader', 'Install-ArtCraft', 'Install-OfficialPowerShellApp', 'Set-ChromeDefaultAssociations', 'Resolve-VSCodeCli', 'Resolve-AntigravityExecutable', 'Install-EditorExtension', 'Register-RdpLogonTask')
          $definitions = foreach ($name in $names) {
            $definition = (Get-Command $name -CommandType Function -ErrorAction Stop).Definition
            "function $name {`n$definition`n}"
          }
          Add-Content -LiteralPath $helperPath -Value ($definitions -join "`n`n") -Encoding UTF8

      - name: 📦 Install Apps in Parallel (Skip Existing)
        shell: pwsh
        run: |
          Write-Host "==========================================="
          Write-Host " 🚀 Installing requested apps, IDE and extensions"
          Write-Host "==========================================="

          $ideChoice = '${{ inputs.ide_choice }}'
          $editorChoice = '${{ inputs.editor_choice }}'
          $metatraderChoice = '${{ inputs.metatrader_choice }}'
          $routerChoice = '${{ inputs.router_choice }}'
          $codingAgentChoice = '${{ inputs.coding_agent_choice }}'
          $aiAgentChoice = '${{ inputs.ai_agent_choice }}'
          $installArtCraft = '${{ inputs.install_artcraft }}' -eq 'true'

          $wantedVSCode = $ideChoice -in @("vscode", "both")
          $wantedAntigravity = $ideChoice -in @("antigravity", "both")
          $wantedCapCut = $editorChoice -in @("capcut", "both")
          $wantedShotcut = $editorChoice -in @("shotcut", "both")

          Write-Host "💻 IDE choice          : $ideChoice"
          Write-Host "🎬 Video editor choice : $editorChoice"
          Write-Host "📈 MetaTrader choice   : $metatraderChoice"
          Write-Host "🔀 Router choice       : $routerChoice"
          Write-Host "🧑‍💻 Coding agent choice : $codingAgentChoice"
          Write-Host "🤖 AI agent choice     : $aiAgentChoice"
          Write-Host "🎨 Install ArtCraft Launcher: $installArtCraft"

          # Resolve winget only; existing apps do not require source refresh/download.
          $winget = (Get-Command winget.exe -ErrorAction SilentlyContinue).Source
          if (-not $winget) {
            $winget = Get-ChildItem -Path "$env:ProgramFiles\WindowsApps\Microsoft.DesktopAppInstaller_*\winget.exe" -File -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          }

          $helperPath = Join-Path $env:RUNNER_TEMP 'rdp-install-helpers.ps1'
          if (-not (Test-Path -LiteralPath $helperPath)) { throw "❌ Installation helper script missing: $helperPath" }
          . $helperPath

          # 🔗 Node is a shared prerequisite. Do not let concurrent workers modify npm's store.
          Install-WingetPackage -Id 'OpenJS.NodeJS.LTS' -Name 'Node.js LTS' | Out-Null
          Refresh-InstallerPath
          $config = @{
            ideChoice = $ideChoice; editorChoice = $editorChoice
            metatraderChoice = $metatraderChoice; routerChoice = $routerChoice
            codingAgentChoice = $codingAgentChoice; aiAgentChoice = $aiAgentChoice
            wantedVSCode = $wantedVSCode; wantedAntigravity = $wantedAntigravity
            wantedCapCut = $wantedCapCut; wantedShotcut = $wantedShotcut
            winget = $winget
          }
          $tasks = [Collections.Generic.List[object]]::new()
          function Add-InstallTask {
            param([string] $Name, [scriptblock] $Action, [bool] $Required = $false)
            $taskDir = Join-Path $env:RUNNER_TEMP ("rdp-task-" + $Name)
            New-Item -Path $taskDir -ItemType Directory -Force | Out-Null
            $job = Start-Job -Name $Name -ArgumentList $helperPath, $config, $Action.ToString(), $taskDir -ScriptBlock {
              param($Helpers, $Config, $Code, $TaskDir)
              $ErrorActionPreference = 'Stop'
              $env:GITHUB_ENV = Join-Path $TaskDir 'env.txt'
              $env:GITHUB_PATH = Join-Path $TaskDir 'path.txt'
              Set-Content -LiteralPath (Join-Path $TaskDir 'pid.txt') -Value $PID
              . $Helpers
              foreach ($entry in $Config.GetEnumerator()) { Set-Variable -Name $entry.Key -Value $entry.Value }
              Refresh-InstallerPath
              $clock = [Diagnostics.Stopwatch]::StartNew()
              try {
                & ([scriptblock]::Create($Code)) | Out-Host
              } finally {
                Write-Host ("⏱️ TIME GROUP {0}: {1:N1}s" -f (Split-Path $TaskDir -Leaf), $clock.Elapsed.TotalSeconds)
              }
              $global:LASTEXITCODE = 0
            }
            $tasks.Add([pscustomobject]@{ Job = $job; Name = $Name; Required = $Required; Dir = $taskDir; Started = [datetime]::UtcNow })
          }

          Add-InstallTask -Name 'gui' -Required $true -Action {
          # Base applications retained for every run.
          Install-WingetPackage `
            -Id "Google.Chrome" `
            -Name "Google Chrome" `
            -FallbackInstaller {
              $is64BitRunner = [Environment]::Is64BitOperatingSystem
              $chromeMsiUrl = if ($is64BitRunner) {
                "https://dl.google.com/dl/chrome/install/googlechromestandaloneenterprise64.msi"
              } else {
                "https://dl.google.com/dl/chrome/install/googlechromestandaloneenterprise.msi"
              }
              $chromeMsiPath = Join-Path $env:TEMP "chrome-enterprise.msi"

              Write-Host "🌐 📥 Downloading fallback Chrome installer from: $chromeMsiUrl"
              Invoke-WebRequest `
                -Uri $chromeMsiUrl `
                -OutFile $chromeMsiPath `
                -UseBasicParsing `
                -TimeoutSec 120 `
                -ErrorAction Stop

              if (-not (Test-Path $chromeMsiPath)) {
                throw "❌ Chrome MSI fallback download failed."
              }

              $chromeExit = Invoke-BoundedInstaller -FilePath 'msiexec.exe' `
                -Arguments @('/i', "`"$chromeMsiPath`"", '/qn', '/norestart') -TimeoutSeconds 300

              Remove-Item $chromeMsiPath -Force -ErrorAction SilentlyContinue

              if ($chromeExit -notin @(0, 3010, 1641)) {
                throw "❌ Chrome MSI fallback install failed with exit code $chromeExit."
              }
            }

          Install-WingetPackage -Id "RARLab.WinRAR" -Name "WinRAR"

          # Apply Chrome as the default browser for new Windows profiles and through policy.
          Set-ChromeDefaultAssociations

          # IDE choice: default none.
          if ($wantedAntigravity) {
            Invoke-OptionalInstall 'Antigravity IDE' {
              Install-WingetPackage -Id "Google.AntigravityIDE" -Name "Antigravity IDE" -Optional | Out-Null
            }
          } else {
            Write-Host "⏭️ Skipping Antigravity IDE because ide_choice=$ideChoice"
          }

          if ($wantedVSCode) {
            Invoke-OptionalInstall 'Visual Studio Code' {
              Install-WingetPackage -Id "Microsoft.VisualStudioCode" -Name "Visual Studio Code" -Scope "machine" -Optional | Out-Null
            }
          } else {
            Write-Host "⏭️ Skipping Visual Studio Code because ide_choice=$ideChoice"
          }

          if ($wantedVSCode) {
            $vscodeMachineExe = Resolve-AppTarget `
              -CandidatePaths @(
                "$env:ProgramFiles\Microsoft VS Code\Code.exe",
                "${env:ProgramFiles(x86)}\Microsoft VS Code\Code.exe"
              ) `
              -SearchRoots @(
                "$env:ProgramFiles\Microsoft VS Code",
                "${env:ProgramFiles(x86)}\Microsoft VS Code"
              ) `
              -ExecutableNames @("Code.exe")

            if ($vscodeMachineExe) {
              Write-Host "🔎 VS Code machine-wide executable found: $vscodeMachineExe"
            } else {
              Write-Warning "⚠️ VS Code executable was not found after installation. Check the winget logs."
            }
          }

          # Video editor choice: default none.
          if ($wantedCapCut) {
            Invoke-OptionalInstall 'CapCut' {
              Install-CapCutForRdp
            }
          }

          if ($wantedShotcut) {
            Invoke-OptionalInstall 'Shotcut' {
              Install-WingetPackage -Id "Meltytech.Shotcut" -Name "Shotcut" -Optional | Out-Null
            }
          }

          # MetaTrader 5 is from MetaQuotes; MT4 from the official Exness download URL (generic MT4 links may install MT5).
          if ($metatraderChoice -in @('mt4', 'both')) {
            Invoke-OptionalInstall 'MetaTrader 4' {
              Install-MetaTrader -Version 'mt4'
            }
          }

          if ($metatraderChoice -in @('mt5', 'both')) {
            Invoke-OptionalInstall 'MetaTrader 5' {
              Install-MetaTrader -Version 'mt5'
            }
          }

          }

          if ($routerChoice -ne 'none' -or $codingAgentChoice -ne 'none' -or $aiAgentChoice -ne 'none') {
          Add-InstallTask -Name 'cli' -Required $true -Action {
          # Resolve npm after Node.js installation. Node.js is retained as a base dependency.
          $npm = $null
          $npmCandidates = @(
            "$env:ProgramFiles\nodejs\npm.cmd",
            "${env:ProgramFiles(x86)}\nodejs\npm.cmd"
          )

          $npm = $npmCandidates |
            Where-Object { $_ -and (Test-Path $_) } |
            Select-Object -First 1

          if (-not $npm) {
            $npm = (Get-Command npm.cmd -ErrorAction SilentlyContinue).Source
          }

          if (-not $npm) {
            Write-Error "npm.cmd was not found after Node.js installation."
            exit 1
          }

          # AI API routers: default none.
          if ($routerChoice -in @('9router', 'both')) {
            Invoke-OptionalInstall '9Router' {
              Install-NpmGlobalPackage -PackageName '9router'
            }
          }

          if ($routerChoice -in @('omniroute', 'both')) {
            Invoke-OptionalInstall 'OmniRoute' {
              Install-NpmGlobalPackage -PackageName 'omniroute'
            }
          }

          # Coding agents: default none. Codex uses its npm package; Claude Code uses its official installer.
          if ($codingAgentChoice -in @('codex', 'both')) {
            Invoke-OptionalInstall 'Codex CLI' {
              Install-NpmGlobalPackage -PackageName '@openai/codex'
            }
          }

          if ($codingAgentChoice -in @('claude', 'both')) {
            Invoke-OptionalInstall 'Claude Code' {
              Install-ClaudeForRdp
            }
          }

          # Native Windows installers are run non-interactively to avoid hanging the workflow.
          if ($aiAgentChoice -in @('hermes', 'both', 'all')) {
            Invoke-OptionalInstall 'Hermes Agent' {
              Install-OfficialPowerShellApp `
                -Name 'Hermes Agent' `
                -Uri 'https://hermes-agent.nousresearch.com/install.ps1' `
                -Mode 'hermes'
            }
          }

          if ($aiAgentChoice -in @('openclaw', 'both', 'all')) {
            Invoke-OptionalInstall 'OpenClaw' {
              Install-OfficialPowerShellApp `
                -Name 'OpenClaw' `
                -Uri 'https://openclaw.ai/install.ps1' `
                -Mode 'openclaw'
            }
          }

          if ($aiAgentChoice -in @('opencode', 'all')) {
            Invoke-OptionalInstall 'OpenCode' {
              Install-NpmGlobalPackage -PackageName 'opencode-ai'
            }
          }

          }
          }

          if ($installArtCraft) {
          Add-InstallTask -Name 'artcraft' -Required $true -Action {
          Install-ArtCraft
          }
          }

          # 🚀 Maximum three workers: GUI installers, CLI agents, and ArtCraft Launcher (download may overlap, MSI stays serialized).
          # GUI installers remain serial; npm commands remain serial inside the CLI worker.
          $requiredFailures = [Collections.Generic.List[string]]::new()
          $pending = [Collections.Generic.List[object]]::new()
          foreach ($task in $tasks) { $pending.Add($task) }
          try {
            while ($pending.Count -gt 0) {
              foreach ($task in @($pending.ToArray())) {
                Receive-Job -Job $task.Job -ErrorAction Continue
                $timedOut = $task.Job.State -in @('Running', 'NotStarted') -and ([datetime]::UtcNow - $task.Started).TotalSeconds -gt 1200
                if ($timedOut) {
                  # Kill worker AND descendants, rather than leaving installer processes running.
                  $pidFile = Join-Path $task.Dir 'pid.txt'
                  if (Test-Path $pidFile) {
                    $workerPid = [int](Get-Content $pidFile -Raw).Trim()
                    & taskkill.exe /PID $workerPid /T /F 2>&1 | Out-Host
                  }
                  Stop-Job -Job $task.Job -ErrorAction SilentlyContinue
                  Write-Warning "⚠️ Group $($task.Name) exceeded 20 minutes and was terminated."
                }
                if ($task.Job.State -notin @('Running', 'NotStarted')) {
                  Receive-Job -Job $task.Job -ErrorAction Continue
                  $ok = $task.Job.State -eq 'Completed' -and -not $timedOut
                  Write-Host "📋 RESULT GROUP $($task.Name): $($task.Job.State)"
                  if (-not $ok) {
                    if ($task.Required) { $requiredFailures.Add($task.Name) }
                    else { Write-Warning "⚠️ Optional group $($task.Name) failed; see log above." }
                  }
                  # Merge command files only after successful completion; no concurrent appends.
                  if ($ok) {
                    foreach ($pair in @(@('env.txt', $env:GITHUB_ENV), @('path.txt', $env:GITHUB_PATH))) {
                      $file = Join-Path $task.Dir $pair[0]
                      if (Test-Path -LiteralPath $file) {
                        Get-Content -LiteralPath $file | Add-Content -LiteralPath $pair[1] -Encoding UTF8
                      }
                    }
                  }
                  Remove-Job -Job $task.Job -Force -ErrorAction SilentlyContinue
                  $pending.Remove($task) | Out-Null
                }
              }
              if ($pending.Count -gt 0) { Start-Sleep -Seconds 2 }
            }
          } finally {
            foreach ($task in $pending) {
              $pidFile = Join-Path $task.Dir 'pid.txt'
              if (Test-Path $pidFile) {
                $workerPid = [int](Get-Content $pidFile -Raw).Trim()
                & taskkill.exe /PID $workerPid /T /F 2>&1 | Out-Host
              }
              Stop-Job -Job $task.Job -ErrorAction SilentlyContinue
              Remove-Job -Job $task.Job -Force -ErrorAction SilentlyContinue
            }
          }
          if ($requiredFailures.Count -gt 0) { throw "❌ Required installation group failed: $($requiredFailures -join ', ')" }
          Refresh-InstallerPath


          $global:LASTEXITCODE = 0

      - name: 🧩 Configure IDE Extensions and Chrome Policy
        shell: pwsh
        run: |
          . (Join-Path $env:RUNNER_TEMP 'rdp-install-helpers.ps1')
          $wantedVSCode = '${{ inputs.ide_choice }}' -in @('vscode', 'both')
          $wantedAntigravity = '${{ inputs.ide_choice }}' -in @('antigravity', 'both')
          # IDE extensions: Codex + Office Viewer
          $editorExtensions = @(
            @{ Id = "OpenAI.chatgpt"; Name = "Codex / ChatGPT by OpenAI" },
            @{ Id = "cweijan.vscode-office"; Name = "Office Viewer" }
          )

          if ($wantedVSCode) {
            $codeCli = Resolve-VSCodeCli

            if ($codeCli) {
              foreach ($extension in $editorExtensions) {
                Install-EditorExtension -ToolPath $codeCli -ExtensionId $extension.Id -ExtensionName $extension.Name | Out-Null
              }
            } else {
              Write-Warning "⚠️ VS Code CLI code.cmd was not found. VS Code extensions will be installed by the RDP logon task if possible."
            }
          }

          if ($wantedAntigravity) {
            $antigravityExe = Resolve-AntigravityExecutable

            if ($antigravityExe) {
              foreach ($extension in $editorExtensions) {
                Install-EditorExtension -ToolPath $antigravityExe -ExtensionId $extension.Id -ExtensionName $extension.Name | Out-Null
              }
            } else {
              Write-Warning "⚠️ Antigravity executable was not found yet. Extensions will be installed by launcher/logon task if the editor supports VS Code extension CLI flags."
            }
          }

          # Prepare user-context extension install tasks for the RDP user.
          # VS Code and VS Code-compatible IDE extensions are user-scoped, so this makes them ready after RDP login.
          $setupDir = Join-Path $env:ProgramData "RDP-Setup"
          New-Item -ItemType Directory -Path $setupDir -Force | Out-Null

          if ($wantedVSCode) {
            $vscodeRdpScript = Join-Path $setupDir "install-vscode-extensions-for-rdp.ps1"

            @'
          $ErrorActionPreference = "Continue"

          $extensions = @(
            "OpenAI.chatgpt",
            "cweijan.vscode-office"
          )

          function Resolve-VSCodeCli {
            $candidates = @(
              "$env:ProgramFiles\Microsoft VS Code\bin\code.cmd",
              "${env:ProgramFiles(x86)}\Microsoft VS Code\bin\code.cmd",
              "$env:LOCALAPPDATA\Programs\Microsoft VS Code\bin\code.cmd"
            )

            foreach ($candidate in $candidates) {
              if ($candidate -and (Test-Path $candidate)) {
                return (Resolve-Path $candidate).Path
              }
            }

            $cmd = (Get-Command code.cmd -ErrorAction SilentlyContinue).Source
            if ($cmd) { return $cmd }

            return $null
          }

          $codeCli = $null

          for ($i = 0; $i -lt 12 -and -not $codeCli; $i++) {
            $codeCli = Resolve-VSCodeCli
            if (-not $codeCli) {
              Start-Sleep -Seconds 10
            }
          }

          if ($codeCli) {
            foreach ($extension in $extensions) {
              & $codeCli --install-extension $extension --force
            }

            $settingsDir = Join-Path $env:APPDATA "Code\User"
            New-Item -ItemType Directory -Path $settingsDir -Force | Out-Null

            $settingsPath = Join-Path $settingsDir "settings.json"
            $settings = [ordered]@{
              "workbench.startupEditor" = "none"
              "extensions.ignoreRecommendations" = $true
              "telemetry.telemetryLevel" = "off"
            }

            $settings | ConvertTo-Json -Depth 5 | Set-Content -Path $settingsPath -Encoding UTF8
          } else {
            Write-Host "VS Code CLI was not found for user $env:USERNAME."
          }

          Unregister-ScheduledTask -TaskName "Install VS Code Extensions for RDP" -Confirm:$false -ErrorAction SilentlyContinue
          '@ | Set-Content -Path $vscodeRdpScript -Encoding UTF8

            Register-RdpLogonTask -TaskName "Install VS Code Extensions for RDP" -ScriptPath $vscodeRdpScript
          }

          if ($wantedAntigravity) {
            $antigravityRdpScript = Join-Path $setupDir "install-antigravity-extensions-for-rdp.ps1"

            @'
          $ErrorActionPreference = "Continue"

          $extensions = @(
            "OpenAI.chatgpt",
            "cweijan.vscode-office"
          )

          function Resolve-AntigravityExecutable {
            $candidateExePaths = @(
              "$env:LOCALAPPDATA\Programs\Antigravity IDE\Antigravity IDE.exe",
              "$env:LOCALAPPDATA\Antigravity IDE\Antigravity IDE.exe",
              "C:\Users\runneradmin\AppData\Local\Programs\Antigravity IDE\Antigravity IDE.exe",
              "$env:ProgramFiles\Antigravity IDE\Antigravity IDE.exe",
              "${env:ProgramFiles(x86)}\Antigravity IDE\Antigravity IDE.exe"
            )

            foreach ($candidate in $candidateExePaths) {
              if ([string]::IsNullOrWhiteSpace($candidate)) { continue }
              if (Test-Path $candidate) {
                return (Resolve-Path $candidate).Path
              }
            }

            $searchRoots = @(
              "$env:LOCALAPPDATA\Programs\Antigravity IDE",
              "$env:LOCALAPPDATA\Antigravity IDE",
              "$env:ProgramFiles\Antigravity IDE",
              "${env:ProgramFiles(x86)}\Antigravity IDE"
            )

            foreach ($root in $searchRoots) {
              if ([string]::IsNullOrWhiteSpace($root) -or -not (Test-Path $root)) { continue }

              $found = Get-ChildItem `
                -Path $root `
                -Include "Antigravity IDE.exe", "antigravity-ide.exe" `
                -File `
                -Recurse -Depth 3 `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                return $found.FullName
              }
            }

            return $null
          }

          $antigravityExe = $null

          for ($i = 0; $i -lt 12 -and -not $antigravityExe; $i++) {
            $antigravityExe = Resolve-AntigravityExecutable
            if (-not $antigravityExe) {
              Start-Sleep -Seconds 10
            }
          }

          if ($antigravityExe) {
            foreach ($extension in $extensions) {
              & $antigravityExe --install-extension $extension --force
            }

            $settingsRoots = @(
              (Join-Path $env:APPDATA "Antigravity\User"),
              (Join-Path $env:APPDATA "Antigravity IDE\User")
            )

            foreach ($settingsDir in $settingsRoots) {
              New-Item -ItemType Directory -Path $settingsDir -Force | Out-Null
              $settingsPath = Join-Path $settingsDir "settings.json"
              $settings = [ordered]@{
                "workbench.startupEditor" = "none"
                "extensions.ignoreRecommendations" = $true
              }

              $settings | ConvertTo-Json -Depth 5 | Set-Content -Path $settingsPath -Encoding UTF8
            }
          } else {
            Write-Host "Antigravity executable was not found for user $env:USERNAME."
          }

          Unregister-ScheduledTask -TaskName "Install Antigravity Extensions for RDP" -Confirm:$false -ErrorAction SilentlyContinue
          '@ | Set-Content -Path $antigravityRdpScript -Encoding UTF8

            Register-RdpLogonTask -TaskName "Install Antigravity Extensions for RDP" -ScriptPath $antigravityRdpScript
          }

          # Force install Chrome extensions for all users via Chrome enterprise policy
          $extensionUpdateUrl = "https://clients2.google.com/service/update2/crx"
          $chromePolicyPath = "HKLM:\Software\Policies\Google\Chrome\ExtensionInstallForcelist"

          New-Item -Path $chromePolicyPath -Force | Out-Null

          $chromeExtensions = @(
            "hlkenndednhfkekhgcdicdfddnkalmdm;$extensionUpdateUrl", # Cookie-Editor
            "fdpohaocaechififmbbbbbknoalclacl;$extensionUpdateUrl"  # GoFullPage
          )

          for ($i = 0; $i -lt $chromeExtensions.Count; $i++) {
            New-ItemProperty `
              -Path $chromePolicyPath `
              -Name "$($i + 1)" `
              -Value $chromeExtensions[$i] `
              -PropertyType String `
              -Force | Out-Null
          }

          Write-Host "✅ Chrome extensions policy configured"
          Write-Host "   - Cookie-Editor"
          Write-Host "   - GoFullPage"
          Write-Host "✅ App and IDE setup completed"

          $global:LASTEXITCODE = 0

      - name: 🧬 Prepare Antigravity IDE for RDP User
        if: ${{ inputs.ide_choice == 'antigravity' || inputs.ide_choice == 'both' }}
        shell: pwsh
        run: |
          Write-Host "==========================================="
          Write-Host " Preparing Antigravity IDE for RDP user"
          Write-Host "==========================================="
          Write-Host "Antigravity IDE is installed with user scope under runneradmin. This step stages it in ProgramData and prepares a per-user copy for $env:RDP_USER."

          $setupDir = Join-Path $env:ProgramData "RDP-Setup"
          $antigravityStagingRoot = Join-Path $setupDir "Antigravity IDE"
          $antigravityLauncherScript = Join-Path $setupDir "launch-antigravity-ide.ps1"
          $antigravityCopyScript = Join-Path $setupDir "copy-antigravity-ide-for-rdp.ps1"

          New-Item -ItemType Directory -Path $setupDir -Force | Out-Null

          function Resolve-AntigravityIdeExe {
            $candidateExePaths = @(
              "$env:LOCALAPPDATA\Programs\Antigravity IDE\Antigravity IDE.exe",
              "$env:LOCALAPPDATA\Antigravity IDE\Antigravity IDE.exe",
              "C:\Users\runneradmin\AppData\Local\Programs\Antigravity IDE\Antigravity IDE.exe",
              "$env:ProgramFiles\Antigravity IDE\Antigravity IDE.exe",
              "${env:ProgramFiles(x86)}\Antigravity IDE\Antigravity IDE.exe"
            )

            foreach ($candidate in $candidateExePaths) {
              if ([string]::IsNullOrWhiteSpace($candidate)) { continue }
              if (Test-Path $candidate) {
                return (Resolve-Path $candidate).Path
              }
            }

            $searchRoots = @(
              "$env:LOCALAPPDATA\Programs",
              "$env:LOCALAPPDATA",
              "C:\Users\runneradmin\AppData\Local\Programs",
              "$env:ProgramFiles",
              "${env:ProgramFiles(x86)}"
            )

            foreach ($root in $searchRoots) {
              if ([string]::IsNullOrWhiteSpace($root) -or -not (Test-Path $root)) { continue }

              $found = Get-ChildItem `
                -Path $root `
                -Include "Antigravity IDE.exe", "antigravity-ide.exe" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                return $found.FullName
              }
            }

            return $null
          }

          $antigravitySourceExe = Resolve-AntigravityIdeExe

          if (-not $antigravitySourceExe) {
            Write-Warning "⚠️ Antigravity IDE executable was not found. RDP user copy and launcher will still be prepared, but shortcut may not work until the package path is corrected."
          } else {
            $antigravitySourceDir = Split-Path $antigravitySourceExe -Parent
            Write-Host "Found Antigravity IDE source: $antigravitySourceDir"

            if (Test-Path $antigravityStagingRoot) {
              Remove-Item -Path $antigravityStagingRoot -Recurse -Force -ErrorAction SilentlyContinue
            }

            New-Item -ItemType Directory -Path $antigravityStagingRoot -Force | Out-Null
            Copy-Item -Path (Join-Path $antigravitySourceDir "*") -Destination $antigravityStagingRoot -Recurse -Force
            Write-Host "✅ Antigravity IDE staged to: $antigravityStagingRoot"
          }

          @'
          $ErrorActionPreference = "Continue"

          $sourceRoot = Join-Path $env:ProgramData "RDP-Setup\Antigravity IDE"
          $destRoot = Join-Path $env:LOCALAPPDATA "Programs\Antigravity IDE"
          $sourceExe = Join-Path $sourceRoot "Antigravity IDE.exe"
          $destExe = Join-Path $destRoot "Antigravity IDE.exe"

          if (-not (Test-Path $sourceExe)) {
            Write-Host "Antigravity IDE staged source not found: $sourceExe"
            exit 1
          }

          $shouldCopy = -not (Test-Path $destExe)

          if (-not $shouldCopy) {
            try {
              $sourceTime = (Get-Item $sourceExe).LastWriteTimeUtc
              $destTime = (Get-Item $destExe).LastWriteTimeUtc
              if ($sourceTime -gt $destTime) {
                $shouldCopy = $true
              }
            } catch {
              $shouldCopy = $true
            }
          }

          if ($shouldCopy) {
            New-Item -ItemType Directory -Path $destRoot -Force | Out-Null
            Copy-Item -Path (Join-Path $sourceRoot "*") -Destination $destRoot -Recurse -Force
          }

          if (Test-Path $destExe) {
            $extensions = @(
              "OpenAI.chatgpt",
              "cweijan.vscode-office"
            )

            foreach ($extension in $extensions) {
              & $destExe --install-extension $extension --force
            }

            Start-Process -FilePath $destExe
          } else {
            Write-Host "Antigravity IDE executable not found after copy: $destExe"
            exit 1
          }
          '@ | Set-Content -Path $antigravityLauncherScript -Encoding UTF8

          @'
          $ErrorActionPreference = "Continue"

          $sourceRoot = Join-Path $env:ProgramData "RDP-Setup\Antigravity IDE"
          $destRoot = Join-Path $env:LOCALAPPDATA "Programs\Antigravity IDE"
          $sourceExe = Join-Path $sourceRoot "Antigravity IDE.exe"
          $destExe = Join-Path $destRoot "Antigravity IDE.exe"

          if (Test-Path $sourceExe) {
            if (-not (Test-Path $destExe)) {
              New-Item -ItemType Directory -Path $destRoot -Force | Out-Null
              Copy-Item -Path (Join-Path $sourceRoot "*") -Destination $destRoot -Recurse -Force
            }
          }

          if (Test-Path $destExe) {
            $extensions = @(
              "OpenAI.chatgpt",
              "cweijan.vscode-office"
            )

            foreach ($extension in $extensions) {
              & $destExe --install-extension $extension --force
            }
          }

          Unregister-ScheduledTask -TaskName "Prepare Antigravity IDE for RDP" -Confirm:$false -ErrorAction SilentlyContinue
          '@ | Set-Content -Path $antigravityCopyScript -Encoding UTF8

          # If the RDP profile already exists, copy immediately. Otherwise the logon task and launcher will do it after RDP signs in.
          $rdpProfile = Join-Path "C:\Users" $env:RDP_USER
          $rdpAntigravityDest = Join-Path $rdpProfile "AppData\Local\Programs\Antigravity IDE"

          if ((Test-Path $rdpProfile) -and (Test-Path $antigravityStagingRoot)) {
            New-Item -ItemType Directory -Path $rdpAntigravityDest -Force | Out-Null
            Copy-Item -Path (Join-Path $antigravityStagingRoot "*") -Destination $rdpAntigravityDest -Recurse -Force
            Write-Host "✅ Antigravity IDE copied immediately to RDP profile: $rdpAntigravityDest"
          } else {
            Write-Host "RDP profile is not ready yet. Antigravity IDE will be copied when $env:RDP_USER logs in or opens the shortcut."
          }

          try {
            $action = New-ScheduledTaskAction `
              -Execute "powershell.exe" `
              -Argument "-NoProfile -ExecutionPolicy Bypass -File `"$antigravityCopyScript`""

            $trigger = New-ScheduledTaskTrigger -AtLogOn -User $env:RDP_USER

            Register-ScheduledTask `
              -TaskName "Prepare Antigravity IDE for RDP" `
              -Action $action `
              -Trigger $trigger `
              -User $env:RDP_USER `
              -Password $env:RDP_PASSWORD `
              -RunLevel Highest `
              -Force | Out-Null

            Write-Host "✅ One-time Antigravity IDE copy task registered for $env:RDP_USER"
          } catch {
            Write-Warning "⚠️ Could not register Antigravity IDE copy task: $($_.Exception.Message)"
          }

          Write-Host "✅ Antigravity IDE RDP preparation completed"

      - name: 🧷 Publish App Shortcuts for RDP User
        shell: pwsh
        run: |
          Write-Host "==========================================="
          Write-Host " Publishing installed apps to RDP user UI"
          Write-Host "==========================================="
          Write-Host "Apps may be installed under runneradmin/user scope. Shortcuts below are published through Public Desktop and the common Start Menu so they appear when logging in as $env:RDP_USER."

          $ideChoice = '${{ inputs.ide_choice }}'
          $editorChoice = '${{ inputs.editor_choice }}'
          $metatraderChoice = '${{ inputs.metatrader_choice }}'
          $routerChoice = '${{ inputs.router_choice }}'
          $codingAgentChoice = '${{ inputs.coding_agent_choice }}'
          $aiAgentChoice = '${{ inputs.ai_agent_choice }}'
          $installArtCraft = '${{ inputs.install_artcraft }}' -eq 'true'

          $wantedVSCode = $ideChoice -in @("vscode", "both")
          $wantedAntigravity = $ideChoice -in @("antigravity", "both")
          $wantedCapCut = $editorChoice -in @("capcut", "both")
          $wantedShotcut = $editorChoice -in @("shotcut", "both")
          $wantedOpenCode = $aiAgentChoice -in @("opencode", "all")

          $publicDesktop = Join-Path $env:PUBLIC "Desktop"
          $commonStartMenu = Join-Path $env:ProgramData "Microsoft\Windows\Start Menu\Programs"

          # Explorer merges Public and per-user Desktop/Start Menu automatically.
          # Publish to one shared location per surface to avoid duplicate icons.
          $shortcutDirectories = @($publicDesktop, $commonStartMenu)
          $rdpProfile = Join-Path "C:\Users" $env:RDP_USER
          $rdpDesktop = Join-Path $rdpProfile "Desktop"

          foreach ($dir in $shortcutDirectories) {
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
          }

          function Resolve-AppTarget {
            param(
              [string[]] $CandidatePaths = @(),
              [string[]] $SearchRoots = @(),
              [string[]] $ExecutableNames = @()
            )

            foreach ($candidate in $CandidatePaths) {
              if ([string]::IsNullOrWhiteSpace($candidate)) { continue }

              $expanded = [Environment]::ExpandEnvironmentVariables($candidate)
              if (Test-Path $expanded) {
                return (Resolve-Path $expanded).Path
              }
            }

            foreach ($root in $SearchRoots) {
              if ([string]::IsNullOrWhiteSpace($root)) { continue }

              $expandedRoot = [Environment]::ExpandEnvironmentVariables($root)
              if (-not (Test-Path $expandedRoot)) { continue }

              foreach ($exeName in $ExecutableNames) {
                $found = Get-ChildItem `
                  -Path $expandedRoot `
                  -Filter $exeName `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  Select-Object -First 1

                if ($found) {
                  return $found.FullName
                }
              }
            }

            return $null
          }

          function New-AppShortcut {
            param(
              [Parameter(Mandatory = $true)] [string] $Name,
              [AllowNull()] [string] $TargetPath,
              [string] $Arguments = "",
              [string] $IconLocation = "",
              [string] $WorkingDirectory = ""
            )

            if ([string]::IsNullOrWhiteSpace($TargetPath) -or -not (Test-Path $TargetPath)) {
              Write-Warning "⚠️ Shortcut skipped for $Name because target was not found: $TargetPath"
              return
            }

            $shell = New-Object -ComObject WScript.Shell

            # Installers may already have placed a shortcut on either Desktop.
            # Reuse it if the target and arguments match, even when its name differs.
            $desktopAlreadyHasApp = $false
            foreach ($desktopDir in @($rdpDesktop, $publicDesktop)) {
              if (-not (Test-Path -LiteralPath $desktopDir)) { continue }

              foreach ($existingFile in (Get-ChildItem -LiteralPath $desktopDir -Filter '*.lnk' -File -ErrorAction SilentlyContinue)) {
                try {
                  $existing = $shell.CreateShortcut($existingFile.FullName)
                  if ([string]::Equals($existing.TargetPath, $TargetPath, [StringComparison]::OrdinalIgnoreCase) -and
                      [string]::Equals($existing.Arguments, $Arguments, [StringComparison]::Ordinal)) {
                    $desktopAlreadyHasApp = $true
                    Write-Host "⏭️ Reusing existing Desktop shortcut for $Name : $($existingFile.FullName)"
                    break
                  }
                } catch {
                  Write-Warning "⚠️ Could not inspect Desktop shortcut $($existingFile.FullName): $($_.Exception.Message)"
                }
              }
              if ($desktopAlreadyHasApp) { break }
            }

            foreach ($dir in $shortcutDirectories) {
              if ($dir -eq $publicDesktop -and $desktopAlreadyHasApp) { continue }
              $shortcutPath = Join-Path $dir "$Name.lnk"
              $shortcut = $shell.CreateShortcut($shortcutPath)
              $shortcut.TargetPath = $TargetPath
              $shortcut.Arguments = $Arguments

              if ([string]::IsNullOrWhiteSpace($WorkingDirectory)) {
                $shortcut.WorkingDirectory = Split-Path $TargetPath -Parent
              } else {
                $shortcut.WorkingDirectory = $WorkingDirectory
              }

              $shortcut.IconLocation = if ([string]::IsNullOrWhiteSpace($IconLocation)) { $TargetPath } else { $IconLocation }
              $shortcut.Save()

              Write-Host "✅ Shortcut created: $shortcutPath"
            }
          }

          $runnerLocalPrograms = Join-Path $env:LOCALAPPDATA "Programs"
          $runnerRoamingNpm = Join-Path $env:ProgramData "RDP-Tools\npm"
          $antigravityLauncher = Join-Path $env:ProgramData "RDP-Setup\launch-antigravity-ide.ps1"

          $chromeTarget = Resolve-AppTarget `
            -CandidatePaths @(
              "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
              "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
            ) `
            -SearchRoots @(
              "$env:ProgramFiles\Google",
              "${env:ProgramFiles(x86)}\Google"
            ) `
            -ExecutableNames @("chrome.exe")

          $winrarTarget = Resolve-AppTarget `
            -CandidatePaths @(
              "$env:ProgramFiles\WinRAR\WinRAR.exe",
              "${env:ProgramFiles(x86)}\WinRAR\WinRAR.exe"
            ) `
            -SearchRoots @(
              "$env:ProgramFiles\WinRAR",
              "${env:ProgramFiles(x86)}\WinRAR"
            ) `
            -ExecutableNames @("WinRAR.exe")

          $vscodeTarget = Resolve-AppTarget `
            -CandidatePaths @(
              "$env:ProgramFiles\Microsoft VS Code\Code.exe",
              "${env:ProgramFiles(x86)}\Microsoft VS Code\Code.exe",
              "$runnerLocalPrograms\Microsoft VS Code\Code.exe"
            ) `
            -SearchRoots @(
              "$env:ProgramFiles\Microsoft VS Code",
              "${env:ProgramFiles(x86)}\Microsoft VS Code",
              "$runnerLocalPrograms\Microsoft VS Code"
            ) `
            -ExecutableNames @("Code.exe")

          $antigravityIdeTarget = Resolve-AppTarget `
            -CandidatePaths @(
              "$runnerLocalPrograms\Antigravity IDE\Antigravity IDE.exe",
              "$env:LOCALAPPDATA\Antigravity IDE\Antigravity IDE.exe",
              "C:\Users\runneradmin\AppData\Local\Programs\Antigravity IDE\Antigravity IDE.exe"
            ) `
            -SearchRoots @(
              $runnerLocalPrograms,
              "$env:LOCALAPPDATA",
              "C:\Users\runneradmin\AppData\Local\Programs",
              "$env:ProgramFiles\Antigravity IDE",
              "${env:ProgramFiles(x86)}\Antigravity IDE"
            ) `
            -ExecutableNames @("Antigravity IDE.exe", "antigravity-ide.exe")

          $nodeTarget = Resolve-AppTarget `
            -CandidatePaths @(
              "$env:ProgramFiles\nodejs\node.exe",
              "${env:ProgramFiles(x86)}\nodejs\node.exe"
            ) `
            -SearchRoots @(
              "$env:ProgramFiles\nodejs",
              "${env:ProgramFiles(x86)}\nodejs"
            ) `
            -ExecutableNames @("node.exe")

          $codexTarget = Resolve-AppTarget `
            -CandidatePaths @($env:CODEX_EXE, "$runnerRoamingNpm\codex.cmd")

          $nineRouterTarget = Resolve-AppTarget `
            -CandidatePaths @(
              "$runnerRoamingNpm\9router.cmd",
              "$env:ProgramFiles\nodejs\9router.cmd",
              "${env:ProgramFiles(x86)}\nodejs\9router.cmd"
            ) `
            -SearchRoots @(
              $runnerRoamingNpm,
              "$env:ProgramFiles\nodejs",
              "${env:ProgramFiles(x86)}\nodejs"
            ) `
            -ExecutableNames @("9router.cmd", "9router.ps1")

          $capCutTarget = Resolve-AppTarget `
            -CandidatePaths @($env:CAPCUT_EXE) `
            -SearchRoots @("$rdpProfile\AppData\Local\Programs\CapCut", "$rdpProfile\AppData\Local\CapCut") `
            -ExecutableNames @('CapCut.exe')

          $shotcutTarget = Resolve-AppTarget `
            -CandidatePaths @(
              "$env:ProgramFiles\Shotcut\shotcut.exe",
              "${env:ProgramFiles(x86)}\Shotcut\shotcut.exe",
              "$env:LOCALAPPDATA\Programs\Shotcut\shotcut.exe"
            ) `
            -SearchRoots @(
              "$env:ProgramFiles\Shotcut",
              "${env:ProgramFiles(x86)}\Shotcut",
              "$env:LOCALAPPDATA\Programs\Shotcut"
            ) `
            -ExecutableNames @("shotcut.exe")

          $mt4Target = Resolve-AppTarget `
            -CandidatePaths @(
              $env:MT4_TERMINAL_EXE,
              "$env:ProgramFiles\MetaTrader 4\terminal.exe",
              "${env:ProgramFiles(x86)}\MetaTrader 4\terminal.exe"
            ) `
            -SearchRoots @(
              "$env:ProgramFiles\MetaTrader 4",
              "${env:ProgramFiles(x86)}\MetaTrader 4",
              "$env:ProgramFiles\Exness MetaTrader 4",
              "${env:ProgramFiles(x86)}\Exness MetaTrader 4"
            ) `
            -ExecutableNames @("terminal.exe")

          $mt5Target = Resolve-AppTarget `
            -CandidatePaths @(
              $env:MT5_TERMINAL_EXE,
              "$env:ProgramFiles\MetaTrader 5\terminal64.exe",
              "$env:ProgramFiles\MetaTrader 5\terminal.exe",
              "${env:ProgramFiles(x86)}\MetaTrader 5\terminal.exe"
            ) `
            -SearchRoots @(
              "$env:ProgramFiles\MetaTrader 5",
              "${env:ProgramFiles(x86)}\MetaTrader 5"
            ) `
            -ExecutableNames @("terminal64.exe", "terminal.exe")

          $claudeTarget = Resolve-AppTarget `
            -CandidatePaths @($env:CLAUDE_EXE, "$rdpProfile\.local\bin\claude.exe")

          $hermesTarget = Resolve-AppTarget `
            -CandidatePaths @(
              "$env:LOCALAPPDATA\hermes\bin\hermes.exe",
              "$env:LOCALAPPDATA\hermes\bin\hermes.cmd"
            ) `
            -SearchRoots @("$env:LOCALAPPDATA\hermes\bin") `
            -ExecutableNames @("hermes.exe", "hermes.cmd")

          $openclawTarget = Resolve-AppTarget `
            -CandidatePaths @("$runnerRoamingNpm\openclaw.cmd") `
            -SearchRoots @($runnerRoamingNpm) `
            -ExecutableNames @("openclaw.cmd", "openclaw.ps1")

          $openCodeTarget = Resolve-AppTarget `
            -CandidatePaths @("$runnerRoamingNpm\opencode.cmd") `
            -SearchRoots @($runnerRoamingNpm) `
            -ExecutableNames @("opencode.cmd", "opencode.ps1")

          $omniRouteTarget = Resolve-AppTarget `
            -CandidatePaths @("$runnerRoamingNpm\omniroute.cmd") `
            -SearchRoots @($runnerRoamingNpm) `
            -ExecutableNames @("omniroute.cmd", "omniroute.ps1")

          $artCraftSid = (Get-LocalUser -Name $env:RDP_USER -ErrorAction Stop).SID.Value
          $artCraftRdpProfile = (Get-ItemProperty -LiteralPath "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$artCraftSid" -ErrorAction SilentlyContinue).ProfileImagePath
          if (-not $artCraftRdpProfile) { $artCraftRdpProfile = "$env:SystemDrive\Users\$env:RDP_USER" }
          $artCraftTarget = $env:ARTCRAFT_EXE
          if (-not $artCraftTarget -or -not (Test-Path $artCraftTarget)) {
            $artCraftTarget = Resolve-AppTarget `
              -CandidatePaths @("$artCraftRdpProfile\AppData\Local\Programs\ArtCraft\Launcher\artcraft-launcher.exe", "$artCraftRdpProfile\AppData\Local\Programs\ArtCraft Launcher\artcraft-launcher.exe") `
              -SearchRoots @("$artCraftRdpProfile\AppData\Local\Programs\ArtCraft\Launcher", "$artCraftRdpProfile\AppData\Local\Programs\ArtCraft Launcher") `
              -ExecutableNames @('artcraft-launcher.exe')
          }

          New-AppShortcut -Name "Google Chrome" -TargetPath $chromeTarget
          New-AppShortcut -Name "WinRAR" -TargetPath $winrarTarget

          if ($wantedVSCode) {
            New-AppShortcut -Name "Visual Studio Code" -TargetPath $vscodeTarget
          } else {
            Write-Host "Skipping VS Code shortcut because ide_choice=$ideChoice"
          }

          if ($wantedAntigravity) {
            if (Test-Path $antigravityLauncher) {
              $antigravityIcon = if ($antigravityIdeTarget -and (Test-Path $antigravityIdeTarget)) { $antigravityIdeTarget } else { "$env:SystemRoot\System32\shell32.dll,2" }
              New-AppShortcut -Name "Antigravity IDE" -TargetPath "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -Arguments "-NoProfile -ExecutionPolicy Bypass -File `"$antigravityLauncher`"" -IconLocation $antigravityIcon
            } else {
              New-AppShortcut -Name "Antigravity IDE" -TargetPath $antigravityIdeTarget
            }
          } else {
            Write-Host "Skipping Antigravity shortcut because ide_choice=$ideChoice"
          }

          if ($nodeTarget) {
            New-AppShortcut -Name "Node.js Command Prompt" -TargetPath "$env:SystemRoot\System32\cmd.exe" -Arguments "/k `"$nodeTarget`" --version"
          }

          $powershellTarget = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"

          if ($codingAgentChoice -in @("codex", "both")) {
            if ($codexTarget) {
              New-AppShortcut -Name "Codex CLI" -TargetPath $powershellTarget -Arguments "-NoExit -ExecutionPolicy Bypass -Command `"& '$codexTarget'`"" -IconLocation "$env:SystemRoot\System32\shell32.dll,220" -WorkingDirectory $rdpProfile
            } else {
              Write-Warning "⚠️ Codex CLI was selected but its executable was not found; shortcut skipped."
            }
          }

          if ($codingAgentChoice -in @("claude", "both")) {
            if ($claudeTarget) {
              New-AppShortcut -Name "Claude Code" -TargetPath $powershellTarget -Arguments "-NoExit -ExecutionPolicy Bypass -Command `"& '$claudeTarget'`"" -WorkingDirectory $rdpProfile
            } else {
              Write-Warning "⚠️ Claude Code was selected but its executable was not found; shortcut skipped."
            }
          }

          if ($routerChoice -in @("9router", "both")) {
            if ($nineRouterTarget) {
              New-AppShortcut -Name "9Router" -TargetPath $powershellTarget -Arguments "-NoExit -ExecutionPolicy Bypass -Command `"& '$nineRouterTarget'`"" -WorkingDirectory $rdpProfile
            } else {
              Write-Warning "⚠️ 9Router was selected but its executable was not found; shortcut skipped."
            }
          }

          if ($routerChoice -in @("omniroute", "both")) {
            if ($omniRouteTarget) {
              New-AppShortcut -Name "OmniRoute" -TargetPath $powershellTarget -Arguments "-NoExit -ExecutionPolicy Bypass -Command `"& '$omniRouteTarget'`"" -WorkingDirectory $rdpProfile
            } else {
              Write-Warning "⚠️ OmniRoute was selected but its executable was not found; shortcut skipped."
            }
          }

          if ($aiAgentChoice -in @("hermes", "both", "all")) {
            if ($hermesTarget) {
              New-AppShortcut -Name "Hermes Agent" -TargetPath $powershellTarget -Arguments "-NoExit -ExecutionPolicy Bypass -Command `"& '$hermesTarget'`"" -WorkingDirectory $rdpProfile
            } else {
              Write-Warning "⚠️ Hermes Agent was selected but its executable was not found; shortcut skipped."
            }
          }

          if ($aiAgentChoice -in @("openclaw", "both", "all")) {
            if ($openclawTarget) {
              New-AppShortcut -Name "OpenClaw" -TargetPath $powershellTarget -Arguments "-NoExit -ExecutionPolicy Bypass -Command `"& '$openclawTarget'`"" -WorkingDirectory $rdpProfile
            } else {
              Write-Warning "⚠️ OpenClaw was selected but its executable was not found; shortcut skipped."
            }
          }

          if ($wantedOpenCode) {
            if ($openCodeTarget) {
              New-AppShortcut -Name "OpenCode" -TargetPath $powershellTarget -Arguments "-NoExit -ExecutionPolicy Bypass -Command `"& '$openCodeTarget'`"" -WorkingDirectory $rdpProfile
            } else {
              Write-Warning "⚠️ OpenCode was selected but its executable was not found; shortcut skipped."
            }
          }

          if ($metatraderChoice -in @("mt4", "both")) {
            if ($mt4Target) {
              New-AppShortcut -Name "MetaTrader 4" -TargetPath $mt4Target
            } else {
              Write-Warning "⚠️ MetaTrader 4 was selected but terminal.exe was not found; shortcut skipped."
            }
          }

          if ($metatraderChoice -in @("mt5", "both")) {
            if ($mt5Target) {
              New-AppShortcut -Name "MetaTrader 5" -TargetPath $mt5Target
            } else {
              Write-Warning "⚠️ MetaTrader 5 was selected but terminal.exe was not found; shortcut skipped."
            }
          }

          if ($wantedCapCut) {
            New-AppShortcut -Name "CapCut" -TargetPath $capCutTarget
          }

          if ($wantedShotcut) {
            New-AppShortcut -Name "Shotcut" -TargetPath $shotcutTarget
          }

          if ($installArtCraft) {
            New-AppShortcut -Name "ArtCraft Launcher" -TargetPath $artCraftTarget
          }

          Write-Host "Shortcut publishing completed."

      - name: 🐾 Install Tailscale
        shell: pwsh
        run: |
          Write-Host "Detecting Windows runner architecture..."

          $tailscaleVersion = "1.98.2"
          $runnerArch = $env:RUNNER_ARCH

          if ([string]::IsNullOrWhiteSpace($runnerArch)) {
            $runnerArch = $env:PROCESSOR_ARCHITECTURE
          }

          Write-Host "Runner architecture: $runnerArch"

          switch -Regex ($runnerArch) {
            "ARM64" {
              $tsArch = "arm64"
            }
            "X64|AMD64" {
              $tsArch = "amd64"
            }
            "X86" {
              $tsArch = "x86"
            }
            default {
              Write-Error "Unsupported architecture: $runnerArch"
              exit 1
            }
          }

          $tsUrl  = "https://pkgs.tailscale.com/stable/tailscale-setup-$tailscaleVersion-$tsArch.msi"
          $tsPath = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale:"
          Write-Host $tsUrl

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $tsPath `
            -UseBasicParsing

          if (-not (Test-Path $tsPath)) {
            Write-Error "Tailscale installer download failed"
            exit 1
          }

          Write-Host "Installing Tailscale silently..."

          Start-Process msiexec.exe `
            -ArgumentList "/i", "`"$tsPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $tsPath -Force -ErrorAction SilentlyContinue

          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tsExe)) {
            Write-Error "❌ Tailscale installation failed"
            exit 1
          }

          Write-Host "✅ Tailscale installed successfully"

      - name: 🌐 Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          TAILSCALE_HOSTNAME_INPUT: ${{ inputs.tailscale_hostname }}
        run: |
          Write-Host "Checking Tailscale auth key..."

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            Write-Error "❌ Secret TAILSCALE_AUTH_KEY belum diset di GitHub Repository Secrets"
            exit 1
          }

          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tsExe)) {
            Write-Error "❌ tailscale.exe not found"
            exit 1
          }

          $hostnameBase = [string]$env:TAILSCALE_HOSTNAME_INPUT
          $hostnameMode = '${{ inputs.hostname_mode }}'

          if ([string]::IsNullOrWhiteSpace($hostnameBase)) {
            $hostnameBase = "rdp-runner"
          }

          # Tailscale/MagicDNS hostname-safe format: lowercase, letters, numbers, and hyphens.
          $hostnameBase = $hostnameBase.ToLowerInvariant() -replace '[^a-z0-9-]', '-'
          $hostnameBase = $hostnameBase.Trim('-')

          if ([string]::IsNullOrWhiteSpace($hostnameBase)) {
            $hostnameBase = "rdp-runner"
          }

          if ($hostnameMode -eq "same_each_run") {
            $tsHostname = $hostnameBase
          } else {
            $suffix = "-${{ github.run_id }}"
            $maxBaseLength = 63 - $suffix.Length

            if ($hostnameBase.Length -gt $maxBaseLength) {
              $hostnameBase = $hostnameBase.Substring(0, $maxBaseLength).Trim('-')
            }

            $tsHostname = "$hostnameBase$suffix"
          }

          if ($tsHostname.Length -gt 63) {
            $tsHostname = $tsHostname.Substring(0, 63).Trim('-')
          }

          Write-Host "Connecting to Tailscale..."
          Write-Host "Hostname mode      : $hostnameMode"
          Write-Host "Tailscale hostname : $tsHostname"

          & $tsExe up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="$tsHostname" `
            --unattended `
            --accept-routes

          if ($LASTEXITCODE -ne 0) {
            Write-Error "❌ Tailscale connection failed"
            exit 1
          }

          $tsIP = $null
          $retry = 0

          while (-not $tsIP -and $retry -lt 20) {
            Start-Sleep -Seconds 5
            $tsIP = [string](& $tsExe ip -4 2>$null)
            $tsIP = $tsIP.Trim()
            $retry++
            Write-Host "Waiting for Tailscale IP... attempt $retry"
          }

          if (-not $tsIP) {
            Write-Error "❌ Tailscale IP not assigned"
            exit 1
          }

          "TAILSCALE_IP=$tsIP" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "TAILSCALE_HOSTNAME=$tsHostname" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "TAILSCALE_HOSTNAME_MODE=$hostnameMode" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

          Write-Host "✅ Tailscale connected"
          Write-Host "Tailscale Hostname: $tsHostname"
          Write-Host "Tailscale IP: $tsIP"


      - name: 🌐 Install noVNC Browser Remote (Tailscale Only)
        if: inputs.remote_access != 'rdp'
        timeout-minutes: 5
        shell: pwsh
        env:
          VNC_PASSWORD_SECRET: ${{ secrets.VNC_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $passwordMode = '${{ inputs.vnc_password_mode }}'
          $vncPassword = $null

          if ($passwordMode -eq 'same_from_secret') {
            # Remove only accidental CR/LF from the end of pasted secrets.
            $sourcePassword = ([string]$env:VNC_PASSWORD_SECRET).TrimEnd([char]13, [char]10)
            if ([string]::IsNullOrWhiteSpace($sourcePassword)) {
              throw 'VNC_PASSWORD is empty. Add GitHub Actions secret VNC_PASSWORD or choose vnc_password_mode=random_each_run.'
            }
            Write-Host "::add-mask::$sourcePassword"
            # Classic VNCAuth supports only eight effective password bytes.
            # Longer secrets are accepted; the client uses the same prefix.
            $vncPassword = $sourcePassword.Substring(0, [Math]::Min(8, $sourcePassword.Length))
            Write-Host "::add-mask::$vncPassword"
            if ($sourcePassword.Length -gt 8) {
              Write-Warning 'VNCAuth uses only the first 8 password bytes; remaining characters are ignored by the protocol.'
            }
            if ($vncPassword.Length -lt 6) {
              throw 'VNC_PASSWORD should have at least 6 characters. Set a longer secret or choose random_each_run.'
            }
          } elseif ($passwordMode -eq 'random_each_run') {
            $alphabet = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'
            $characters = 1..8 | ForEach-Object {
              $alphabet[[Security.Cryptography.RandomNumberGenerator]::GetInt32($alphabet.Length)]
            }
            $vncPassword = -join $characters
            # GitHub Actions log visibility follows repository visibility.
            Write-Warning 'Generated password is displayed in this Actions log. In public repositories, logs are publicly readable; browser access remains Tailscale-only.'
            Write-Host "Generated noVNC password for this run: $vncPassword"
          } else {
            throw "Unsupported vnc_password_mode: $passwordMode"
          }
          Write-Host "noVNC password mode: $passwordMode"
          if ($env:RUNNER_ARCH -eq 'ARM64') {
            throw 'noVNC is not supported for Windows ARM64 runners. Select x64 or use RDP.'
          }
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'noVNC mode requires a disposable GitHub-hosted runner.'
          }
          if ($env:TAILSCALE_IP -notmatch '^100\.(?:6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.\d{1,3}\.\d{1,3}$') {
            throw 'Valid Tailscale IPv4 not found.'
          }

          $base = Join-Path $env:ProgramData 'RDP-Setup\noVNC'
          New-Item -ItemType Directory -Path $base -Force | Out-Null
          # Install signed TightVNC with localhost-only RFB and no built-in Java viewer.
          $version = '2.8.90'
          $msi = Join-Path $base 'tightvnc.msi'
          try {
            Invoke-WebRequest -Uri "https://www.tightvnc.com/download/$version/tightvnc-$version-gpl-setup-64bit.msi" -OutFile $msi -UseBasicParsing -TimeoutSec 180
            $sha256 = (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($sha256 -ne '9693cb4cdc2e7e482e8e3f5890415b57ef87de3369fa5c337db516218a1170ce') {
              throw 'TightVNC 2.8.90 MSI SHA256 mismatch.'
            }
            $sig = Get-AuthenticodeSignature -FilePath $msi
            if ($sig.Status -ne 'Valid') { throw "TightVNC signature invalid: $($sig.Status)" }
            $installArgs = @(
              '/i', $msi, '/qn', '/norestart',
              'ADDLOCAL=Server', 'SERVER_REGISTER_AS_SERVICE=1', 'SERVER_ADD_FIREWALL_EXCEPTION=0',
              'SET_ACCEPTRFBCONNECTIONS=1', 'VALUE_OF_ACCEPTRFBCONNECTIONS=1',
              'SET_ACCEPTHTTPCONNECTIONS=1', 'VALUE_OF_ACCEPTHTTPCONNECTIONS=0',
              'SET_ALLOWLOOPBACK=1', 'VALUE_OF_ALLOWLOOPBACK=1',
              'SET_LOOPBACKONLY=1', 'VALUE_OF_LOOPBACKONLY=1',
              'SET_USEVNCAUTHENTICATION=1', 'VALUE_OF_USEVNCAUTHENTICATION=1',
              'SET_REMOVEWALLPAPER=1', 'VALUE_OF_REMOVEWALLPAPER=0',
              'SET_PASSWORD=1', "VALUE_OF_PASSWORD=$vncPassword",
              'SET_USECONTROLAUTHENTICATION=1', 'VALUE_OF_USECONTROLAUTHENTICATION=1',
              'SET_CONTROLPASSWORD=1', "VALUE_OF_CONTROLPASSWORD=$vncPassword"
            )
            # .NET ArgumentList keeps MSI properties with symbols or spaces
            # as a single argument, unlike Start-Process -ArgumentList.
            $processInfo = [Diagnostics.ProcessStartInfo]::new("$env:SystemRoot\System32\msiexec.exe")
            $processInfo.UseShellExecute = $false
            $processInfo.CreateNoWindow = $true
            foreach ($arg in $installArgs) { [void]$processInfo.ArgumentList.Add([string]$arg) }
            $installed = [Diagnostics.Process]::Start($processInfo)
            if (-not $installed) { throw 'TightVNC MSI process could not start.' }
            $installed.WaitForExit()
            if ($installed.ExitCode -notin @(0,3010,1641)) { throw "TightVNC MSI exit code: $($installed.ExitCode)" }
          } finally {
            Remove-Item -LiteralPath $msi -Force -ErrorAction SilentlyContinue
          }

          $vncRegistry = 'HKLM:\SOFTWARE\TightVNC\Server'
          $settings = Get-ItemProperty $vncRegistry -ErrorAction Stop
          if ($settings.LoopbackOnly -ne 1 -or $settings.AllowLoopback -ne 1 -or
              $settings.AcceptHttpConnections -ne 0 -or $settings.UseVncAuthentication -ne 1) {
            throw 'VNC loopback-only/password settings verification failed.'
          }
          # TightVNC defaults RemoveWallpaper=1; disable it to show wallpaper.
          if ($settings.RemoveWallpaper -ne 0) {
            Write-Warning "TightVNC RemoveWallpaper was $($settings.RemoveWallpaper); setting 0."
            Set-ItemProperty -Path $vncRegistry -Name RemoveWallpaper -Value 0 -ErrorAction Stop
          }
          $svc = Get-Service -Name tvnserver -ErrorAction Stop
          if ($svc.Status -ne 'Running') { Start-Service tvnserver -ErrorAction Stop }
          else { Restart-Service -Name tvnserver -Force -ErrorAction Stop }
          $settings = Get-ItemProperty $vncRegistry -ErrorAction Stop
          if ($settings.RemoveWallpaper -ne 0) { throw 'TightVNC wallpaper suppression still enabled.' }
          Write-Host 'TightVNC RemoveWallpaper=0 verified; VNC now keeps the Windows wallpaper.'
          $rfbReady = $false
          for ($i=0; $i -lt 15; $i++) {
            if (Test-NetConnection 127.0.0.1 -Port 5900 -InformationLevel Quiet -WarningAction SilentlyContinue) {
              $rfbReady = $true
              break
            }
            Start-Sleep -Seconds 2
          }
          if (-not $rfbReady) { throw 'TightVNC port 5900 is not ready on loopback.' }

          # Download official noVNC static frontend and install its websockify bridge.
          $archive = Join-Path $base 'novnc.zip'
          $webRoot = Join-Path $base 'web'
          Invoke-WebRequest -Uri 'https://github.com/novnc/noVNC/archive/refs/tags/v1.7.0.zip' -OutFile $archive -UseBasicParsing -TimeoutSec 180
          Expand-Archive -LiteralPath $archive -DestinationPath $base -Force
          Move-Item -LiteralPath (Join-Path $base 'noVNC-1.7.0') -Destination $webRoot -Force
          Remove-Item -LiteralPath $archive -Force
          if (-not (Test-Path (Join-Path $webRoot 'vnc.html'))) { throw 'noVNC web frontend not found.' }
          # noVNC official defaults: local scale responds to browser resizing
          # without requesting an unsupported RFB desktop resolution change.
          # Settings remain user-changeable from the noVNC toolbar.
          $noVncDefaults = Join-Path $webRoot 'defaults.json'
          @{ resize = 'scale'; autoconnect = $true } |
            ConvertTo-Json -Compress |
            Set-Content -LiteralPath $noVncDefaults -Encoding utf8
          $confirmedDefaults = Get-Content -LiteralPath $noVncDefaults -Raw | ConvertFrom-Json
          if ($confirmedDefaults.resize -ne 'scale' -or $confirmedDefaults.autoconnect -ne $true) {
            throw 'noVNC responsive display defaults could not be confirmed.'
          }
          Write-Host 'noVNC display defaults: resize=scale, autoconnect=true.'
          $python = (Get-Command python.exe -ErrorAction Stop).Source
          # The server runs in a Windows Scheduled Task under SYSTEM. Its own
          # virtual environment avoids runneradmin-only Python site-packages.
          $venv = Join-Path $base 'pyenv'
          & $python -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create persistent websockify Python environment.' }
          $servicePython = Join-Path $venv 'Scripts\python.exe'
          & $servicePython -m pip install --disable-pip-version-check --no-input 'websockify==0.13.0'
          if ($LASTEXITCODE -ne 0) { throw 'websockify installation in persistent environment failed.' }
          Write-Host '[noVNC 1/5] websockify installed in machine-accessible venv; preparing a persistent Scheduled Task...'

          # Keep both the RFB server (5900) and websockify (6081) on localhost.
          # Tailscale Serve exposes exactly ONE port to the tailnet per run:
          # raw TCP 6082 by default OR HTTPS 443 when explicitly selected.
          $transport = '${{ inputs.novnc_transport }}'
          $staleRule = Get-NetFirewallRule -Name 'WFS-noVNC-Tailscale' -ErrorAction SilentlyContinue
          if ($staleRule) { $staleRule | Remove-NetFirewallRule -ErrorAction SilentlyContinue }
          Write-Host '[noVNC 2/5] Starting one loopback-only websockify backend on 127.0.0.1:6081.'

          $webOut = Join-Path $base 'websockify.out.log'
          $webErr = Join-Path $base 'websockify.err.log'
          $taskName = 'WFS-noVNC-websockify'
          $launcher = Join-Path $base 'launch-websockify.cmd'
          @(
            '@echo off'
            'cd /d "' + $base + '"'
            '"' + $servicePython + '" -m websockify --web "' + $webRoot + '" 127.0.0.1:6081 127.0.0.1:5900 1>>"' + $webOut + '" 2>>"' + $webErr + '"'
          ) | Set-Content -LiteralPath $launcher -Encoding ascii
          # GitHub Actions terminates child processes spawned by a step when
          # that step exits. Windows Task Scheduler creates the backend
          # outside the step process tree and keeps it alive across steps.
          $existingTask = Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
          if ($existingTask) {
            Stop-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
            Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction Stop
          }
          $taskAction = New-ScheduledTaskAction -Execute $env:ComSpec -Argument ('/d /c "' + $launcher + '"') -WorkingDirectory $base
          $taskPrincipal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
          $taskSettings = New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Hours 7) -MultipleInstances IgnoreNew
          Register-ScheduledTask -TaskName $taskName -Action $taskAction -Principal $taskPrincipal -Settings $taskSettings -Force -ErrorAction Stop | Out-Null
          Start-ScheduledTask -TaskName $taskName -ErrorAction Stop
          Write-Host "Persistent websockify Scheduled Task started: $taskName"
          $webReady = $false
          for ($i=0; $i -lt 15; $i++) {
            try {
              $page = Invoke-WebRequest -Uri 'http://127.0.0.1:6081/vnc.html' -UseBasicParsing -TimeoutSec 3
              if ($page.StatusCode -eq 200 -and $page.Content -match 'noVNC') { $webReady = $true; break }
            } catch {}
            Start-Sleep -Seconds 2
          }
          if (-not $webReady) {
            $task = Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
            $taskInfo = Get-ScheduledTaskInfo -TaskName $taskName -ErrorAction SilentlyContinue
            Write-Warning "Scheduled Task state: $($task.State); last run result: $($taskInfo.LastTaskResult)"
            if (Test-Path $webErr) { Get-Content -LiteralPath $webErr -Tail 35 | Out-Host }
            if (Test-Path $webOut) { Get-Content -LiteralPath $webOut -Tail 20 | Out-Host }
            throw 'Persistent noVNC websockify task failed the localhost HTTP check.'
          }
          Write-Host '[noVNC 3/5] Local noVNC HTTP page verified; configuring one private Tailscale port.'

          $tsExe = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'
          if (-not (Test-Path $tsExe)) { throw 'Tailscale CLI missing on runner.' }
          function Invoke-TailscaleBounded {
            param([string[]]$Arguments,[string]$Tag,[int]$Seconds = 15)
            $outFile = Join-Path $base "$Tag.stdout.log"
            $errFile = Join-Path $base "$Tag.stderr.log"
            $proc = Start-Process -FilePath $tsExe -ArgumentList $Arguments -WindowStyle Hidden -PassThru -RedirectStandardOutput $outFile -RedirectStandardError $errFile
            if (-not $proc.WaitForExit($Seconds * 1000)) {
              try { $proc.Kill($true) } catch { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
              throw "Tailscale command $Tag timed out after $Seconds seconds. Check Serve permissions and HTTPS setup."
            }
            $outText = if (Test-Path $outFile) { [string](Get-Content -LiteralPath $outFile -Raw -ErrorAction SilentlyContinue) } else { '' }
            $errText = if (Test-Path $errFile) { [string](Get-Content -LiteralPath $errFile -Raw -ErrorAction SilentlyContinue) } else { '' }
            if ($proc.ExitCode -ne 0) {
              throw "Tailscale command $Tag failed with exit code $($proc.ExitCode): $errText $outText"
            }
            return $outText
          }

          # Serve HTTPS is optional. GitHub-hosted runners are ephemeral and
          # may need tailnet HTTPS consent or certificate provisioning, so an
          # HTTPS setup failure must never strand an otherwise healthy noVNC.
          # Only one Serve listener is left active on each new runner.
          $requestedTransport = $transport
          $fallbackReason = ''
          $url = $null
          function Start-PrivateTcpServe {
            Write-Host '[noVNC 4/5] Starting private tailnet TCP Serve on port 6082.'
            $null = Invoke-TailscaleBounded -Arguments @('serve','--bg','--yes','--tcp=6082','tcp://127.0.0.1:6081') -Tag 'serve-tcp' -Seconds 20
            $tcpState = Invoke-TailscaleBounded -Arguments @('serve','status') -Tag 'serve-tcp-status' -Seconds 15
            if ($tcpState -notmatch '6082' -or $tcpState -notmatch '6081') {
              throw "Tailscale TCP Serve mapping 6082 -> 127.0.0.1:6081 was not confirmed: $tcpState"
            }
            if ($tcpState -match 'https://') {
              throw 'Unexpected HTTPS listener remains active alongside TCP. Refusing to publish two noVNC entrypoints.'
            }
            $tcpUrl = "http://$($env:TAILSCALE_IP):6082/vnc.html#resize=scale&autoconnect=1"
            "NOVNC_TCP_SERVE_URL=$tcpUrl" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
            Write-Host '✅ Private Tailscale TCP Serve mapping verified (no public port or Funnel).'
            return $tcpUrl
          }

          if ($transport -eq 'tailscale_tcp') {
            $url = Start-PrivateTcpServe
          } elseif ($transport -eq 'tailscale_https') {
            Write-Host '[noVNC 4/5] HTTPS requested; attempting Tailscale Serve with bounded certificate/consent checks.'
            try {
              $statusRaw = Invoke-TailscaleBounded -Arguments @('status','--json') -Tag 'tailscale-status' -Seconds 12
              $tsStatus = $statusRaw | ConvertFrom-Json -ErrorAction Stop
              $fqdn = ([string]$tsStatus.Self.DNSName).TrimEnd('.')
              if ($fqdn -notmatch '^[a-z0-9][a-z0-9.-]*\.ts\.net$') {
                throw 'HTTPS requires a valid MagicDNS *.ts.net hostname.'
              }
              # Provisioning certificates on first use may take longer than
              # the old 15-second watchdog; allow 50s, then fall back.
              $null = Invoke-TailscaleBounded -Arguments @('serve','--bg','--yes','--https=443','http://127.0.0.1:6081') -Tag 'serve-https' -Seconds 50
              $httpsState = Invoke-TailscaleBounded -Arguments @('serve','status') -Tag 'serve-https-status' -Seconds 15
              if ($httpsState -notmatch 'https://' -or $httpsState -notmatch '6081') {
                throw 'HTTPS Serve mapping was not confirmed.'
              }
              $httpsUrl = "https://$fqdn/vnc.html#resize=scale&autoconnect=1"
              # A configured HTTPS listener may still be waiting for its
              # first TLS certificate. Do not publish a dead HTTPS URL.
              $httpsReady = $false
              for ($try=1; $try -le 3; $try++) {
                try {
                  $result = Invoke-WebRequest -Uri ("https://$fqdn/vnc.html") -UseBasicParsing -TimeoutSec 15 -ErrorAction Stop
                  if ($result.StatusCode -eq 200 -and $result.Content -match 'noVNC') {
                    $httpsReady = $true
                    break
                  }
                } catch {
                  Write-Warning "HTTPS certificate/page probe attempt $try failed: $($_.Exception.Message)"
                }
                if ($try -lt 3) { Start-Sleep -Seconds 3 }
              }
              if (-not $httpsReady) { throw 'HTTPS Serve configured but its TLS page did not respond after three probes.' }
              $url = $httpsUrl
              "NOVNC_HTTPS_URL=$url" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
              Write-Host "✅ HTTPS Serve verified: $url"
            } catch {
              $fallbackReason = (($_.Exception.Message -replace '[\r\n|]+',' ').Trim())
              if ($fallbackReason.Length -gt 250) { $fallbackReason = $fallbackReason.Substring(0,250) }
              Write-Warning "Requested HTTPS could not start: $fallbackReason"
              Write-Warning 'Falling back to private Tailscale TCP port 6082. This is HTTP inside the encrypted tailnet, not public Internet HTTP.'
              # The runner is disposable and has no other Serve configuration.
              # Reset is needed because HTTPS may have partially registered
              # a 443 listener before a certificate/consent timeout.
              $null = Invoke-TailscaleBounded -Arguments @('serve','reset') -Tag 'serve-reset-before-fallback' -Seconds 15
              $url = Start-PrivateTcpServe
              $transport = 'tailscale_tcp'
            }
          } else {
            throw "Invalid novnc_transport: $transport"
          }

          "NOVNC_URL=$url" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "NOVNC_TRANSPORT=$transport" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "NOVNC_TRANSPORT_REQUESTED=$requestedTransport" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          if ($fallbackReason) {
            "NOVNC_FALLBACK_REASON=$fallbackReason" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
            Write-Warning 'noVNC is available through tailnet TCP 6082 instead of requested HTTPS 443.'
          }

          Write-Host '[noVNC 5/5] Private browser endpoint configured.'
          Write-Host "✅ noVNC browser URL (auto-fit + auto-connect): $url"
          Write-Host "noVNC transport requested: $requestedTransport; active: $transport"
          Write-Host 'Fit-to-browser uses local scaling. True browser fullscreen requires a user click or F11; server-side fullscreen cannot be forced.'
          Write-Host 'A black desktop background may still reflect the active Windows console user/session; use Windows Personalization after connecting if needed.'
          Write-Host 'VNC RFB listens locally at 127.0.0.1:5900; web backend locally at 127.0.0.1:6081.'
          Write-Host 'Only the selected Tailscale Serve port is exposed (6082 TCP OR 443 HTTPS).'
          Write-Host 'Remote browser reachability must still be confirmed from a separate tailnet device.'

          if ($passwordMode -eq 'same_from_secret') {
            Write-Host 'Use the VNC_PASSWORD repository secret in your browser (VNCAuth uses first 8 bytes).'
          } else {
            Write-Host 'Use the generated password displayed in this step log.'
          }
          Write-Host 'noVNC mirrors the Windows console; it may differ from an RDP session.'

      - name: ✅ Verify RDP Port
        if: inputs.remote_access != 'novnc'
        shell: pwsh
        run: |
          Write-Host "Verifying RDP port..."

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {
            Write-Error "❌ RDP port 3389 unreachable"
            exit 1
          }

          Write-Host "✅ RDP port verified"

      - name: 🔬 Verify noVNC HTTP, WebSocket and RFB
        if: inputs.remote_access != 'rdp'
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $localPage = 'http://127.0.0.1:6081/vnc.html'
          $localWS = 'ws://127.0.0.1:6081/websockify'
          Write-Host 'Checking local HTTP page, WebSocket bridge and initial VNC/RFB handshake...'

          try {
            $page = Invoke-WebRequest -Uri $localPage -UseBasicParsing -TimeoutSec 10
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch 'noVNC') {
              throw 'noVNC backend HTTP page did not return 200/noVNC.'
            }
          } catch {
            $base = Join-Path $env:ProgramData 'RDP-Setup\noVNC'
            $task = Get-ScheduledTask -TaskName 'WFS-noVNC-websockify' -ErrorAction SilentlyContinue
            $taskInfo = Get-ScheduledTaskInfo -TaskName 'WFS-noVNC-websockify' -ErrorAction SilentlyContinue
            Write-Host "Persistent task state: $($task.State); last task result: $($taskInfo.LastTaskResult)"
            $errLog = Join-Path $base 'websockify.err.log'
            $outLog = Join-Path $base 'websockify.out.log'
            if (Test-Path $errLog) { Get-Content -LiteralPath $errLog -Tail 40 | Out-Host }
            if (Test-Path $outLog) { Get-Content -LiteralPath $outLog -Tail 20 | Out-Host }
            throw "noVNC localhost backend disappeared between Actions steps: $($_.Exception.Message)"
          }
          Write-Host '✅ Local noVNC HTTP page: 200 OK'

          function Test-RfbWebSocket {
            param([Parameter(Mandatory=$true)][string]$WsUrl)
            $ws = [System.Net.WebSockets.ClientWebSocket]::new()
            $timeout = [System.Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds(12))
            try {
              $ws.Options.AddSubProtocol('binary')
              $ws.ConnectAsync([uri]$WsUrl,$timeout.Token).GetAwaiter().GetResult()
              if ($ws.State -ne [System.Net.WebSockets.WebSocketState]::Open) {
                throw "WebSocket state: $($ws.State)"
              }
              $buffer = [byte[]]::new(64)
              $segment = [ArraySegment[byte]]::new($buffer)
              $message = $ws.ReceiveAsync($segment,$timeout.Token).GetAwaiter().GetResult()
              if ($message.MessageType -ne [System.Net.WebSockets.WebSocketMessageType]::Binary) {
                throw "Expected binary VNC protocol, received $($message.MessageType)"
              }
              $banner = [Text.Encoding]::ASCII.GetString($buffer,0,$message.Count)
              if ($banner -notmatch '^RFB [0-9]{3}\.[0-9]{3}') {
                throw 'VNC/RFB protocol banner was not received through WebSocket.'
              }
              Write-Host "✅ WebSocket handshake succeeded and VNC server replied with: $($banner.Trim())"
              return $true
            } catch {
              Write-Warning "WebSocket/RFB check failed at $($WsUrl): $($_.Exception.Message)"
              return $false
            } finally {
              $ws.Dispose()
              $timeout.Dispose()
            }
          }

          if (-not (Test-RfbWebSocket -WsUrl $localWS)) {
            throw 'noVNC backend serves HTML but its WebSocket bridge to TightVNC is not functional; remote cannot be considered ready.'
          }
          Write-Host '✅ Local HTTP, WebSocket and TightVNC/RFB protocol all healthy.'

          # This check is performed ON the runner, not on another tailnet peer.
          # Self-tests do not establish external reachability or browser trust.
          $remoteUrl = [string]$env:NOVNC_URL
          if ([string]::IsNullOrWhiteSpace($remoteUrl)) {
            throw 'NOVNC_URL was not published by the Serve configuration step.'
          }
          $selfHttp = 'UNVERIFIED'
          $selfWs = 'UNVERIFIED'
          try {
            $remotePage = Invoke-WebRequest -Uri $remoteUrl -UseBasicParsing -TimeoutSec 8
            if ($remotePage.StatusCode -eq 200 -and $remotePage.Content -match 'noVNC') {
              $selfHttp = 'PASS'
              Write-Host "✅ Tailscale Serve self-probe HTTP 200: $remoteUrl"
              $u = [Uri]$remoteUrl
              $scheme = if ($u.Scheme -eq 'https') { 'wss' } else { 'ws' }
              $remoteWsUrl = $scheme + '://' + $u.Authority + '/websockify'
              if (Test-RfbWebSocket -WsUrl $remoteWsUrl) { $selfWs = 'PASS' }
              else { $selfWs = 'FAIL' }
            } else {
              $selfHttp = "HTTP_$($remotePage.StatusCode)"
            }
          } catch {
            $selfHttp = 'FAIL'
            Write-Warning "Tailscale URL self-probe could not fetch the noVNC page: $($_.Exception.Message)"
          }
          "NOVNC_LOCAL_HTTP_STATUS=PASS" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "NOVNC_LOCAL_WS_STATUS=PASS" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "NOVNC_SERVE_SELF_HTTP_STATUS=$selfHttp" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "NOVNC_SERVE_SELF_WS_STATUS=$selfWs" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          if ($selfHttp -ne 'PASS' -or $selfWs -ne 'PASS') {
            Write-Warning 'noVNC backend is healthy, but the Tailscale Serve URL self-test did not fully pass. Check Serve mapping/port and client tailnet ACL.'
          } else {
            Write-Host '✅ Tailscale Serve HTTP and WebSocket self-probes passed. External client/browser access remains unverified.'
          }

      - name: 🖥️ Configure widescreen in interactive Windows session
        if: inputs.remote_access != 'rdp'
        timeout-minutes: 2
        continue-on-error: true
        shell: pwsh
        run: |
          # GitHub Actions cannot query an active display in its own session.
          # Register a task in the actual interactive account at logon, and
          # start immediately if a console account is already logged in.
          $dir = Join-Path $env:ProgramData 'RDP-Setup'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $script = Join-Path $dir 'set-interactive-widescreen.ps1'
          @'
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:ProgramData 'RDP-Setup\wfs-display-resolution.log'
          function Say([string]$value) {
            Add-Content -LiteralPath $log -Value ("[$(Get-Date -Format o)] $env:USERNAME/session=$([Diagnostics.Process]::GetCurrentProcess().SessionId): $value") -Encoding UTF8
          }
          try {
            if ([Diagnostics.Process]::GetCurrentProcess().SessionId -eq 0) {
              Say 'Skipped noninteractive Session 0.'
              exit 0
            }
            Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
          public struct WfsDevModeInteractive {
            [MarshalAs(UnmanagedType.ByValTStr, SizeConst=32)] public string dmDeviceName;
            public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra;
            public int dmFields, dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput;
            public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
            [MarshalAs(UnmanagedType.ByValTStr, SizeConst=32)] public string dmFormName;
            public short dmLogPixels;
            public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency;
            public int dmICMMethod, dmICMIntent, dmMediaType, dmDitherType;
            public int dmReserved1, dmReserved2, dmPanningWidth, dmPanningHeight;
          }
          public static class WfsNativeDisplay {
            [DllImport("user32.dll", EntryPoint="EnumDisplaySettingsW", CharSet=CharSet.Unicode)]
            public static extern bool EnumDisplaySettings(string device, int index, ref WfsDevModeInteractive mode);
            [DllImport("user32.dll", EntryPoint="ChangeDisplaySettingsW", CharSet=CharSet.Unicode)]
            public static extern int ChangeDisplaySettings(ref WfsDevModeInteractive mode, int flags);
          }
          "@
            $size = [int16][Runtime.InteropServices.Marshal]::SizeOf([type][WfsDevModeInteractive])
            $current = [WfsDevModeInteractive]::new()
            $current.dmSize = $size
            if (-not [WfsNativeDisplay]::EnumDisplaySettings($null,-1,[ref]$current)) {
              Say 'No active display adapter in this interactive session. Keeping original resolution.'
              exit 0
            }
            Say "Current resolution: $($current.dmPelsWidth)x$($current.dmPelsHeight)"
            $modes = @()
            for ($i=0; $i -lt 256; $i++) {
              $mode = [WfsDevModeInteractive]::new()
              $mode.dmSize = $size
              if (-not [WfsNativeDisplay]::EnumDisplaySettings($null,$i,[ref]$mode)) { break }
              if ($mode.dmBitsPerPel -ge 24) { $modes += $mode }
            }
            foreach ($target in @('1920x1080','1600x900','1366x768','1280x720')) {
              $mode = $modes | Where-Object { "$($_.dmPelsWidth)x$($_.dmPelsHeight)" -eq $target } | Select-Object -First 1
              if (-not $mode) { continue }
              if ("$($current.dmPelsWidth)x$($current.dmPelsHeight)" -eq $target) {
                Say "Preferred resolution already active: $target"
                exit 0
              }
              if ([WfsNativeDisplay]::ChangeDisplaySettings([ref]$mode,2) -ne 0) { continue }
              $code = [WfsNativeDisplay]::ChangeDisplaySettings([ref]$mode,0)
              if ($code -eq 0) {
                Say "Set desktop resolution to $target"
                exit 0
              }
              Say "Driver rejected $target (code $code)"
            }
            Say 'No compatible 16:9 display mode; retaining original mode and using noVNC local scaling.'
          } catch {
            Say "Optional resolution adjustment failed: $($_.Exception.Message)"
          }
          '@ | Set-Content -LiteralPath $script -Encoding UTF8
          $action = New-ScheduledTaskAction -Execute "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -Argument ('-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "'+$script+'"')
          function Register-DisplayTask([string]$taskName,[string]$user,[bool]$startNow) {
            try {
              if ([string]::IsNullOrWhiteSpace($user) -or $user -match '^(NT AUTHORITY|NT SERVICE)\\') { return $false }
              $principal = New-ScheduledTaskPrincipal -UserId $user -LogonType Interactive -RunLevel Highest
              $trigger = New-ScheduledTaskTrigger -AtLogOn -User $user
              Register-ScheduledTask -TaskName $taskName -Action $action -Principal $principal -Trigger $trigger -Force -ErrorAction Stop | Out-Null
              Write-Host "Registered interactive display task $taskName for $user"
              if ($startNow) {
                try {
                  Start-ScheduledTask -TaskName $taskName -ErrorAction Stop
                  Write-Host "Started console display resolution task for $user"
                } catch {
                  Write-Warning "Interactive task is deferred until logon: $($_.Exception.Message)"
                }
              }
              return $true
            } catch {
              Write-Warning "Display task registration failed for $($user): $($_.Exception.Message)"
              return $false
            }
          }
          $rdpUser = "$env:COMPUTERNAME\$env:RDP_USER"
          $rdpTaskReady = Register-DisplayTask 'WFS-Widescreen-RDP-Logon' $rdpUser $false
          $consoleUser = ''
          try { $consoleUser = [string](Get-CimInstance Win32_ComputerSystem -ErrorAction Stop).UserName } catch {}
          $consoleTaskReady = $false
          if ($consoleUser -and $consoleUser -ine $rdpUser) {
            $consoleTaskReady = Register-DisplayTask 'WFS-Widescreen-Console-Logon' $consoleUser $true
          }
          $status = if ($consoleTaskReady) { 'Interactive console task started (check ProgramData RDP-Setup display log)' }
                    elseif ($rdpTaskReady) { 'Interactive user task registered for next RDP logon' }
                    else { 'No interactive session task registered; noVNC local scaling only' }
          "NOVNC_RESOLUTION_STATUS=$status" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          Write-Host "Resolution adaptation: $status"
          Write-Host 'Browser auto-fit uses resize=scale. Native resolution requires a logged-in Windows user and a supported display driver.'

      - name: 📊 Generate Dashboard Summary
        shell: pwsh
        run: |
          $ideChoice = '${{ inputs.ide_choice }}'
          $editorChoice = '${{ inputs.editor_choice }}'
          $metatraderChoice = '${{ inputs.metatrader_choice }}'
          $routerChoice = '${{ inputs.router_choice }}'
          $codingAgentChoice = '${{ inputs.coding_agent_choice }}'
          $aiAgentChoice = '${{ inputs.ai_agent_choice }}'
          $installArtCraft = '${{ inputs.install_artcraft }}' -eq 'true'
          $hostnameMode = '${{ inputs.hostname_mode }}'
          $passwordMode = '${{ inputs.rdp_password_mode }}'
          $vncPasswordMode = '${{ inputs.vnc_password_mode }}'
          $remoteMode = '${{ inputs.remote_access }}'
          $durationHours = '${{ inputs.duration_hours }}'
          $windowsVersion = '${{ inputs.windows_version }}'

          function Test-AnyPath {
            param([string[]] $Paths)

            foreach ($path in $Paths) {
              if ([string]::IsNullOrWhiteSpace($path)) { continue }

              $expanded = [Environment]::ExpandEnvironmentVariables($path)
              if (Test-Path $expanded) {
                return $true
              }
            }

            return $false
          }

          function Test-CommandExists {
            param([string] $Name)

            $cmd = Get-Command $Name -ErrorAction SilentlyContinue
            return [bool]$cmd
          }

          function Get-InstallStatus {
            param(
              [bool] $Requested,
              [bool] $Detected
            )

            if (-not $Requested) {
              return "⏭️ Skipped"
            }

            if ($Detected) {
              return "✅ Ready"
            }

            return "⚠️ Check logs"
          }

          function Add-Row {
            param(
              [System.Collections.Generic.List[string]] $Rows,
              [string] $Col1,
              [string] $Col2,
              [string] $Col3 = ""
            )

            $Rows.Add("| $Col1 | $Col2 | $Col3 |") | Out-Null
          }

          if ($passwordMode -eq "same_from_secret") {
            $passwordDisplay = "Use GitHub Secret ``RDP_PASSWORD``"
          } else {
            $passwordDisplay = "``$env:RDP_PASSWORD``"
          }

          $wantedVSCode = $ideChoice -in @("vscode", "both")
          $wantedAntigravity = $ideChoice -in @("antigravity", "both")
          $wantedCapCut = $editorChoice -in @("capcut", "both")
          $wantedShotcut = $editorChoice -in @("shotcut", "both")
          $wantedMT4 = $metatraderChoice -in @("mt4", "both")
          $wantedMT5 = $metatraderChoice -in @("mt5", "both")
          $wanted9Router = $routerChoice -in @("9router", "both")
          $wantedOmniRoute = $routerChoice -in @("omniroute", "both")
          $wantedCodex = $codingAgentChoice -in @("codex", "both")
          $wantedClaude = $codingAgentChoice -in @("claude", "both")
          $wantedHermes = $aiAgentChoice -in @("hermes", "both", "all")
          $wantedOpenClaw = $aiAgentChoice -in @("openclaw", "both", "all")
          $wantedOpenCode = $aiAgentChoice -in @("opencode", "all")

          $chromeDetected = Test-AnyPath @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
          )

          $winrarDetected = Test-AnyPath @(
            "$env:ProgramFiles\WinRAR\WinRAR.exe",
            "${env:ProgramFiles(x86)}\WinRAR\WinRAR.exe"
          )

          $nodeDetected = Test-AnyPath @(
            "$env:ProgramFiles\nodejs\node.exe",
            "${env:ProgramFiles(x86)}\nodejs\node.exe"
          )

          $vscodeDetected = Test-AnyPath @(
            "$env:ProgramFiles\Microsoft VS Code\Code.exe",
            "${env:ProgramFiles(x86)}\Microsoft VS Code\Code.exe",
            "$env:LOCALAPPDATA\Programs\Microsoft VS Code\Code.exe"
          )

          $antigravityDetected = Test-AnyPath @(
            "$env:LOCALAPPDATA\Programs\Antigravity IDE\Antigravity IDE.exe",
            "$env:LOCALAPPDATA\Antigravity IDE\Antigravity IDE.exe",
            "C:\Users\runneradmin\AppData\Local\Programs\Antigravity IDE\Antigravity IDE.exe",
            "$env:ProgramFiles\Antigravity IDE\Antigravity IDE.exe",
            "${env:ProgramFiles(x86)}\Antigravity IDE\Antigravity IDE.exe",
            "$env:ProgramData\RDP-Setup\Antigravity IDE\Antigravity IDE.exe"
          )

          $capCutDetected = Test-AnyPath @($env:CAPCUT_EXE)

          $shotcutDetected = Test-AnyPath @(
            "$env:ProgramFiles\Shotcut\shotcut.exe",
            "${env:ProgramFiles(x86)}\Shotcut\shotcut.exe",
            "$env:LOCALAPPDATA\Programs\Shotcut\shotcut.exe"
          )

          $mt4Detected = Test-AnyPath @(
            $env:MT4_TERMINAL_EXE,
            "$env:ProgramFiles\MetaTrader 4\terminal.exe",
            "${env:ProgramFiles(x86)}\MetaTrader 4\terminal.exe",
            "$env:ProgramFiles\Exness MetaTrader 4\terminal.exe",
            "${env:ProgramFiles(x86)}\Exness MetaTrader 4\terminal.exe"
          )

          $mt5Detected = Test-AnyPath @(
