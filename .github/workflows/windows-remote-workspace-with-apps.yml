          Add-Row $appRows "ArtCraft Launcher" (Get-InstallStatus $installArtCraft $artCraftDetected) "GitHub stable release v$env:ARTCRAFT_VERSION (Windows x64 MSI; SHA256 verified)"

          $extensionRows = [System.Collections.Generic.List[string]]::new()
          $extensionRows.Add("| Target | Extension / Feature | Status |") | Out-Null
          $extensionRows.Add("|---|---|---:|") | Out-Null

          if ($wantedVSCode) {
            Add-Row $extensionRows "VS Code" "OpenAI / Codex extension ``OpenAI.chatgpt``" "✅ Configured"
