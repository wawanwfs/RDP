            $summaryLines.Add("| Local-only ports (not published) | TightVNC 5900; websockify 6081 |") | Out-Null
            $summaryLines.Add("| noVNC localhost HTTP | $env:NOVNC_LOCAL_HTTP_STATUS |") | Out-Null
            $summaryLines.Add("| noVNC localhost WebSocket / VNC-RFB | $env:NOVNC_LOCAL_WS_STATUS |") | Out-Null
            $summaryLines.Add("| Tailscale Serve self-probe HTTP | $env:NOVNC_SERVE_SELF_HTTP_STATUS |") | Out-Null
            $summaryLines.Add("| Tailscale Serve self-probe WebSocket / VNC-RFB | $env:NOVNC_SERVE_SELF_WS_STATUS |") | Out-Null
            $summaryLines.Add("| External client reachability | NOT VERIFIED from runner; test HTTP and WebSocket from a second Tailscale device |") | Out-Null
            $vncLoginHelp = if ($vncPasswordMode -eq 'random_each_run') { 'Generated password in the noVNC installation step log (public repo logs are public)' } else { 'GitHub Secret VNC_PASSWORD (first 8 bytes effective)' }
