            $summaryLines.Add("| RDP IP | $env:TAILSCALE_IP |") | Out-Null
            $summaryLines.Add("| Windows username | $env:RDP_USER |") | Out-Null
            $summaryLines.Add("| Windows password | $passwordDisplay |") | Out-Null
            $summaryLines.Add("") | Out-Null
          }
          if ($remoteMode -in @('novnc','both')) {
            $summaryLines.Add("| noVNC browser access | Value |") | Out-Null
            $summaryLines.Add("|---|---|") | Out-Null
            $summaryLines.Add("| noVNC preferred URL (try this first) | [$env:NOVNC_URL]($env:NOVNC_URL) |") | Out-Null
            $summaryLines.Add("| Requested transport | $env:NOVNC_TRANSPORT_REQUESTED |") | Out-Null
            $summaryLines.Add("| Active transport (verified) | $env:NOVNC_TRANSPORT |") | Out-Null
