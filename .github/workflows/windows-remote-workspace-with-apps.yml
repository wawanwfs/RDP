          $summaryLines.Add("| Tailscale IP | ``$env:TAILSCALE_IP`` |") | Out-Null
          $summaryLines.Add("| Hostname Mode | ``$hostnameMode`` |") | Out-Null
          $summaryLines.Add("| Password Mode | ``$passwordMode`` |") | Out-Null
