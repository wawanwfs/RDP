          }

          function Install-ArtCraft {
            $ErrorActionPreference = 'Stop'
            $dir = Join-Path $env:ProgramData 'RDP-Setup\ArtCraft-Launcher-Installer'
            New-Item $dir -ItemType Directory -Force | Out-Null
            $releaseUri = 'https://api.github.com/repos/storytold/craft-launcher/releases/latest'
            $release = Invoke-RestMethod -Uri $releaseUri -TimeoutSec 40 -Headers @{
              Accept = 'application/vnd.github+json'
              'User-Agent' = 'WFS-Windows-Remote-Workspace'
              'X-GitHub-Api-Version' = '2022-11-28'
            } -ErrorAction Stop
            if ($release.draft -or $release.prerelease) { throw 'Latest ArtCraft GitHub release is not stable.' }
            $tag = [string]$release.tag_name
            if ($tag -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
              throw "Unexpected ArtCraft release tag: $tag"
            }
            $version = $tag.Substring(1)
            $assetName = "artcraft-launcher-$version-windows-x64.msi"
            $assets = @($release.assets | Where-Object { $_.name -ceq $assetName })
            if ($assets.Count -ne 1) { throw "Expected one official Windows x64 MSI in ArtCraft $tag, found $($assets.Count)." }
            $asset = $assets[0]
            $downloadUri = [string]$asset.browser_download_url
            $expectedUri = "https://github.com/storytold/craft-launcher/releases/download/$tag/$assetName"
            if ($downloadUri -cne $expectedUri) { throw 'Unexpected ArtCraft asset download host/path.' }
            if ([string]$asset.digest -notmatch '^sha256:[a-fA-F0-9]{64}$') {
              throw "Release $tag does not publish a valid SHA256 asset digest."
            }
            $shaExpected = ([string]$asset.digest).Substring(7)
            if ([long]$asset.size -lt 1000000) { throw 'Unexpectedly small ArtCraft MSI release asset.' }
            $file = Join-Path $dir $assetName
            Write-Host "🎨 Downloading ArtCraft Launcher $tag (official stable release, Windows x64, verified SHA-256)..."
            try {
              Invoke-WebRequest -Uri $downloadUri -OutFile $file -UseBasicParsing -TimeoutSec 180 -ErrorAction Stop
              if ((Get-Item -LiteralPath $file).Length -ne [long]$asset.size) {
                throw 'ArtCraft MSI size does not match GitHub release metadata.'
              }
              $shaActual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
              if ($shaActual -ine $shaExpected) {
                throw "ArtCraft $tag MSI SHA256 mismatch; aborting install."
              }
              $signature = Get-AuthenticodeSignature -LiteralPath $file
              if ($signature.Status -eq 'Valid') {
                Write-Host 'ArtCraft MSI Authenticode signature is valid.'
              } elseif ($signature.Status -eq 'NotSigned') {
                Write-Warning 'ArtCraft MSI is not Authenticode-signed; SHA256 matches official GitHub release metadata.'
              } else {
                throw "ArtCraft MSI has invalid Authenticode status: $($signature.Status)."
              }
              $mutex = [Threading.Mutex]::new($false, 'Global\RdpWorkflowWingetInstall')
              $locked = $false
              try {
                try { $locked = $mutex.WaitOne(300000) } catch [Threading.AbandonedMutexException] { $locked = $true }
                if (-not $locked) { throw 'ArtCraft installer queue timeout.' }
                $data = Invoke-RdpUserTask -Name ArtCraft -TimeoutSeconds 450 -Context @{ Installer=$file; Version=$version } -Script {
                  # The upstream v0.16.x MSI installs into
                  # %LOCALAPPDATA%\Programs\ArtCraft\Launcher, NOT the older
                  # %LOCALAPPDATA%\Programs\ArtCraft Launcher directory.
                  # MSI upgrades can also preserve a previously chosen
                  # folder, recorded in HKCU. Resolve the actual install
                  # location using the same registry key as upstream WiX.
                  function Resolve-ArtCraftExecutable {
                    $candidatePaths = [Collections.Generic.List[string]]::new()
                    $installSettings = Get-ItemProperty -Path 'HKCU:\Software\Learning Machines LLC\ArtCraft Launcher' -ErrorAction SilentlyContinue
                    if ($installSettings -and $installSettings.InstallDir) {
                      $candidatePaths.Add((Join-Path ([string]$installSettings.InstallDir) 'artcraft-launcher.exe'))
                    }
                    try {
                      $appPathKey = Get-Item -LiteralPath 'HKCU:\Software\Microsoft\Windows\CurrentVersion\App Paths\artcraft-launcher.exe' -ErrorAction Stop
                      $registeredExe = [string]$appPathKey.GetValue('')
                      if ($registeredExe) { $candidatePaths.Add($registeredExe) }
                    } catch {}
                    $candidatePaths.Add((Join-Path $env:LOCALAPPDATA 'Programs\ArtCraft\Launcher\artcraft-launcher.exe'))
                    $candidatePaths.Add((Join-Path $env:LOCALAPPDATA 'Programs\ArtCraft Launcher\artcraft-launcher.exe'))
                    foreach ($candidatePath in $candidatePaths) {
                      if ([string]::IsNullOrWhiteSpace($candidatePath)) { continue }
                      if (Test-Path -LiteralPath $candidatePath -PathType Leaf) {
                        return (Resolve-Path -LiteralPath $candidatePath).Path
                      }
                    }
                    return $null
                  }
                  function Get-ArtCraftVersion([string]$path) {
                    if (-not $path -or -not (Test-Path -LiteralPath $path -PathType Leaf)) { return '' }
                    $info = (Get-Item -LiteralPath $path).VersionInfo
                    $ver = [string]$info.ProductVersion
                    if ($ver -notmatch '\d+\.\d+\.\d+') { $ver = [string]$info.FileVersion }
                    if ($ver -match '\d+\.\d+\.\d+') { return $Matches[0] }
                    return ''
                  }
                  $exe = Resolve-ArtCraftExecutable
                  $actualVersion = Get-ArtCraftVersion $exe
                  if (-not $exe -or $actualVersion -ne [string]$ctx.Version) {
                    $log = Join-Path $PSScriptRoot 'msi.log'
                    $args = @('/i', ('"' + $ctx.Installer + '"'), '/qn', '/norestart', 'INSTALLDESKTOPSHORTCUT=0', '/L*v', ('"' + $log + '"'))
                    $proc = Start-Process "$env:SystemRoot\System32\msiexec.exe" -ArgumentList $args -PassThru -Wait
                    if ($proc.ExitCode -notin @(0,3010,1641)) {
                      if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 50 | Out-Host }
                      throw "ArtCraft Launcher $($ctx.Version) MSI exit code: $($proc.ExitCode)"
                    }
                    # Re-read HKCU after MSI: install folder can differ from
                    # old versions and from the default if user customized it.
                    $exe = Resolve-ArtCraftExecutable
                  }
                  if (-not $exe) {
                    $registryFolder = (Get-ItemProperty -Path 'HKCU:\Software\Learning Machines LLC\ArtCraft Launcher' -ErrorAction SilentlyContinue).InstallDir
                    if (Test-Path -LiteralPath $log -ErrorAction SilentlyContinue) {
                      Get-Content -LiteralPath $log -Tail 40 | Out-Host
                    }
                    throw "ArtCraft executable not found in registered/new/legacy install paths. MSI InstallDir: $registryFolder"
                  }
                  $actualVersion = Get-ArtCraftVersion $exe
                  if ($actualVersion -and $actualVersion -ne [string]$ctx.Version) {
                    throw "ArtCraft binary version $actualVersion does not match requested release $($ctx.Version)."
                  }
                  if (-not $actualVersion) {
                    Write-Warning 'ArtCraft executable version metadata is unavailable; MSI exit and official installer SHA256 were verified.'
                  }
                  [pscustomobject]@{ Executable=$exe; Version=[string]$ctx.Version; FileVersion=$actualVersion }
                }
                "ARTCRAFT_EXE=$($data.Executable)" | Add-Content $env:GITHUB_ENV -Encoding UTF8
                "ARTCRAFT_VERSION=$($data.Version)" | Add-Content $env:GITHUB_ENV -Encoding UTF8
                Write-Host "✅ ArtCraft Launcher $($data.Version) installed under RDP user: $($data.Executable); binary version: $($data.FileVersion)"
              } finally {
                if ($locked) { $mutex.ReleaseMutex() }
                $mutex.Dispose()
              }
            } finally {
              Remove-Item -LiteralPath $file -Force -ErrorAction SilentlyContinue
            }
          }

          function Install-OfficialPowerShellApp {
            param(
              [Parameter(Mandatory = $true)] [string] $Name,
              [Parameter(Mandatory = $true)] [string] $Uri,
              [ValidateSet('plain', 'hermes', 'openclaw')]
              [string] $Mode = 'plain'
            )

            $commandName = switch ($Name) {
              'Claude Code' { 'claude' }
              'Hermes Agent' { 'hermes' }
              'OpenClaw' { 'openclaw' }
              default { $null }
            }
            if ($commandName -and (Get-Command $commandName -ErrorAction SilentlyContinue)) {
              Write-Host "⏭️ SKIP $Name : command already available."
              return
            }
            $response = Invoke-WebRequest -Uri $Uri -UseBasicParsing -TimeoutSec 120 -ErrorAction Stop
            $scriptText = ([string]$response.Content).TrimStart([char]0xFEFF)

            if ([string]::IsNullOrWhiteSpace($scriptText)) {
              throw "❌ Installer download for $Name was empty."
            }

            $installerScript = [scriptblock]::Create($scriptText)

            switch ($Mode) {
              'hermes' { & $installerScript -NonInteractive -Branch 'main' }
              'openclaw' { & $installerScript -NoOnboard }
              default { & $installerScript }
            }

            Refresh-InstallerPath
          }

          function Set-ChromeDefaultAssociations {
            $setupDir = Join-Path $env:ProgramData 'RDP-Setup'
            New-Item -Path $setupDir -ItemType Directory -Force | Out-Null

            $associationPath = Join-Path $setupDir 'DefaultAppAssociations.xml'
            $associationXml = @'
          <?xml version="1.0" encoding="UTF-8"?>
          <DefaultAssociations>
            <Association Identifier="http" ProgId="ChromeHTML" ApplicationName="Google Chrome" />
            <Association Identifier="https" ProgId="ChromeHTML" ApplicationName="Google Chrome" />
            <Association Identifier=".htm" ProgId="ChromeHTML" ApplicationName="Google Chrome" />
            <Association Identifier=".html" ProgId="ChromeHTML" ApplicationName="Google Chrome" />
          </DefaultAssociations>
          '@

            Set-Content -LiteralPath $associationPath -Value $associationXml -Encoding UTF8

            $policyPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
            New-Item -Path $policyPath -Force | Out-Null
            New-ItemProperty `
              -Path $policyPath `
              -Name 'DefaultAssociationsConfiguration' `
              -Value $associationPath `
              -PropertyType String `
              -Force | Out-Null

            & dism.exe /Online "/Import-DefaultAppAssociations:$associationPath" | Out-Null
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "⚠️ DISM could not import Chrome default associations (exit code $LASTEXITCODE); policy was still configured for sign-in."
            } else {
              Write-Host '🌐 ✅ Chrome default associations imported for new user profiles.'
            }
          }

          function Resolve-VSCodeCli {
            $candidates = @(
              "$env:ProgramFiles\Microsoft VS Code\bin\code.cmd",
              "${env:ProgramFiles(x86)}\Microsoft VS Code\bin\code.cmd",
              "$env:LOCALAPPDATA\Programs\Microsoft VS Code\bin\code.cmd"
            )

            foreach ($candidate in $candidates) {
              if ($candidate -and (Test-Path $candidate)) {
                return (Resolve-Path $candidate).Path
              }
            }

            $cmd = (Get-Command code.cmd -ErrorAction SilentlyContinue).Source
            if ($cmd) { return $cmd }

            return $null
          }

