          $summaryLines.Add("| Remote access method | $remoteMode |") | Out-Null
          $summaryLines.Add("| IDE Choice | ``$ideChoice`` |") | Out-Null
          $summaryLines.Add("| Video Editor Choice | ``$editorChoice`` |") | Out-Null
          $summaryLines.Add("| MetaTrader Choice | ``$metatraderChoice`` |") | Out-Null
          $summaryLines.Add("| Router Choice | ``$routerChoice`` |") | Out-Null
          $summaryLines.Add("| Coding Agent Choice | ``$codingAgentChoice`` |") | Out-Null
          $summaryLines.Add("| AI Agent Choice | ``$aiAgentChoice`` |") | Out-Null
          $summaryLines.Add("| ArtCraft Launcher Enabled | ``$installArtCraft`` |") | Out-Null
          $summaryLines.Add("") | Out-Null

          $summaryLines.Add("## 📦 App Status") | Out-Null
          $summaryLines.Add("") | Out-Null
          foreach ($line in $appRows) { $summaryLines.Add($line) | Out-Null }
          $summaryLines.Add("") | Out-Null

          $summaryLines.Add("## 🧩 Extensions & Policies") | Out-Null
          $summaryLines.Add("") | Out-Null
          foreach ($line in $extensionRows) { $summaryLines.Add($line) | Out-Null }
          $summaryLines.Add("") | Out-Null

          $summaryLines.Add("## 🚀 How to Connect") | Out-Null
          $summaryLines.Add("") | Out-Null
          $summaryLines.Add("Hubungkan perangkat Anda ke Tailscale tailnet yang sama.") | Out-Null
          if ($remoteMode -in @('rdp','both')) {
            $summaryLines.Add("**RDP:** Gunakan Microsoft Remote Desktop, hostname $env:TAILSCALE_HOSTNAME (atau IP $env:TAILSCALE_IP), lalu login dengan akun $env:RDP_USER.") | Out-Null
          }
          if ($remoteMode -in @('novnc','both')) {
            $summaryLines.Add("**noVNC:** Buka [$env:NOVNC_URL]($env:NOVNC_URL) di browser yang terhubung ke Tailscale, tekan Connect, dan gunakan password sesuai mode $vncPasswordMode.") | Out-Null
            $summaryLines.Add("noVNC menampilkan sesi console Windows. Jika memilih both, sesi RDP dan sesi noVNC mungkin berbeda.") | Out-Null
          }
          $summaryLines.Add("") | Out-Null

          $summaryLines.Add("## 🧯 Troubleshooting") | Out-Null
          $summaryLines.Add("") | Out-Null
          $summaryLines.Add("| Problem | Try this |") | Out-Null
          $summaryLines.Add("|---|---|") | Out-Null
          $summaryLines.Add("| Hostname tidak bisa connect | Pakai IP Tailscale fallback ``$env:TAILSCALE_IP`` |") | Out-Null
          $summaryLines.Add("| Password ditolak | Cek ``rdp_password_mode``; jika ``same_from_secret``, gunakan secret ``RDP_PASSWORD`` |") | Out-Null
          $summaryLines.Add("| VS Code tidak terbuka | Buka dari Start Menu, atau cek status ``Visual Studio Code`` di tabel App Status |") | Out-Null
          $summaryLines.Add("| Antigravity belum muncul | Login ulang ke user RDP atau buka shortcut Antigravity; workflow menyiapkan copy per-user |") | Out-Null
          $summaryLines.Add("| RDP timeout | Pastikan device lokal sudah connect ke Tailscale dan berada di tailnet yang sama |") | Out-Null
          $summaryLines.Add("| MagicDNS belum resolve | Tunggu sebentar atau langsung pakai IP Tailscale |") | Out-Null
          if ($remoteMode -in @('novnc','both')) {
            $summaryLines.Add("| noVNC URL tidak terbuka | Pilih tailscale_tcp (HTTP port 6082) atau tailscale_https (HTTPS *.ts.net port 443) pada run baru; jangan mengubah protokol URL |") | Out-Null
            $summaryLines.Add("| noVNC timeout | Periksa tailnet ACL/grants untuk port yang dipilih, IP runner di run aktif, dan node online di Tailscale admin |") | Out-Null
            $summaryLines.Add("| Tailnet sama tetapi timeout | Dari PC jalankan tailscale ping dan Test-NetConnection ke port 6082 (mode TCP) atau 443 (mode HTTPS) |") | Out-Null
            $summaryLines.Add("| Server noVNC tidak tersedia | Pastikan run GitHub Actions masih aktif. Setelah runner berakhir, layanan dan IP sesi tidak dapat digunakan |") | Out-Null
            $summaryLines.Add("| noVNC password ditolak | Untuk mode tetap gunakan VNC_PASSWORD, untuk acak lihat log step noVNC. VNCAuth memakai 8 byte pertama. |") | Out-Null
          }
          $summaryLines.Add("") | Out-Null

          $summaryLines.Add("## 🧹 Cleanup") | Out-Null
          $summaryLines.Add("") | Out-Null
          $summaryLines.Add("Jangan tutup terminal GitHub runner karena itu dapat menghentikan job. Tailscale logout dikelola oleh step Cleanup, bukan oleh finally Keep Alive.") | Out-Null

          $summaryLines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: 🛡️ Hide runner console without closing GitHub Actions
        if: inputs.remote_access != 'rdp'
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 1
        run: |
          # The viewer sees the runner's interactive Windows console. Closing
          # its actual Runner.Listener console may shut down the whole job.
          # Only hide that specific window; NEVER terminate runner processes.
          $base = Join-Path $env:ProgramData 'RDP-Setup'
          New-Item -Path $base -ItemType Directory -Force | Out-Null
          $helper = Join-Path $base 'wfs-hide-runner-console.ps1'
          $stdout = Join-Path $base 'wfs-hide-console.stdout.log'
          $stderr = Join-Path $base 'wfs-hide-console.stderr.log'
          @'
          $ErrorActionPreference = 'Stop'
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public static class WfsRunnerConsole {
            [DllImport("kernel32.dll", SetLastError=true)] public static extern bool FreeConsole();
            [DllImport("kernel32.dll", SetLastError=true)] public static extern bool AttachConsole(uint processId);
            [DllImport("kernel32.dll", SetLastError=true)] public static extern IntPtr GetConsoleWindow();
            [DllImport("user32.dll", SetLastError=true)] public static extern bool ShowWindowAsync(IntPtr window, int command);
            [DllImport("user32.dll", SetLastError=true)] public static extern bool IsWindowVisible(IntPtr window);
          }
          "@
          $listener = Get-Process -Name 'Runner.Listener' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $listener) {
            Write-Output 'No Runner.Listener process found; skipping console hide.'
            exit 0
          }
          # Operate in a short-lived child PowerShell to avoid detaching the
          # workflow step itself from its output/runner connection.
          [void][WfsRunnerConsole]::FreeConsole()
          if (-not [WfsRunnerConsole]::AttachConsole([uint32]$listener.Id)) {
            Write-Output "Runner.Listener PID $($listener.Id) has no attachable console."
            exit 0
          }
          $hwnd = [WfsRunnerConsole]::GetConsoleWindow()
          [void][WfsRunnerConsole]::FreeConsole()
          if ($hwnd -eq [IntPtr]::Zero) {
            Write-Output 'Runner.Listener console has no window to hide.'
            exit 0
          }
          if ([WfsRunnerConsole]::IsWindowVisible($hwnd)) {
            [void][WfsRunnerConsole]::ShowWindowAsync($hwnd,0)
            Write-Output "Runner.Listener window hidden; PID $($listener.Id) remains active."
          } else {
            Write-Output 'Runner.Listener console is already hidden.'
          }
          '@ | Set-Content -LiteralPath $helper -Encoding UTF8
          try {
            $shell = Join-Path $PSHOME 'pwsh.exe'
            $args = '-NoProfile -NonInteractive -File "' + $helper + '"'
            $child = Start-Process -FilePath $shell -ArgumentList $args -WindowStyle Hidden -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $child.WaitForExit(15000)) {
              try { $child.Kill($true) } catch { Stop-Process -Id $child.Id -Force -ErrorAction SilentlyContinue }
              Write-Warning 'Optional runner window hide timed out.'
            } else {
              if (Test-Path $stdout) { Get-Content -LiteralPath $stdout -ErrorAction SilentlyContinue | Out-Host }
              if ($child.ExitCode -ne 0) {
                Write-Warning 'Runner console was not hidden; do not manually close the GitHub runner terminal.'
                if (Test-Path $stderr) { Get-Content -LiteralPath $stderr -Tail 10 | Out-Host }
              }
            }
          } catch {
            Write-Warning "Optional runner console hiding unavailable: $($_.Exception.Message)"
          }

      - name: 🟢 Remote READY - Keep Alive (session intentionally remains running)
        shell: pwsh
        run: |
          $passwordMode = '${{ inputs.rdp_password_mode }}'
          $vncPasswordMode = '${{ inputs.vnc_password_mode }}'
          $remoteMode = '${{ inputs.remote_access }}'

          if ($passwordMode -eq "same_from_secret") {
            $passwordForDisplay = "Use GitHub Secret RDP_PASSWORD"
          } else {
            $passwordForDisplay = $env:RDP_PASSWORD
          }

          Write-Host ""
          Write-Host "╔══════════════════════════════════════╗"
          Write-Host "║         WINDOWS REMOTE READY         ║"
          Write-Host "╠══════════════════════════════════════╣"
          Write-Host "║  Hostname : $env:TAILSCALE_HOSTNAME"
          Write-Host "║  IP       : $env:TAILSCALE_IP"
          Write-Host "║  Username : $env:RDP_USER"
          Write-Host "║  Mode     : $remoteMode"
          if ($remoteMode -in @('rdp','both')) {
            Write-Host "║  RDP user : $env:RDP_USER"
            Write-Host "║  Password : $passwordForDisplay"
          }
          if ($remoteMode -in @('novnc','both')) {
            Write-Host "║  noVNC    : $env:NOVNC_URL"
            Write-Host "║  Protocol : $env:NOVNC_TRANSPORT"
            Write-Host "║  Local WS : $env:NOVNC_LOCAL_WS_STATUS"
            Write-Host "║  Serve WS : $env:NOVNC_SERVE_SELF_WS_STATUS"
            $vncHint = if ($vncPasswordMode -eq 'same_from_secret') { 'secret VNC_PASSWORD' } else { 'generated; see noVNC step log' }
            Write-Host "║  VNC pass : $vncHint"
          }
          Write-Host "╚══════════════════════════════════════╝"
          Write-Host ""

          $hours = [int]'${{ inputs.duration_hours }}'
          $seconds = $hours * 3600
          $elapsed = 0
          Write-Host "Remote is ready. This step intentionally stays active for $hours hour(s)."
          Write-Host 'Do not close the GitHub runner console; use the noVNC Disconnect button instead.'
          while ($elapsed -lt $seconds) {
            $minutesLeft = [Math]::Ceiling(($seconds - $elapsed) / 60)
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Remote READY - $minutesLeft minute(s) remaining"
            $sleepFor = [Math]::Min(60, $seconds - $elapsed)
            Start-Sleep -Seconds $sleepFor
            $elapsed += $sleepFor
          }
          Write-Host 'Session ended normally. Cleanup step will handle Tailscale logout.'

      - name: 🧹 Cleanup Tailscale Logout
        if: always()
        shell: pwsh
        run: |
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (Test-Path $tsExe) {
            Write-Host "Running final Tailscale cleanup/logout..."
            & $tsExe logout

            if ($LASTEXITCODE -eq 0) {
              Write-Host "✅ Final Tailscale logout completed"
            } else {
              Write-Warning "⚠️ Final Tailscale logout returned exit code $LASTEXITCODE"
            }
          } else {
            Write-Host "tailscale.exe not found. Skipping final cleanup."
          }
