name: 🪟 Windows RDP withs Apps

on:
  workflow_dispatch:
    inputs:
      windows_version:
        description: 'Pilih Versi Windows (OS)'
        required: true
        default: 'windows-2025'
        type: choice
        options:
          # Recommended stable Windows x64 runners
          - 'windows-latest'
          - 'windows-2025'
          - 'windows-2022'

          # Windows ARM64 runner
          - 'windows-11-arm'

          # Public repository only / Visual Studio 2026 image
          # Jika repo private gagal, gunakan windows-2025 atau windows-2022
          - 'windows-2025-vs2026'

      duration_hours:
        description: 'Durasi RDP Aktif (Jam)'
        required: true
        default: '6'
        type: choice
        options:
          - '1'
          - '3'
          - '6'

jobs:
  secure-rdp:
    name: 🖥️ Windows Remote Desktop
    runs-on: ${{ inputs.windows_version }}
    timeout-minutes: 360

    env:
      RDP_USER: RDP

    steps:
      - name: ⚡ Optimize Windows Performance
        shell: pwsh
        run: |
          Write-Host "==========================================="
          Write-Host " Optimizing Windows for RDP Performance"
          Write-Host "==========================================="

          # Visual & animation tweaks
          $regPath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects"
          Set-ItemProperty -Path $regPath -Name "VisualFXSetting" -Value 2 -Force -ErrorAction SilentlyContinue

          $perf = "HKCU:\Control Panel\Desktop"
          Set-ItemProperty -Path $perf -Name "MenuShowDelay" -Value "0" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $perf -Name "DragFullWindows" -Value "0" -Force -ErrorAction SilentlyContinue

          # High performance power plan
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          powercfg -hibernate off

          # Disable unnecessary services
          $services = @(
            "SysMain",
            "WSearch",
            "DiagTrack",
            "dmwappushservice",
            "MapsBroker",
            "XblGameSave",
            "XboxNetApiSvc",
            "RetailDemo",
            "TabletInputService"
          )

          foreach ($svc in $services) {
            Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
            Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
          }

          # Enable audio service
          Set-Service -Name "Audiosrv" -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name "Audiosrv" -ErrorAction SilentlyContinue

          # Optional Defender optimization
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue

          # Network tweaks
          netsh int tcp set global autotuninglevel=normal
          netsh int tcp set global chimney=disabled
          netsh int tcp set supplemental internet congestionprovider=ctcp

          Write-Host "✅ Windows optimization completed"

      - name: 🔐 Configure RDP
        shell: pwsh
        run: |
          Write-Host "Configuring Remote Desktop..."

          # Enable RDP
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          # Compatibility mode for GitHub Actions RDP
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          # 32-bit color depth
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "ColorDepth" `
            -Value 4 `
            -Force `
            -ErrorAction SilentlyContinue

          # Firewall rule
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          Restart-Service -Name TermService -Force

          Write-Host "✅ RDP configured"

      - name: 👤 Create RDP User
        shell: pwsh
        run: |
          Write-Host "Generating secure password..."

          # Password generator that works on GitHub Actions Windows runner
          $upper   = [char[]](65..90)   | Get-Random -Count 4
          $lower   = [char[]](97..122)  | Get-Random -Count 4
          $number  = [char[]](48..57)   | Get-Random -Count 4
          $special = [char[]]@(33,64,35,36,42,43,45,61) | Get-Random -Count 4

          $password = -join ($upper + $lower + $number + $special | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          # Remove old user if exists
          if (Get-LocalUser -Name $env:RDP_USER -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name $env:RDP_USER
          }

          New-LocalUser `
            -Name $env:RDP_USER `
            -Password $securePass `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -UserMayNotChangePassword

          Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USER
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:RDP_USER

          "RDP_PASSWORD=$password" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

          Write-Host "✅ User RDP created"
          Write-Host "Username: $env:RDP_USER"
          Write-Host "Password: $password"

      - name: 📦 Install Apps & Chrome Extensions
        shell: pwsh
        run: |
          Write-Host "==========================================="
          Write-Host " Installing requested apps and extensions"
          Write-Host "==========================================="

          # Resolve winget path on GitHub Actions Windows runners
          $winget = (Get-Command winget.exe -ErrorAction SilentlyContinue).Source

          if (-not $winget) {
            $wingetCandidates = @(
              "$env:LOCALAPPDATA\Microsoft\WindowsApps\winget.exe"
            )

            $wingetCandidates += Get-ChildItem `
              -Path "$env:ProgramFiles\WindowsApps" `
              -Filter "winget.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName

            $winget = $wingetCandidates |
              Where-Object { $_ -and (Test-Path $_) } |
              Select-Object -First 1
          }

          if (-not $winget) {
            Write-Error "❌ winget.exe tidak ditemukan di runner Windows ini"
            exit 1
          }

          Write-Host "Using winget: $winget"
          & $winget source update --disable-interactivity

          function Install-WingetPackage {
            param(
              [Parameter(Mandatory = $true)] [string] $Id,
              [Parameter(Mandatory = $true)] [string] $Name,
              [string[]] $FallbackIds = @()
            )

            $packageIds = @($Id) + $FallbackIds

            foreach ($packageId in $packageIds) {
              Write-Host "Installing $Name [$packageId]..."

              & $winget install `
                --id $packageId `
                --exact `
                --silent `
                --accept-package-agreements `
                --accept-source-agreements `
                --disable-interactivity

              if ($LASTEXITCODE -eq 0) {
                Write-Host "✅ $Name installed with package ID: $packageId"
                return
              }

              Write-Warning "Install failed for $packageId. Trying fallback if available..."
            }

            Write-Error "❌ Failed to install $Name"
            exit 1
          }

          # Apps
          Install-WingetPackage -Id "Google.Chrome" -Name "Google Chrome"
          Install-WingetPackage -Id "RARLab.WinRAR" -Name "WinRAR"
          Install-WingetPackage -Id "Google.AntigravityIDE" -Name "Antigravity IDE"
          Install-WingetPackage -Id "OpenJS.NodeJS.LTS" -Name "Node.js LTS"

          # Codex GUI / desktop app via official Microsoft Store package
          function Install-MSStorePackage {
            param(
              [Parameter(Mandatory = $true)] [string] $Id,
              [Parameter(Mandatory = $true)] [string] $Name
            )

            Write-Host "Installing $Name from Microsoft Store [$Id]..."

            & $winget install `
              --id $Id `
              --source msstore `
              --accept-package-agreements `
              --accept-source-agreements `
              --disable-interactivity

            if ($LASTEXITCODE -eq 0) {
              Write-Host "✅ $Name installed from Microsoft Store"
              return
            }

            Write-Error "❌ Failed to install $Name from Microsoft Store"
            exit 1
          }

          Install-MSStorePackage -Id "9PLM9XGG6VKS" -Name "Codex GUI"

          # Register a one-time user-context install for RDP as a safety net.
          # Microsoft Store/MSIX apps can be user-scoped, so this makes sure Codex is also available after logging in as RDP.
          # Unlike Antigravity IDE, Codex is a packaged Microsoft Store app, so copying AppData is not enough.
          # The launcher below installs/registers Codex in the active RDP user context and then opens it through AppsFolder/AppUserModelID.
          $codexSetupDir = Join-Path $env:ProgramData "RDP-Setup"
          New-Item -ItemType Directory -Path $codexSetupDir -Force | Out-Null
          $codexSetupScript = Join-Path $codexSetupDir "install-codex-gui-for-rdp.ps1"
          $codexLauncherScript = Join-Path $codexSetupDir "launch-codex-gui.ps1"

          @'
          $ErrorActionPreference = "Continue"

          function Resolve-WingetExe {
            $winget = (Get-Command winget.exe -ErrorAction SilentlyContinue).Source

            if (-not $winget) {
              $wingetCandidates = @(
                "$env:LOCALAPPDATA\Microsoft\WindowsApps\winget.exe"
              )

              $wingetCandidates += Get-ChildItem `
                -Path "$env:ProgramFiles\WindowsApps" `
                -Filter "winget.exe" `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -ExpandProperty FullName

              $winget = $wingetCandidates |
                Where-Object { $_ -and (Test-Path $_) } |
                Select-Object -First 1
            }

            return $winget
          }

          function Resolve-CodexStartApp {
            Get-StartApps -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -like "*Codex*" -or
                $_.AppID -like "*Codex*" -or
                $_.Name -like "*OpenAI*" -or
                $_.AppID -like "*OpenAI*"
              } |
              Select-Object -First 1
          }

          $codexStartApp = Resolve-CodexStartApp

          if (-not $codexStartApp) {
            $winget = Resolve-WingetExe

            if ($winget) {
              & $winget source update --disable-interactivity
              & $winget install `
                --id 9PLM9XGG6VKS `
                --source msstore `
                --accept-package-agreements `
                --accept-source-agreements `
                --disable-interactivity
            } else {
              Write-Host "winget.exe not found, so Codex GUI could not be installed for this user."
            }
          }

          Unregister-ScheduledTask -TaskName "Install Codex GUI for RDP" -Confirm:$false -ErrorAction SilentlyContinue
          '@ | Set-Content -Path $codexSetupScript -Encoding UTF8

          @'
          $ErrorActionPreference = "Continue"

          function Resolve-WingetExe {
            $winget = (Get-Command winget.exe -ErrorAction SilentlyContinue).Source

            if (-not $winget) {
              $wingetCandidates = @(
                "$env:LOCALAPPDATA\Microsoft\WindowsApps\winget.exe"
              )

              $wingetCandidates += Get-ChildItem `
                -Path "$env:ProgramFiles\WindowsApps" `
                -Filter "winget.exe" `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -ExpandProperty FullName

              $winget = $wingetCandidates |
                Where-Object { $_ -and (Test-Path $_) } |
                Select-Object -First 1
            }

            return $winget
          }

          function Resolve-CodexStartApp {
            Get-StartApps -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -like "*Codex*" -or
                $_.AppID -like "*Codex*" -or
                $_.Name -like "*OpenAI*" -or
                $_.AppID -like "*OpenAI*"
              } |
              Select-Object -First 1
          }

          $codexStartApp = Resolve-CodexStartApp

          if (-not $codexStartApp) {
            Write-Host "Codex GUI is not registered for user $env:USERNAME yet. Installing/registering now..."
            $winget = Resolve-WingetExe

            if ($winget) {
              & $winget source update --disable-interactivity
              & $winget install `
                --id 9PLM9XGG6VKS `
                --source msstore `
                --accept-package-agreements `
                --accept-source-agreements `
                --disable-interactivity
            } else {
              Write-Host "winget.exe not found. Cannot install Codex GUI for user $env:USERNAME."
            }

            for ($i = 0; $i -lt 12 -and -not $codexStartApp; $i++) {
              Start-Sleep -Seconds 5
              $codexStartApp = Resolve-CodexStartApp
            }
          }

          if ($codexStartApp) {
            Start-Process -FilePath "explorer.exe" -ArgumentList "shell:AppsFolder\$($codexStartApp.AppID)"
          } else {
            Write-Host "Codex GUI Start App ID was not found for user $env:USERNAME. Try opening Microsoft Store once, then run this shortcut again."
            exit 1
          }
          '@ | Set-Content -Path $codexLauncherScript -Encoding UTF8

          try {
            $action = New-ScheduledTaskAction `
              -Execute "powershell.exe" `
              -Argument "-NoProfile -ExecutionPolicy Bypass -File `"$codexSetupScript`""

            $trigger = New-ScheduledTaskTrigger -AtLogOn -User $env:RDP_USER

            Register-ScheduledTask `
              -TaskName "Install Codex GUI for RDP" `
              -Action $action `
              -Trigger $trigger `
              -User $env:RDP_USER `
              -Password $env:RDP_PASSWORD `
              -RunLevel Highest `
              -Force | Out-Null

            Write-Host "✅ One-time Codex GUI install task registered for $env:RDP_USER"
            Write-Host "✅ Codex GUI launcher prepared: $codexLauncherScript"
          } catch {
            Write-Warning "Could not register RDP Codex GUI install task: $($_.Exception.Message)"
          }

          $npm = $null
          $npmCandidates = @(
            "$env:ProgramFiles\nodejs\npm.cmd",
            "${env:ProgramFiles(x86)}\nodejs\npm.cmd"
          )

          $npm = $npmCandidates |
            Where-Object { $_ -and (Test-Path $_) } |
            Select-Object -First 1

          if (-not $npm) {
            $npm = (Get-Command npm.cmd -ErrorAction SilentlyContinue).Source
          }

          if (-not $npm) {
            Write-Error "❌ npm.cmd tidak ditemukan setelah instalasi Node.js"
            exit 1
          }

          # 9Router CLI via official npm package
          Write-Host "Installing 9Router CLI using npm: $npm"
          & $npm install -g 9router

          if ($LASTEXITCODE -ne 0) {
            Write-Error "❌ 9Router CLI installation failed"
            exit 1
          }

          Write-Host "✅ 9Router CLI installed"

          # Force install Chrome extensions for all users via Chrome enterprise policy
          $extensionUpdateUrl = "https://clients2.google.com/service/update2/crx"
          $chromePolicyPath = "HKLM:\Software\Policies\Google\Chrome\ExtensionInstallForcelist"

          New-Item -Path $chromePolicyPath -Force | Out-Null

          $chromeExtensions = @(
            "hlkenndednhfkekhgcdicdfddnkalmdm;$extensionUpdateUrl", # Cookie-Editor
            "fdpohaocaechififmbbbbbknoalclacl;$extensionUpdateUrl"  # GoFullPage
          )

          for ($i = 0; $i -lt $chromeExtensions.Count; $i++) {
            New-ItemProperty `
              -Path $chromePolicyPath `
              -Name "$($i + 1)" `
              -Value $chromeExtensions[$i] `
              -PropertyType String `
              -Force | Out-Null
          }

          Write-Host "✅ Chrome extensions policy configured"
          Write-Host "   - Cookie-Editor"
          Write-Host "   - GoFullPage"


      - name: 🧬 Prepare Antigravity IDE for RDP User
        shell: pwsh
        run: |
          Write-Host "==========================================="
          Write-Host " Preparing Antigravity IDE for RDP user"
          Write-Host "==========================================="
          Write-Host "Antigravity IDE is installed with user scope under runneradmin. This step stages it in ProgramData and prepares a per-user copy for $env:RDP_USER."

          $setupDir = Join-Path $env:ProgramData "RDP-Setup"
          $antigravityStagingRoot = Join-Path $setupDir "Antigravity IDE"
          $antigravityLauncherScript = Join-Path $setupDir "launch-antigravity-ide.ps1"
          $antigravityCopyScript = Join-Path $setupDir "copy-antigravity-ide-for-rdp.ps1"

          New-Item -ItemType Directory -Path $setupDir -Force | Out-Null

          function Resolve-AntigravityIdeExe {
            $candidateExePaths = @(
              "$env:LOCALAPPDATA\Programs\Antigravity IDE\Antigravity IDE.exe",
              "$env:LOCALAPPDATA\Antigravity IDE\Antigravity IDE.exe",
              "C:\Users\runneradmin\AppData\Local\Programs\Antigravity IDE\Antigravity IDE.exe",
              "$env:ProgramFiles\Antigravity IDE\Antigravity IDE.exe",
              "${env:ProgramFiles(x86)}\Antigravity IDE\Antigravity IDE.exe"
            )

            foreach ($candidate in $candidateExePaths) {
              if ([string]::IsNullOrWhiteSpace($candidate)) { continue }
              if (Test-Path $candidate) {
                return (Resolve-Path $candidate).Path
              }
            }

            $searchRoots = @(
              "$env:LOCALAPPDATA\Programs",
              "$env:LOCALAPPDATA",
              "C:\Users\runneradmin\AppData\Local\Programs",
              "$env:ProgramFiles",
              "${env:ProgramFiles(x86)}"
            )

            foreach ($root in $searchRoots) {
              if ([string]::IsNullOrWhiteSpace($root) -or -not (Test-Path $root)) { continue }

              $found = Get-ChildItem `
                -Path $root `
                -Include "Antigravity IDE.exe", "antigravity-ide.exe" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                return $found.FullName
              }
            }

            return $null
          }

          $antigravitySourceExe = Resolve-AntigravityIdeExe

          if (-not $antigravitySourceExe) {
            Write-Warning "Antigravity IDE executable was not found. RDP user copy and launcher will still be prepared, but shortcut may not work until the package path is corrected."
          } else {
            $antigravitySourceDir = Split-Path $antigravitySourceExe -Parent
            Write-Host "Found Antigravity IDE source: $antigravitySourceDir"

            if (Test-Path $antigravityStagingRoot) {
              Remove-Item -Path $antigravityStagingRoot -Recurse -Force -ErrorAction SilentlyContinue
            }

            New-Item -ItemType Directory -Path $antigravityStagingRoot -Force | Out-Null
            Copy-Item -Path (Join-Path $antigravitySourceDir "*") -Destination $antigravityStagingRoot -Recurse -Force
            Write-Host "✅ Antigravity IDE staged to: $antigravityStagingRoot"
          }

          @'
          $ErrorActionPreference = "Continue"

          $sourceRoot = Join-Path $env:ProgramData "RDP-Setup\Antigravity IDE"
          $destRoot = Join-Path $env:LOCALAPPDATA "Programs\Antigravity IDE"
          $sourceExe = Join-Path $sourceRoot "Antigravity IDE.exe"
          $destExe = Join-Path $destRoot "Antigravity IDE.exe"

          if (-not (Test-Path $sourceExe)) {
            Write-Host "Antigravity IDE staged source not found: $sourceExe"
            exit 1
          }

          $shouldCopy = -not (Test-Path $destExe)

          if (-not $shouldCopy) {
            try {
              $sourceTime = (Get-Item $sourceExe).LastWriteTimeUtc
              $destTime = (Get-Item $destExe).LastWriteTimeUtc
              if ($sourceTime -gt $destTime) {
                $shouldCopy = $true
              }
            } catch {
              $shouldCopy = $true
            }
          }

          if ($shouldCopy) {
            New-Item -ItemType Directory -Path $destRoot -Force | Out-Null
            Copy-Item -Path (Join-Path $sourceRoot "*") -Destination $destRoot -Recurse -Force
          }

          if (Test-Path $destExe) {
            Start-Process -FilePath $destExe
          } else {
            Write-Host "Antigravity IDE executable not found after copy: $destExe"
            exit 1
          }
          '@ | Set-Content -Path $antigravityLauncherScript -Encoding UTF8

          @'
          $ErrorActionPreference = "Continue"

          $sourceRoot = Join-Path $env:ProgramData "RDP-Setup\Antigravity IDE"
          $destRoot = Join-Path $env:LOCALAPPDATA "Programs\Antigravity IDE"
          $sourceExe = Join-Path $sourceRoot "Antigravity IDE.exe"
          $destExe = Join-Path $destRoot "Antigravity IDE.exe"

          if (Test-Path $sourceExe) {
            if (-not (Test-Path $destExe)) {
              New-Item -ItemType Directory -Path $destRoot -Force | Out-Null
              Copy-Item -Path (Join-Path $sourceRoot "*") -Destination $destRoot -Recurse -Force
            }
          }

          Unregister-ScheduledTask -TaskName "Prepare Antigravity IDE for RDP" -Confirm:$false -ErrorAction SilentlyContinue
          '@ | Set-Content -Path $antigravityCopyScript -Encoding UTF8

          # If the RDP profile already exists, copy immediately. Otherwise the logon task and launcher will do it after RDP signs in.
          $rdpProfile = Join-Path "C:\Users" $env:RDP_USER
          $rdpAntigravityDest = Join-Path $rdpProfile "AppData\Local\Programs\Antigravity IDE"

          if ((Test-Path $rdpProfile) -and (Test-Path $antigravityStagingRoot)) {
            New-Item -ItemType Directory -Path $rdpAntigravityDest -Force | Out-Null
            Copy-Item -Path (Join-Path $antigravityStagingRoot "*") -Destination $rdpAntigravityDest -Recurse -Force
            Write-Host "✅ Antigravity IDE copied immediately to RDP profile: $rdpAntigravityDest"
          } else {
            Write-Host "RDP profile is not ready yet. Antigravity IDE will be copied when $env:RDP_USER logs in or opens the shortcut."
          }

          try {
            $action = New-ScheduledTaskAction `
              -Execute "powershell.exe" `
              -Argument "-NoProfile -ExecutionPolicy Bypass -File `"$antigravityCopyScript`""

            $trigger = New-ScheduledTaskTrigger -AtLogOn -User $env:RDP_USER

            Register-ScheduledTask `
              -TaskName "Prepare Antigravity IDE for RDP" `
              -Action $action `
              -Trigger $trigger `
              -User $env:RDP_USER `
              -Password $env:RDP_PASSWORD `
              -RunLevel Highest `
              -Force | Out-Null

            Write-Host "✅ One-time Antigravity IDE copy task registered for $env:RDP_USER"
          } catch {
            Write-Warning "Could not register Antigravity IDE copy task: $($_.Exception.Message)"
          }

          Write-Host "✅ Antigravity IDE RDP preparation completed"


      - name: 🧷 Publish App Shortcuts for RDP User
        shell: pwsh
        run: |
          Write-Host "==========================================="
          Write-Host " Publishing installed apps to RDP user UI"
          Write-Host "==========================================="
          Write-Host "Apps may be installed under runneradmin/user scope. Shortcuts below are published through Public Desktop and the common Start Menu so they appear when logging in as $env:RDP_USER."

          $publicDesktop = Join-Path $env:PUBLIC "Desktop"
          $commonStartMenu = Join-Path $env:ProgramData "Microsoft\Windows\Start Menu\Programs"
          $shortcutDirectories = @($publicDesktop, $commonStartMenu)

          $rdpProfile = Join-Path "C:\Users" $env:RDP_USER
          if (Test-Path $rdpProfile) {
            $shortcutDirectories += Join-Path $rdpProfile "Desktop"
            $shortcutDirectories += Join-Path $rdpProfile "AppData\Roaming\Microsoft\Windows\Start Menu\Programs"
          }

          $shortcutDirectories = $shortcutDirectories |
            Where-Object { $_ -and $_.Trim() } |
            Select-Object -Unique

          foreach ($dir in $shortcutDirectories) {
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
          }

          function Resolve-AppTarget {
            param(
              [string[]] $CandidatePaths = @(),
              [string[]] $SearchRoots = @(),
              [string[]] $ExecutableNames = @()
            )

            foreach ($candidate in $CandidatePaths) {
              if ([string]::IsNullOrWhiteSpace($candidate)) { continue }

              $expanded = [Environment]::ExpandEnvironmentVariables($candidate)
              if (Test-Path $expanded) {
                return (Resolve-Path $expanded).Path
              }
            }

            foreach ($root in $SearchRoots) {
              if ([string]::IsNullOrWhiteSpace($root)) { continue }

              $expandedRoot = [Environment]::ExpandEnvironmentVariables($root)
              if (-not (Test-Path $expandedRoot)) { continue }

              foreach ($exeName in $ExecutableNames) {
                $found = Get-ChildItem `
                  -Path $expandedRoot `
                  -Filter $exeName `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  Select-Object -First 1

                if ($found) {
                  return $found.FullName
                }
              }
            }

            return $null
          }

          function New-AppShortcut {
            param(
              [Parameter(Mandatory = $true)] [string] $Name,
              [AllowNull()] [string] $TargetPath,
              [string] $Arguments = "",
              [string] $IconLocation = ""
            )

            if ([string]::IsNullOrWhiteSpace($TargetPath) -or -not (Test-Path $TargetPath)) {
              Write-Warning "Shortcut skipped for $Name because target was not found: $TargetPath"
              return
            }

            $shell = New-Object -ComObject WScript.Shell

            foreach ($dir in $shortcutDirectories) {
              $shortcutPath = Join-Path $dir "$Name.lnk"
              $shortcut = $shell.CreateShortcut($shortcutPath)
              $shortcut.TargetPath = $TargetPath
              $shortcut.Arguments = $Arguments
              $shortcut.WorkingDirectory = Split-Path $TargetPath -Parent
              $shortcut.IconLocation = if ([string]::IsNullOrWhiteSpace($IconLocation)) { $TargetPath } else { $IconLocation }
              $shortcut.Save()

              Write-Host "✅ Shortcut created: $shortcutPath"
            }
          }

          $runnerLocalPrograms = Join-Path $env:LOCALAPPDATA "Programs"
          $runnerRoamingNpm = Join-Path $env:APPDATA "npm"
          $antigravityLauncher = Join-Path $env:ProgramData "RDP-Setup\launch-antigravity-ide.ps1"
          $codexLauncher = Join-Path $env:ProgramData "RDP-Setup\launch-codex-gui.ps1"

          $chromeTarget = Resolve-AppTarget `
            -CandidatePaths @(
              "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
              "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
            ) `
            -SearchRoots @(
              "$env:ProgramFiles\Google",
              "${env:ProgramFiles(x86)}\Google"
            ) `
            -ExecutableNames @("chrome.exe")

          $winrarTarget = Resolve-AppTarget `
            -CandidatePaths @(
              "$env:ProgramFiles\WinRAR\WinRAR.exe",
              "${env:ProgramFiles(x86)}\WinRAR\WinRAR.exe"
            ) `
            -SearchRoots @(
              "$env:ProgramFiles\WinRAR",
              "${env:ProgramFiles(x86)}\WinRAR"
            ) `
            -ExecutableNames @("WinRAR.exe")

          $antigravityIdeTarget = Resolve-AppTarget `
            -CandidatePaths @(
              "$runnerLocalPrograms\Antigravity IDE\Antigravity IDE.exe",
              "$env:LOCALAPPDATA\Antigravity IDE\Antigravity IDE.exe",
              "C:\Users\runneradmin\AppData\Local\Programs\Antigravity IDE\Antigravity IDE.exe"
            ) `
            -SearchRoots @(
              $runnerLocalPrograms,
              "$env:LOCALAPPDATA",
              "C:\Users\runneradmin\AppData\Local\Programs",
              "$env:ProgramFiles\Antigravity IDE",
              "${env:ProgramFiles(x86)}\Antigravity IDE"
            ) `
            -ExecutableNames @("Antigravity IDE.exe", "antigravity-ide.exe")

          $nodeTarget = Resolve-AppTarget `
            -CandidatePaths @(
              "$env:ProgramFiles\nodejs\node.exe",
              "${env:ProgramFiles(x86)}\nodejs\node.exe"
            ) `
            -SearchRoots @(
              "$env:ProgramFiles\nodejs",
              "${env:ProgramFiles(x86)}\nodejs"
            ) `
            -ExecutableNames @("node.exe")

          function Resolve-StartAppId {
            param(
              [Parameter(Mandatory = $true)] [string[]] $NamePatterns
            )

            $apps = Get-StartApps -ErrorAction SilentlyContinue
            foreach ($pattern in $NamePatterns) {
              $match = $apps |
                Where-Object { $_.Name -like $pattern -or $_.AppID -like $pattern } |
                Select-Object -First 1

              if ($match) {
                return $match.AppID
              }
            }

            return $null
          }

          $codexAppId = Resolve-StartAppId -NamePatterns @("*Codex*", "*OpenAI*")

          $nineRouterTarget = Resolve-AppTarget `
            -CandidatePaths @(
              "$runnerRoamingNpm\9router.cmd",
              "$env:ProgramFiles\nodejs\9router.cmd",
              "${env:ProgramFiles(x86)}\nodejs\9router.cmd"
            ) `
            -SearchRoots @(
              $runnerRoamingNpm,
              "$env:ProgramFiles\nodejs",
              "${env:ProgramFiles(x86)}\nodejs"
            ) `
            -ExecutableNames @("9router.cmd", "9router.ps1")

          New-AppShortcut -Name "Google Chrome" -TargetPath $chromeTarget
          New-AppShortcut -Name "WinRAR" -TargetPath $winrarTarget

          if (Test-Path $antigravityLauncher) {
            $antigravityIcon = if ($antigravityIdeTarget -and (Test-Path $antigravityIdeTarget)) { $antigravityIdeTarget } else { "$env:SystemRoot\System32\shell32.dll,2" }
            New-AppShortcut -Name "Antigravity IDE" -TargetPath "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -Arguments "-NoProfile -ExecutionPolicy Bypass -File `"$antigravityLauncher`"" -IconLocation $antigravityIcon
          } else {
            New-AppShortcut -Name "Antigravity IDE" -TargetPath $antigravityIdeTarget
          }

          if ($nodeTarget) {
            New-AppShortcut -Name "Node.js Command Prompt" -TargetPath "$env:SystemRoot\System32\cmd.exe" -Arguments "/k `"$nodeTarget`" --version"
          }

          if (Test-Path $codexLauncher) {
            New-AppShortcut -Name "Codex" -TargetPath "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -Arguments "-NoProfile -ExecutionPolicy Bypass -File `"$codexLauncher`"" -IconLocation "$env:SystemRoot\System32\shell32.dll,220"
          } elseif ($codexAppId) {
            New-AppShortcut -Name "Codex" -TargetPath "$env:SystemRoot\explorer.exe" -Arguments "shell:AppsFolder\$codexAppId" -IconLocation "$env:SystemRoot\System32\shell32.dll,220"
          } else {
            Write-Warning "Codex GUI Start App ID belum ditemukan dan launcher Codex tidak tersedia. Pastikan step install Codex GUI berhasil."
          }

          if ($nineRouterTarget) {
            New-AppShortcut -Name "9Router" -TargetPath "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -Arguments "-NoExit -ExecutionPolicy Bypass -Command `"& '$nineRouterTarget'`""
          }

          Write-Host "✅ Shortcut publishing completed"

      - name: 🐾 Install Tailscale
        shell: pwsh
        run: |
          Write-Host "Detecting Windows runner architecture..."

          $tailscaleVersion = "1.98.2"
          $runnerArch = $env:RUNNER_ARCH

          if ([string]::IsNullOrWhiteSpace($runnerArch)) {
            $runnerArch = $env:PROCESSOR_ARCHITECTURE
          }

          Write-Host "Runner architecture: $runnerArch"

          switch -Regex ($runnerArch) {
            "ARM64" {
              $tsArch = "arm64"
            }
            "X64|AMD64" {
              $tsArch = "amd64"
            }
            "X86" {
              $tsArch = "x86"
            }
            default {
              Write-Error "Unsupported architecture: $runnerArch"
              exit 1
            }
          }

          $tsUrl  = "https://pkgs.tailscale.com/stable/tailscale-setup-$tailscaleVersion-$tsArch.msi"
          $tsPath = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale:"
          Write-Host $tsUrl

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $tsPath `
            -UseBasicParsing

          if (-not (Test-Path $tsPath)) {
            Write-Error "Tailscale installer download failed"
            exit 1
          }

          Write-Host "Installing Tailscale silently..."

          Start-Process msiexec.exe `
            -ArgumentList "/i", "`"$tsPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $tsPath -Force -ErrorAction SilentlyContinue

          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tsExe)) {
            Write-Error "❌ Tailscale installation failed"
            exit 1
          }

          Write-Host "✅ Tailscale installed successfully"
          
      - name: 🌐 Connect Tailscale
        shell: pwsh
        run: |
          Write-Host "Checking Tailscale auth key..."

          if ([string]::IsNullOrWhiteSpace("${{ secrets.TAILSCALE_AUTH_KEY }}")) {
            Write-Error "❌ Secret TAILSCALE_AUTH_KEY belum diset di GitHub Repository Secrets"
            exit 1
          }

          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tsExe)) {
            Write-Error "❌ tailscale.exe not found"
            exit 1
          }

          Write-Host "Connecting to Tailscale..."

          & $tsExe up `
            --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" `
            --hostname="rdp-runner-${{ github.run_id }}" `
            --unattended `
            --accept-routes

          $tsIP = $null
          $retry = 0

          while (-not $tsIP -and $retry -lt 20) {
            Start-Sleep -Seconds 5
            $tsIP = (& $tsExe ip -4 2>$null).Trim()
            $retry++
            Write-Host "Waiting for Tailscale IP... attempt $retry"
          }

          if (-not $tsIP) {
            Write-Error "❌ Tailscale IP not assigned"
            exit 1
          }

          "TAILSCALE_IP=$tsIP" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

          Write-Host "✅ Tailscale connected"
          Write-Host "Tailscale IP: $tsIP"

      - name: ✅ Verify RDP Port
        shell: pwsh
        run: |
          Write-Host "Verifying RDP port..."

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {
            Write-Error "❌ RDP port 3389 unreachable"
            exit 1
          }

          Write-Host "✅ RDP port verified"

      - name: 📊 Generate Dashboard Summary
        shell: pwsh
        run: |
          $summary = @"
          ## 🚀 Windows RDP Session Ready

          | Parameter | Value |
          |-----------|-------|
          | 🖥️ OS | `${{ inputs.windows_version }}` |
          | 🌐 Tailscale IP | `$env:TAILSCALE_IP` |
          | 👤 Username | `$env:RDP_USER` |
          | 🔑 Password | `$env:RDP_PASSWORD` |
          | ⏱️ Duration | `${{ inputs.duration_hours }} Hour(s)` |
          | 📦 Apps | Chrome, Antigravity IDE, WinRAR, Codex GUI, 9Router |
          | 🧩 Chrome Extensions | Cookie-Editor, GoFullPage |

          ---

          ### Cara Login

          1. Buka Microsoft Remote Desktop.
          2. Masukkan Tailscale IP.
          3. Username: `RDP`
          4. Password: lihat tabel di atas.
          5. Pastikan perangkat Anda sudah login ke Tailscale yang sama.

          "@

          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: ⏳ Show Access Info & Keep Alive
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "╔══════════════════════════════════════╗"
          Write-Host "║          WINDOWS RDP READY           ║"
          Write-Host "╠══════════════════════════════════════╣"
          Write-Host "║  Host     : $env:TAILSCALE_IP"
          Write-Host "║  Username : $env:RDP_USER"
          Write-Host "║  Password : $env:RDP_PASSWORD"
          Write-Host "╚══════════════════════════════════════╝"
          Write-Host ""

          $hours = [int]'${{ inputs.duration_hours }}'
          $seconds = $hours * 3600
          $elapsed = 0

          while ($elapsed -lt $seconds) {
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] ✅ Session active — elapsed $elapsed seconds"
            Start-Sleep -Seconds 300
            $elapsed += 300
          }

          Write-Host "Session completed."
