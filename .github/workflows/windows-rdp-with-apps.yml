      - name: 🐾 Install Tailscale
        shell: pwsh
        run: |
          Write-Host "Detecting Windows runner architecture..."

          $tailscaleVersion = "1.98.2"
          $runnerArch = $env:RUNNER_ARCH

          if ([string]::IsNullOrWhiteSpace($runnerArch)) {
            $runnerArch = $env:PROCESSOR_ARCHITECTURE
          }

          Write-Host "Runner architecture: $runnerArch"

          switch -Regex ($runnerArch) {
            "ARM64" {
              $tsArch = "arm64"
            }
            "X64|AMD64" {
              $tsArch = "amd64"
            }
            "X86" {
              $tsArch = "x86"
            }
            default {
              Write-Error "Unsupported architecture: $runnerArch"
              exit 1
            }
          }

          $tsUrl  = "https://pkgs.tailscale.com/stable/tailscale-setup-$tailscaleVersion-$tsArch.msi"
          $tsPath = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale:"
          Write-Host $tsUrl

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $tsPath `
            -UseBasicParsing

          if (-not (Test-Path $tsPath)) {
            Write-Error "Tailscale installer download failed"
            exit 1
          }

          Write-Host "Installing Tailscale silently..."

          Start-Process msiexec.exe `
            -ArgumentList "/i", "`"$tsPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $tsPath -Force -ErrorAction SilentlyContinue

          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tsExe)) {
            Write-Error "❌ Tailscale installation failed"
            exit 1
          }

          Write-Host "✅ Tailscale installed successfully"

      - name: 🌐 Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          TAILSCALE_HOSTNAME_INPUT: ${{ inputs.tailscale_hostname }}
        run: |
          Write-Host "Checking Tailscale auth key..."

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            Write-Error "❌ Secret TAILSCALE_AUTH_KEY belum diset di GitHub Repository Secrets"
            exit 1
          }

          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tsExe)) {
            Write-Error "❌ tailscale.exe not found"
            exit 1
          }

          $hostnameBase = [string]$env:TAILSCALE_HOSTNAME_INPUT
          $hostnameMode = '${{ inputs.hostname_mode }}'

          if ([string]::IsNullOrWhiteSpace($hostnameBase)) {
            $hostnameBase = "rdp-runner"
          }

          # Tailscale/MagicDNS hostname-safe format: lowercase, letters, numbers, and hyphens.
          $hostnameBase = $hostnameBase.ToLowerInvariant() -replace '[^a-z0-9-]', '-'
          $hostnameBase = $hostnameBase.Trim('-')

          if ([string]::IsNullOrWhiteSpace($hostnameBase)) {
            $hostnameBase = "rdp-runner"
          }

          if ($hostnameMode -eq "same_each_run") {
            $tsHostname = $hostnameBase
          } else {
            $suffix = "-${{ github.run_id }}"
            $maxBaseLength = 63 - $suffix.Length

            if ($hostnameBase.Length -gt $maxBaseLength) {
              $hostnameBase = $hostnameBase.Substring(0, $maxBaseLength).Trim('-')
            }

            $tsHostname = "$hostnameBase$suffix"
          }

          if ($tsHostname.Length -gt 63) {
            $tsHostname = $tsHostname.Substring(0, 63).Trim('-')
          }

          Write-Host "Connecting to Tailscale..."
          Write-Host "Hostname mode      : $hostnameMode"
          Write-Host "Tailscale hostname : $tsHostname"

          & $tsExe up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="$tsHostname" `
            --unattended `
            --accept-routes

          if ($LASTEXITCODE -ne 0) {
            Write-Error "❌ Tailscale connection failed"
            exit 1
          }

          $tsIP = $null
          $retry = 0

          while (-not $tsIP -and $retry -lt 20) {
            Start-Sleep -Seconds 5
            $tsIP = [string](& $tsExe ip -4 2>$null)
            $tsIP = $tsIP.Trim()
            $retry++
            Write-Host "Waiting for Tailscale IP... attempt $retry"
          }

          if (-not $tsIP) {
            Write-Error "❌ Tailscale IP not assigned"
            exit 1
          }

          "TAILSCALE_IP=$tsIP" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "TAILSCALE_HOSTNAME=$tsHostname" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "TAILSCALE_HOSTNAME_MODE=$hostnameMode" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

          Write-Host "✅ Tailscale connected"
          Write-Host "Tailscale Hostname: $tsHostname"
          Write-Host "Tailscale IP: $tsIP"

      - name: ✅ Verify RDP Port
        shell: pwsh
        run: |
          Write-Host "Verifying RDP port..."

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {
            Write-Error "❌ RDP port 3389 unreachable"
            exit 1
          }

          Write-Host "✅ RDP port verified"

      - name: 📊 Generate Dashboard Summary
        shell: pwsh
        run: |
          $ideChoice = '${{ inputs.ide_choice }}'
          $editorChoice = '${{ inputs.editor_choice }}'
          $metatraderChoice = '${{ inputs.metatrader_choice }}'
          $routerChoice = '${{ inputs.router_choice }}'
          $codingAgentChoice = '${{ inputs.coding_agent_choice }}'
          $aiAgentChoice = '${{ inputs.ai_agent_choice }}'
          $installArtCraft = '${{ inputs.install_artcraft }}' -eq 'true'
          $hostnameMode = '${{ inputs.hostname_mode }}'
          $passwordMode = '${{ inputs.rdp_password_mode }}'
          $durationHours = '${{ inputs.duration_hours }}'
          $windowsVersion = '${{ inputs.windows_version }}'

          function Test-AnyPath {
            param([string[]] $Paths)

            foreach ($path in $Paths) {
              if ([string]::IsNullOrWhiteSpace($path)) { continue }

              $expanded = [Environment]::ExpandEnvironmentVariables($path)
              if (Test-Path $expanded) {
                return $true
              }
            }

            return $false
          }

          function Test-CommandExists {
            param([string] $Name)

            $cmd = Get-Command $Name -ErrorAction SilentlyContinue
            return [bool]$cmd
          }

          function Get-InstallStatus {
            param(
              [bool] $Requested,
              [bool] $Detected
            )

            if (-not $Requested) {
              return "⏭️ Skipped"
            }

            if ($Detected) {
              return "✅ Ready"
            }

            return "⚠️ Check logs"
          }

          function Add-Row {
            param(
              [System.Collections.Generic.List[string]] $Rows,
              [string] $Col1,
              [string] $Col2,
              [string] $Col3 = ""
            )

            $Rows.Add("| $Col1 | $Col2 | $Col3 |") | Out-Null
          }

          if ($passwordMode -eq "same_from_secret") {
            $passwordDisplay = "Use GitHub Secret ``RDP_PASSWORD``"
          } else {
            $passwordDisplay = "``$env:RDP_PASSWORD``"
          }

          $wantedVSCode = $ideChoice -in @("vscode", "both")
          $wantedAntigravity = $ideChoice -in @("antigravity", "both")
          $wantedCapCut = $editorChoice -in @("capcut", "both")
          $wantedShotcut = $editorChoice -in @("shotcut", "both")
          $wantedMT4 = $metatraderChoice -in @("mt4", "both")
          $wantedMT5 = $metatraderChoice -in @("mt5", "both")
          $wanted9Router = $routerChoice -in @("9router", "both")
          $wantedOmniRoute = $routerChoice -in @("omniroute", "both")
          $wantedCodex = $codingAgentChoice -in @("codex", "both")
          $wantedClaude = $codingAgentChoice -in @("claude", "both")
          $wantedHermes = $aiAgentChoice -in @("hermes", "both", "all")
          $wantedOpenClaw = $aiAgentChoice -in @("openclaw", "both", "all")
          $wantedOpenCode = $aiAgentChoice -in @("opencode", "all")

          $chromeDetected = Test-AnyPath @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
          )

          $winrarDetected = Test-AnyPath @(
            "$env:ProgramFiles\WinRAR\WinRAR.exe",
            "${env:ProgramFiles(x86)}\WinRAR\WinRAR.exe"
          )

          $nodeDetected = Test-AnyPath @(
            "$env:ProgramFiles\nodejs\node.exe",
            "${env:ProgramFiles(x86)}\nodejs\node.exe"
          )

          $vscodeDetected = Test-AnyPath @(
            "$env:ProgramFiles\Microsoft VS Code\Code.exe",
            "${env:ProgramFiles(x86)}\Microsoft VS Code\Code.exe",
            "$env:LOCALAPPDATA\Programs\Microsoft VS Code\Code.exe"
          )

          $antigravityDetected = Test-AnyPath @(
            "$env:LOCALAPPDATA\Programs\Antigravity IDE\Antigravity IDE.exe",
            "$env:LOCALAPPDATA\Antigravity IDE\Antigravity IDE.exe",
            "C:\Users\runneradmin\AppData\Local\Programs\Antigravity IDE\Antigravity IDE.exe",
            "$env:ProgramFiles\Antigravity IDE\Antigravity IDE.exe",
            "${env:ProgramFiles(x86)}\Antigravity IDE\Antigravity IDE.exe",
            "$env:ProgramData\RDP-Setup\Antigravity IDE\Antigravity IDE.exe"
          )

          $capCutDetected = Test-AnyPath @(
            "$env:ProgramFiles\CapCut\CapCut.exe",
            "${env:ProgramFiles(x86)}\CapCut\CapCut.exe",
            "$env:LOCALAPPDATA\CapCut\CapCut.exe",
            "$env:LOCALAPPDATA\Programs\CapCut\CapCut.exe"
          )

          $shotcutDetected = Test-AnyPath @(
            "$env:ProgramFiles\Shotcut\shotcut.exe",
            "${env:ProgramFiles(x86)}\Shotcut\shotcut.exe",
            "$env:LOCALAPPDATA\Programs\Shotcut\shotcut.exe"
          )

          $mt4Detected = Test-AnyPath @(
            "$env:ProgramFiles\MetaTrader 4\terminal.exe",
            "${env:ProgramFiles(x86)}\MetaTrader 4\terminal.exe"
          )

          $mt5Detected = Test-AnyPath @(
            "$env:ProgramFiles\MetaTrader 5\terminal64.exe",
            "$env:ProgramFiles\MetaTrader 5\terminal.exe",
            "${env:ProgramFiles(x86)}\MetaTrader 5\terminal.exe"
          )

          $codexDetected = (Test-CommandExists "codex") -or (Test-AnyPath @(
            "$env:APPDATA\npm\codex.cmd",
            "$env:ProgramFiles\nodejs\codex.cmd",
            "${env:ProgramFiles(x86)}\nodejs\codex.cmd"
          ))

          $claudeDetected = (Test-CommandExists "claude") -or (Test-AnyPath @(
            "$env:USERPROFILE\.local\bin\claude.exe",
            "$env:USERPROFILE\.local\bin\claude.cmd",
            "$env:APPDATA\npm\claude.cmd"
          ))

          $nineRouterDetected = (Test-CommandExists "9router") -or (Test-AnyPath @(
            "$env:APPDATA\npm\9router.cmd",
            "$env:ProgramFiles\nodejs\9router.cmd",
            "${env:ProgramFiles(x86)}\nodejs\9router.cmd"
          ))

          $omniRouteDetected = (Test-CommandExists "omniroute") -or (Test-AnyPath @(
            "$env:APPDATA\npm\omniroute.cmd",
            "$env:ProgramFiles\nodejs\omniroute.cmd",
            "${env:ProgramFiles(x86)}\nodejs\omniroute.cmd"
          ))

          $hermesDetected = (Test-CommandExists "hermes") -or (Test-AnyPath @(
            "$env:LOCALAPPDATA\hermes\bin\hermes.exe",
            "$env:LOCALAPPDATA\hermes\bin\hermes.cmd"
          ))

          $openclawDetected = (Test-CommandExists "openclaw") -or (Test-AnyPath @(
            "$env:APPDATA\npm\openclaw.cmd",
            "$env:ProgramFiles\nodejs\openclaw.cmd",
            "${env:ProgramFiles(x86)}\nodejs\openclaw.cmd"
          ))

          $openCodeDetected = (Test-CommandExists "opencode") -or (Test-AnyPath @(
            "$env:APPDATA\npm\opencode.cmd",
            "$env:ProgramFiles\nodejs\opencode.cmd",
            "${env:ProgramFiles(x86)}\nodejs\opencode.cmd"
          ))

          $artCraftDetected = (Test-AnyPath @(
            "$env:SystemDrive\Users\$env:RDP_USER\AppData\Local\Programs\ArtCraft Launcher\artcraft-launcher.exe",
            $env:ARTCRAFT_EXE
          ))

          $chromeDefaultPolicy = $false
          try {
            $policy = Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System' -Name 'DefaultAssociationsConfiguration' -ErrorAction Stop
            $chromeDefaultPolicy = [bool]$policy.DefaultAssociationsConfiguration
          } catch {
            $chromeDefaultPolicy = $false
          }

          $appRows = [System.Collections.Generic.List[string]]::new()
          $appRows.Add("| Application | Status | Notes |") | Out-Null
          $appRows.Add("|---|---:|---|") | Out-Null

          Add-Row $appRows "Google Chrome" (Get-InstallStatus $true $chromeDetected) "Installed; default association policy: $chromeDefaultPolicy"
          Add-Row $appRows "WinRAR" (Get-InstallStatus $true $winrarDetected) "Archive manager"
          Add-Row $appRows "Node.js LTS" (Get-InstallStatus $true $nodeDetected) "Runtime for npm-based apps"
          Add-Row $appRows "Visual Studio Code" (Get-InstallStatus $wantedVSCode $vscodeDetected) "Optional IDE"
          Add-Row $appRows "Antigravity IDE" (Get-InstallStatus $wantedAntigravity $antigravityDetected) "Optional IDE; prepared for RDP user"
          Add-Row $appRows "CapCut" (Get-InstallStatus $wantedCapCut $capCutDetected) "Optional video editor"
          Add-Row $appRows "Shotcut" (Get-InstallStatus $wantedShotcut $shotcutDetected) "Optional video editor"
          Add-Row $appRows "MetaTrader 4" (Get-InstallStatus $wantedMT4 $mt4Detected) "Optional trading terminal"
          Add-Row $appRows "MetaTrader 5" (Get-InstallStatus $wantedMT5 $mt5Detected) "Optional trading terminal"
          Add-Row $appRows "Codex CLI" (Get-InstallStatus $wantedCodex $codexDetected) "npm package ``@openai/codex``"
          Add-Row $appRows "Claude Code" (Get-InstallStatus $wantedClaude $claudeDetected) "Official PowerShell installer"
          Add-Row $appRows "9Router CLI" (Get-InstallStatus $wanted9Router $nineRouterDetected) "npm package ``9router``"
          Add-Row $appRows "OmniRoute CLI" (Get-InstallStatus $wantedOmniRoute $omniRouteDetected) "npm package ``omniroute``"
          Add-Row $appRows "Hermes Agent" (Get-InstallStatus $wantedHermes $hermesDetected) "Official non-interactive installer"
          Add-Row $appRows "OpenClaw" (Get-InstallStatus $wantedOpenClaw $openclawDetected) "Official installer; onboarding skipped"
          Add-Row $appRows "OpenCode" (Get-InstallStatus $wantedOpenCode $openCodeDetected) "npm package ``opencode-ai``"
          Add-Row $appRows "ArtCraft Launcher" (Get-InstallStatus $installArtCraft $artCraftDetected) "Official v0.3.2 MSI; choose suite apps inside launcher"

          $extensionRows = [System.Collections.Generic.List[string]]::new()
          $extensionRows.Add("| Target | Extension / Feature | Status |") | Out-Null
          $extensionRows.Add("|---|---|---:|") | Out-Null

          if ($wantedVSCode) {
            Add-Row $extensionRows "VS Code" "OpenAI / Codex extension ``OpenAI.chatgpt``" "✅ Configured"
            Add-Row $extensionRows "VS Code" "Office Viewer ``cweijan.vscode-office``" "✅ Configured"
          } else {
            Add-Row $extensionRows "VS Code" "OpenAI + Office Viewer extensions" "⏭️ Skipped"
          }

          if ($wantedAntigravity) {
            Add-Row $extensionRows "Antigravity" "OpenAI + Office Viewer extensions" "✅ Best effort"
          } else {
            Add-Row $extensionRows "Antigravity" "OpenAI + Office Viewer extensions" "⏭️ Skipped"
          }

          Add-Row $extensionRows "Chrome" "Cookie-Editor + GoFullPage" "Policy configured"
          $chromePolicyStatus = if ($chromeDefaultPolicy) { "Policy configured" } else { "Check logs" }
          Add-Row $extensionRows "Windows" "Chrome default browser associations" $chromePolicyStatus

          $summaryLines = [System.Collections.Generic.List[string]]::new()

          $summaryLines.Add("# 🪟 Windows RDP Dashboard") | Out-Null
          $summaryLines.Add("") | Out-Null
          $summaryLines.Add("> ✅ Runner siap digunakan. Gunakan hostname sebagai alamat utama, lalu pakai IP Tailscale sebagai fallback jika MagicDNS belum resolve.") | Out-Null
          $summaryLines.Add("") | Out-Null

          $summaryLines.Add("## 🎯 Recommended Login") | Out-Null
          $summaryLines.Add("") | Out-Null
          $summaryLines.Add("| Use this | Value |") | Out-Null
          $summaryLines.Add("|---|---|") | Out-Null
          $summaryLines.Add("| Primary address | ``$env:TAILSCALE_HOSTNAME`` |") | Out-Null
          $summaryLines.Add("| Fallback address | ``$env:TAILSCALE_IP`` |") | Out-Null
          $summaryLines.Add("| Username | ``$env:RDP_USER`` |") | Out-Null
          $summaryLines.Add("| Password | $passwordDisplay |") | Out-Null
          $summaryLines.Add("") | Out-Null

          $summaryLines.Add("## 🔗 Connection Details") | Out-Null
          $summaryLines.Add("") | Out-Null
          $summaryLines.Add("| Item | Value |") | Out-Null
          $summaryLines.Add("|---|---|") | Out-Null
          $summaryLines.Add("| OS / Runner | ``$windowsVersion`` |") | Out-Null
          $summaryLines.Add("| Tailscale Hostname | ``$env:TAILSCALE_HOSTNAME`` |") | Out-Null
          $summaryLines.Add("| Tailscale IP | ``$env:TAILSCALE_IP`` |") | Out-Null
          $summaryLines.Add("| Hostname Mode | ``$hostnameMode`` |") | Out-Null
          $summaryLines.Add("| Password Mode | ``$passwordMode`` |") | Out-Null
