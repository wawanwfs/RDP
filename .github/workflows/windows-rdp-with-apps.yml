# 🎯 Log markers: 🚀 start | ⏭️ SKIP | 📥 download | ⚙️ install
# ✅ success | ⚠️ warning | ❌ error | ⏱️ TIME | 🛡️ admin | 🎨 ArtCraft Launcher
# Text labels remain searchable; machine-readable paths, IDs and secrets are unchanged.
name: "🖥️ Windows RDP with Apps"
run-name: "🚀 Windows RDP with Apps"

"on":
  workflow_dispatch:
    inputs:
      windows_version:
        description: "Pilih Versi Windows (OS)"
        required: true
        default: "windows-2025"
        type: choice
        options:
          # Recommended stable Windows x64 runners
          - "windows-latest"
          - "windows-2025"
          - "windows-2022"

          # Windows ARM64 runner
          - "windows-11-arm"

          # Public repository only / Visual Studio 2026 image
          # Jika repo private gagal, gunakan windows-2025 atau windows-2022
          - "windows-2025-vs2026"

      duration_hours:
        description: "Durasi RDP Aktif (Jam)"
        required: true
        default: "6"
        type: choice
        options:
          - "1"
          - "3"
          - "6"

      ide_choice:
        description: "Pilih IDE yang akan diinstall"
        required: true
        default: "none"
        type: choice
        options:
          - "none"
          - "antigravity"
          - "vscode"
          - "both"

      editor_choice:
        description: "Pilih video editor"
        required: true
        default: "none"
        type: choice
        options:
          - "none"
          - "capcut"
          - "shotcut"
          - "both"

      metatrader_choice:
        description: "Pilih MetaTrader"
        required: true
        default: "none"
        type: choice
        options:
          - "none"
          - "mt4"
          - "mt5"
          - "both"

      router_choice:
        description: "Pilih AI API Router"
        required: true
        default: "none"
        type: choice
        options:
          - "none"
          - "9router"
          - "omniroute"
          - "both"

      coding_agent_choice:
        description: "Pilih coding agent"
        required: true
        default: "none"
        type: choice
        options:
          - "none"
          - "codex"
          - "claude"
          - "both"

      ai_agent_choice:
        description: "Pilih AI agent (Hermes, OpenClaw, atau OpenCode)"
        required: true
        default: "none"
        type: choice
        options:
          - "none"
          - "hermes"
          - "openclaw"
          - "opencode"
          - "both"
          - "all"

      install_artcraft:
        description: "Install ArtCraft Launcher v0.3.2 (pilih aplikasi suite setelah login RDP)"
        required: true
        default: true
        type: boolean

      tailscale_hostname:
        description: "Nama dasar hostname Tailscale/RDP"
        required: true
        default: "rdp-runner"
        type: string

      hostname_mode:
        description: "Mode hostname: sama setiap running atau unik per running"
        required: true
        default: "same_each_run"
        type: choice
        options:
          - "unique_each_run"
          - "same_each_run"

      rdp_password_mode:
        description: "Mode password RDP: random setiap running atau sama dari secrets.RDP_PASSWORD"
        required: true
        default: "same_from_secret"
        type: choice
        options:
          - "random_each_run"
          - "same_from_secret"

jobs:
  secure-rdp:
    name: 🖥️ Windows Remote Desktop
    runs-on: ${{ inputs.windows_version }}
    timeout-minutes: 360

    env:
      RDP_USER: RDP

    steps:
      - name: ⚡ Optimize Windows Performance
        shell: pwsh
        run: |
          Write-Host "==========================================="
          Write-Host " Optimizing Windows for RDP Performance"
          Write-Host "==========================================="

          # Visual & animation tweaks
          $regPath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects"
          Set-ItemProperty -Path $regPath -Name "VisualFXSetting" -Value 2 -Force -ErrorAction SilentlyContinue

          $perf = "HKCU:\Control Panel\Desktop"
          Set-ItemProperty -Path $perf -Name "MenuShowDelay" -Value "0" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $perf -Name "DragFullWindows" -Value "0" -Force -ErrorAction SilentlyContinue

          # High performance power plan
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          powercfg -hibernate off

          # Disable unnecessary services
          $services = @(
            "SysMain",
            "WSearch",
            "DiagTrack",
            "dmwappushservice",
            "MapsBroker",
            "XblGameSave",
            "XboxNetApiSvc",
            "RetailDemo",
            "TabletInputService"
          )

          foreach ($svc in $services) {
            Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
            Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
          }

          # Enable audio service
          Set-Service -Name "Audiosrv" -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name "Audiosrv" -ErrorAction SilentlyContinue

          # Keep Microsoft Defender real-time protection enabled.
          # Network tweaks
          netsh int tcp set global autotuninglevel=normal
          netsh int tcp set global chimney=disabled
          netsh int tcp set supplemental internet congestionprovider=ctcp

          Write-Host "✅ Windows optimization completed"

      - name: 🔐 Configure RDP
        shell: pwsh
        run: |
          Write-Host "Configuring Remote Desktop..."

          # Enable RDP
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          # Keep Network Level Authentication (NLA) and TLS enabled.
          # RDP access is restricted to Tailscale IPv4 clients by the firewall rule below.
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 2 `
            -Force

          # 32-bit color depth
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "ColorDepth" `
            -Value 4 `
            -Force `
            -ErrorAction SilentlyContinue

          # Disable broad built-in RDP rules and allow RDP only from Tailscale IPv4 space.
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue |
            Disable-NetFirewallRule -ErrorAction SilentlyContinue

          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389 `
            remoteip=100.64.0.0/10 `
            profile=any

          if ($LASTEXITCODE -ne 0) {
            throw "❌ Failed to create the Tailscale-only RDP firewall rule."
          }

          Restart-Service -Name TermService -Force

          Write-Host "✅ RDP configured"

      - name: 👤 Create RDP User
        shell: pwsh
        env:
          RDP_PASSWORD_SECRET: ${{ secrets.RDP_PASSWORD }}
        run: |
          $passwordMode = '${{ inputs.rdp_password_mode }}'

          Write-Host "🔐 Preparing RDP password..."
          Write-Host "🔐 Password mode: $passwordMode"

          if ($passwordMode -eq "same_from_secret") {
            if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD_SECRET)) {
              Write-Error "❌ rdp_password_mode=same_from_secret dipilih, tapi GitHub Secret RDP_PASSWORD belum diset. Tambahkan di Settings > Secrets and variables > Actions > Repository secrets."
              exit 1
            }

            $password = $env:RDP_PASSWORD_SECRET
            Write-Host "::add-mask::$password"
            Write-Host "🔐 Using fixed password from GitHub Secret: RDP_PASSWORD"
          } else {
            # Password generator that works on GitHub Actions Windows runner
            $upper   = [char[]](65..90)   | Get-Random -Count 4
            $lower   = [char[]](97..122)  | Get-Random -Count 4
            $number  = [char[]](48..57)   | Get-Random -Count 4
            $special = [char[]]@(33,64,35,36,42,43,45,61) | Get-Random -Count 4

            $password = -join ($upper + $lower + $number + $special | Sort-Object { Get-Random })
          }

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          # Remove old user if exists
          if (Get-LocalUser -Name $env:RDP_USER -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name $env:RDP_USER
          }

          New-LocalUser `
            -Name $env:RDP_USER `
            -Password $securePass `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -UserMayNotChangePassword

          # 🛡️ Administrator access is mandatory. Resolve built-in groups by SID,
          # so this also works on non-English Windows images. Keep UAC enabled.
          $rdpAccount = Get-LocalUser -Name $env:RDP_USER -ErrorAction Stop
          foreach ($groupSid in @('S-1-5-32-544', 'S-1-5-32-555')) {
            $group = Get-LocalGroup -SID $groupSid -ErrorAction Stop
            $members = @(Get-LocalGroupMember -Group $group -ErrorAction Stop)
            if (-not ($members | Where-Object { $_.SID.Value -eq $rdpAccount.SID.Value })) {
              Add-LocalGroupMember -Group $group -Member $rdpAccount -ErrorAction Stop
            }
            $verified = Get-LocalGroupMember -Group $group -ErrorAction Stop |
              Where-Object { $_.SID.Value -eq $rdpAccount.SID.Value }
            if (-not $verified) { throw "❌ Required group membership could not be verified: $groupSid" }
            Write-Host "🛡️ ✅ Verified $env:RDP_USER membership: $($group.Name) [$groupSid]"
          }
          Write-Host '🛡️ RDP account has verified local Administrator access (UAC unchanged).'

          "RDP_PASSWORD=$password" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "RDP_PASSWORD_MODE=$passwordMode" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

          Write-Host "✅ User RDP created"
          Write-Host "Username: $env:RDP_USER"

          if ($passwordMode -eq "same_from_secret") {
            Write-Host "Password: using GitHub Secret RDP_PASSWORD"
          } else {
            Write-Host "Password: $password"
          }

      # Reuse installed apps; parallelize independent groups, not competing installers.
      - name: 🧰 Prepare App Installation Helpers
        shell: pwsh
        run: |
          function Test-RdpPackageInstalled {
            param([string] $Id)
            # Fast exact locations first; no recursive scan of the whole disk.
            $paths = switch ($Id) {
              'Google.Chrome' { @("$env:ProgramFiles\Google\Chrome\Application\chrome.exe", "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe", "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe") }
              'RARLab.WinRAR' { @("$env:ProgramFiles\WinRAR\WinRAR.exe", "${env:ProgramFiles(x86)}\WinRAR\WinRAR.exe") }
              'OpenJS.NodeJS.LTS' { @("$env:ProgramFiles\nodejs\node.exe", "${env:ProgramFiles(x86)}\nodejs\node.exe") }
              'Microsoft.VisualStudioCode' { @("$env:ProgramFiles\Microsoft VS Code\Code.exe", "${env:ProgramFiles(x86)}\Microsoft VS Code\Code.exe", "$env:LOCALAPPDATA\Programs\Microsoft VS Code\Code.exe") }
              'Google.AntigravityIDE' { @("$env:LOCALAPPDATA\Programs\Antigravity IDE\Antigravity IDE.exe", "$env:ProgramFiles\Antigravity IDE\Antigravity IDE.exe") }
              '7zip.7zip' { @("$env:ProgramFiles\7-Zip\7z.exe", "${env:ProgramFiles(x86)}\7-Zip\7z.exe") }
              default { @() }
            }
            foreach ($path in $paths) {
              if (Test-Path -LiteralPath $path -PathType Leaf) { return $true }
            }
            if ($Id -eq 'OpenJS.NodeJS.LTS') {
              return [bool](Get-Command node.exe -ErrorAction SilentlyContinue)
            }
            # Installed-program registry is much cheaper than winget list/source refresh.
            $pattern = switch ($Id) {
              'Google.Chrome' { '^Google Chrome$' }
              'RARLab.WinRAR' { '^WinRAR(?:\s|$)' }
              'Microsoft.VisualStudioCode' { '^Microsoft Visual Studio Code(?:\s|$)' }
              'Google.AntigravityIDE' { '^Antigravity IDE(?:\s|$)' }
              'ByteDance.CapCut' { '^CapCut(?:\s|$)' }
              'Meltytech.Shotcut' { '^Shotcut(?:\s|$)' }
              '7zip.7zip' { '^7-Zip(?:\s|$)' }
              default { $null }
            }
            if ($pattern) {
              foreach ($key in @('HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*')) {
                $match = Get-ItemProperty -Path $key -ErrorAction SilentlyContinue |
                  Where-Object { $_.DisplayName -match $pattern } | Select-Object -First 1
                if ($match) { return $true }
              }
            }
            return $false
          }

          function Invoke-BoundedInstaller {
            param([string] $FilePath, [string[]] $Arguments, [int] $TimeoutSeconds = 300, [pscredential] $Credential = $null)
            $logBase = Join-Path $env:TEMP ("rdp-installer-" + [guid]::NewGuid().ToString('N'))
            $identity = @{}
            if ($Credential) { $identity = @{ Credential = $Credential; LoadUserProfile = $true; WorkingDirectory = $env:SystemRoot } }
            $process = Start-Process -FilePath $FilePath -ArgumentList $Arguments -PassThru -NoNewWindow `
              -RedirectStandardOutput "$logBase.out" -RedirectStandardError "$logBase.err" @identity
            try {
              if (-not $process.WaitForExit($TimeoutSeconds * 1000)) {
                & taskkill.exe /PID $process.Id /T /F 2>&1 | Out-Host
                throw "❌ Installer exceeded $TimeoutSeconds seconds; process tree terminated."
              }
              $process.WaitForExit()
              return [int]$process.ExitCode
            } finally {
              foreach ($file in @("$logBase.out", "$logBase.err")) {
                if (Test-Path -LiteralPath $file) {
                  Get-Content -LiteralPath $file -Tail 60 | Out-Host
                  Remove-Item -LiteralPath $file -Force -ErrorAction SilentlyContinue
                }
              }
              $process.Dispose()
            }
          }

          function Install-WingetPackage {
            param(
              [Parameter(Mandatory = $true)] [string] $Id,
              [Parameter(Mandatory = $true)] [string] $Name,
              [string[]] $FallbackIds = @(),
              [scriptblock] $FallbackInstaller = $null,
              [string] $Scope = '',
              [switch] $Optional
            )
            $clock = [Diagnostics.Stopwatch]::StartNew()
            # One machine-wide queue also protects the optional ArtCraft worker.
            $mutex = [Threading.Mutex]::new($false, 'Global\RdpWorkflowWingetInstall')
            $locked = $false
            try {
              if (Test-RdpPackageInstalled $Id) {
                Write-Host "⏭️ SKIP $Name : already installed (no download/update)."
                return $true
              }
              try { $locked = $mutex.WaitOne(600000) }
              catch [Threading.AbandonedMutexException] { $locked = $true }
              if (-not $locked) { throw "❌ Timed out waiting for installer lock: $Name" }
              if (Test-RdpPackageInstalled $Id) { return $true }
              if (-not $winget -or -not (Test-Path -LiteralPath $winget)) {
                throw "❌ winget.exe unavailable; cannot install missing application $Name."
              }
              foreach ($packageId in (@($Id) + $FallbackIds)) {
                $installArgs = @('install', '--id', $packageId, '--exact', '--source', 'winget', '--silent', '--accept-package-agreements', '--accept-source-agreements', '--disable-interactivity')
                if ($Scope) { $installArgs += @('--scope', $Scope) }
                # One attempt only; use a known alternative instead of repeating a slow failure.
                $code = Invoke-BoundedInstaller -FilePath $winget -Arguments $installArgs
                if ($code -in @(0, 3010, 1641) -or (Test-RdpPackageInstalled $Id)) {
                  Write-Host "✅ OK $Name installed/detected."
                  return $true
                }
                Write-Warning "⚠️ winget $packageId exited with $code."
              }
              # A failed winget command alone is NOT evidence that Chrome is missing.
              if ($FallbackInstaller -and -not (Test-RdpPackageInstalled $Id)) {
                Write-Host "🔄 Fallback needed: $Name is still missing."
                & $FallbackInstaller | Out-Host
                if (-not (Test-RdpPackageInstalled $Id)) { throw "❌ $Name not detected after fallback." }
                return $true
              }
              throw "❌ Unable to install missing application $Name."
            } catch {
              if ($Optional) { Write-Warning ("⚠️ " + $_.Exception.Message); return $false }
              throw
            } finally {
              if ($locked) { $mutex.ReleaseMutex() }
              $mutex.Dispose()
              Write-Host ("⏱️ TIME {0}: {1:N1}s" -f $Name, $clock.Elapsed.TotalSeconds)
            }
          }

          function Resolve-AppTarget {
            param(
              [string[]] $CandidatePaths = @(),
              [string[]] $SearchRoots = @(),
              [string[]] $ExecutableNames = @()
            )

            foreach ($candidate in $CandidatePaths) {
              if ([string]::IsNullOrWhiteSpace($candidate)) { continue }

              $expanded = [Environment]::ExpandEnvironmentVariables($candidate)
              if (Test-Path $expanded) {
                return (Resolve-Path $expanded).Path
              }
            }

            foreach ($root in $SearchRoots) {
              if ([string]::IsNullOrWhiteSpace($root)) { continue }

              $expandedRoot = [Environment]::ExpandEnvironmentVariables($root)
              if (-not (Test-Path $expandedRoot)) { continue }

              foreach ($exeName in $ExecutableNames) {
                $found = Get-ChildItem `
                  -Path $expandedRoot `
                  -Filter $exeName `
                  -File `
                  -Recurse -Depth 3 `
                  -ErrorAction SilentlyContinue |
                  Select-Object -First 1

                if ($found) {
                  return $found.FullName
                }
              }
            }

            return $null
          }

          function Refresh-InstallerPath {
            $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
            $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
            $currentPathEntries = @($env:Path -split ';' | Where-Object { $_ })
            $storedPathEntries = @($machinePath -split ';') + @($userPath -split ';')
            $missingPathEntries = @(
              $storedPathEntries |
                Where-Object { $_ -and $_ -notin $currentPathEntries }
            )

            if ($missingPathEntries.Count -gt 0) {
              $env:Path = (@($currentPathEntries + $missingPathEntries) | Select-Object -Unique) -join ';'
            }
          }

          function Invoke-OptionalInstall {
            param(
              [Parameter(Mandatory = $true)] [string] $Name,
              [Parameter(Mandatory = $true)] [scriptblock] $Action
            )

            try {
              $optionalClock = [Diagnostics.Stopwatch]::StartNew()
              Write-Host "⚙️ Starting optional installation: $Name"
              & $Action
              Write-Host "🏁 Finished optional installation attempt: $Name"
            } catch {
              Write-Warning "⚠️ Optional installation failed for ${Name}: $($_.Exception.Message)"
            } finally {
              Write-Host ("⏱️ TIME {0}: {1:N1}s" -f $Name, $optionalClock.Elapsed.TotalSeconds)
            }
          }

          function Install-NpmGlobalPackage {
            param(
              [Parameter(Mandatory = $true)] [string] $PackageName
            )

            $commandName = switch ($PackageName) {
              '9router' { '9router' }
              'omniroute' { 'omniroute' }
              '@openai/codex' { 'codex' }
              'opencode-ai' { 'opencode' }
              default { $null }
            }
            if ($commandName -and (Get-Command $commandName -ErrorAction SilentlyContinue)) {
              Write-Host "⏭️ SKIP $PackageName : command already available."
              return
            }
            if (-not $npm -or -not (Test-Path $npm)) {
              throw "❌ npm.cmd is not available; cannot install $PackageName."
            }

            & $npm install --global "$PackageName@latest"
            if ($LASTEXITCODE -ne 0) {
              throw "❌ npm install failed for $PackageName with exit code $LASTEXITCODE."
            }

            Refresh-InstallerPath
          }

          function Install-MetaTrader {
            param(
              [Parameter(Mandatory = $true)]
              [ValidateSet('mt4', 'mt5')]
              [string] $Version
            )

            $mutex = [Threading.Mutex]::new($false, 'Global\RdpWorkflowWingetInstall')
            $locked = $false
            try {
              try { $locked = $mutex.WaitOne(600000) }
              catch [Threading.AbandonedMutexException] { $locked = $true }
              if (-not $locked) { throw '❌ Timed out waiting for MetaTrader installer lock.' }
            $installerUrl = if ($Version -eq 'mt4') {
              'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt4/mt4setup.exe'
            } else {
              'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'
            }

            $installerPath = Join-Path $env:TEMP "metatrader-$Version-setup.exe"
            Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath -UseBasicParsing -TimeoutSec 120 -ErrorAction Stop

            if (-not (Test-Path $installerPath)) {
              throw "❌ MetaTrader $Version installer download did not create a file."
            }

            $signature = Get-AuthenticodeSignature -FilePath $installerPath
            if ($signature.Status -ne 'Valid') {
              throw "❌ MetaTrader $Version installer signature is not valid: $($signature.Status)."
            }

            $installerExit = Invoke-BoundedInstaller -FilePath $installerPath -Arguments @('/auto') -TimeoutSeconds 300
            Remove-Item -LiteralPath $installerPath -Force -ErrorAction SilentlyContinue

            if ($installerExit -ne 0) {
              throw "❌ MetaTrader $Version installer exited with code $($installerExit)."
            }

            Write-Host "📈 ✅ MetaTrader $Version installer completed."
            } finally {
              if ($locked) { $mutex.ReleaseMutex() }
              $mutex.Dispose()
            }
          }

          function Install-ArtCraft {
            # 🎨 Pinned official ArtCraft LAUNCHER, not the separate ArtCraft desktop app.
            $uri = 'https://github.com/storytold/craft-launcher/releases/download/v0.3.2/artcraft-launcher-0.3.2-windows-x64.msi'
            $sha256 = 'e1d147912aec78b40dfd2f3caf7e8a9fa887a285451cfc221f16a4f3a484065c'
            $rdpUser = Get-LocalUser -Name $env:RDP_USER -ErrorAction Stop
            $profileKey = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$($rdpUser.SID.Value)"
            $profile = (Get-ItemProperty -LiteralPath $profileKey -ErrorAction SilentlyContinue).ProfileImagePath
            if (-not $profile) { $profile = "$env:SystemDrive\Users\$env:RDP_USER" }
            $appExe = Join-Path $profile 'AppData\Local\Programs\ArtCraft Launcher\artcraft-launcher.exe'
            if (Test-Path -LiteralPath $appExe) {
              Write-Host "⏭️ SKIP ArtCraft Launcher : already installed for $env:RDP_USER"
              "ARTCRAFT_EXE=$appExe" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding UTF8
              return
            }
            # This MSI is per-user. Run it as the RDP user, not runneradmin, so registry,
            # profile, Start menu and launcher self-updates belong to the correct account.
            if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) { throw '❌ RDP password unavailable for per-user launcher setup.' }
            $setupDir = Join-Path $env:ProgramData 'RDP-Setup\ArtCraft-Launcher-Installer'
            New-Item -Path $setupDir -ItemType Directory -Force | Out-Null
            $sid = $rdpUser.SID.Value
            & icacls.exe $setupDir /grant "*${sid}:(OI)(CI)M" /Q | Out-Host
            if ($LASTEXITCODE -ne 0) { throw '❌ Cannot grant the RDP account access to launcher setup files.' }
            $installerPath = Join-Path $setupDir 'artcraft-launcher-0.3.2-windows-x64.msi'
            $msiLog = Join-Path $setupDir 'install.log'
            Write-Host '🎨 📥 Downloading ArtCraft Launcher v0.3.2 (Windows x64 MSI)...'
            try {
              Invoke-WebRequest -Uri $uri -OutFile $installerPath -UseBasicParsing -TimeoutSec 180 -ErrorAction Stop
              if ((Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash -ne $sha256) {
                throw '❌ ArtCraft Launcher MSI SHA256 mismatch; refusing to install.'
              }
              $mutex = [Threading.Mutex]::new($false, 'Global\RdpWorkflowWingetInstall')
              $locked = $false
              try {
                try { $locked = $mutex.WaitOne(600000) }
                catch [Threading.AbandonedMutexException] { $locked = $true }
                if (-not $locked) { throw '❌ Timed out waiting for launcher MSI installer lock.' }
                Start-Service -Name seclogon -ErrorAction Stop
                $securePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
                $credential = [pscredential]::new("$env:COMPUTERNAME\$env:RDP_USER", $securePassword)
                $msiArguments = @('/i', "`"$installerPath`"", '/qn', '/norestart', 'INSTALLDESKTOPSHORTCUT=1', '/L*v', "`"$msiLog`"")
                $code = Invoke-BoundedInstaller -FilePath "$env:SystemRoot\System32\msiexec.exe" `
                  -Arguments $msiArguments -TimeoutSeconds 300 -Credential $credential
                if ($code -notin @(0, 3010, 1641)) {
                  if (Test-Path $msiLog) { Get-Content $msiLog -Tail 35 | Out-Host }
                  throw "❌ ArtCraft Launcher MSI exited with code $code. Log: $msiLog"
                }
              } finally {
                if ($locked) { $mutex.ReleaseMutex() }
                $mutex.Dispose()
              }
              $profile = (Get-ItemProperty -LiteralPath $profileKey -ErrorAction Stop).ProfileImagePath
              $appExe = Join-Path $profile 'AppData\Local\Programs\ArtCraft Launcher\artcraft-launcher.exe'
              if (-not (Test-Path -LiteralPath $appExe)) { throw '❌ MSI finished but artcraft-launcher.exe was not found in the RDP profile.' }
              "ARTCRAFT_EXE=$appExe" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding UTF8
              Write-Host "🎨 ✅ OK ArtCraft Launcher installed for $env:RDP_USER : $appExe"
            } finally {
              Remove-Item -LiteralPath $installerPath -Force -ErrorAction SilentlyContinue
            }
          }

          function Install-OfficialPowerShellApp {
            param(
              [Parameter(Mandatory = $true)] [string] $Name,
              [Parameter(Mandatory = $true)] [string] $Uri,
              [ValidateSet('plain', 'hermes', 'openclaw')]
              [string] $Mode = 'plain'
            )

            $commandName = switch ($Name) {
              'Claude Code' { 'claude' }
              'Hermes Agent' { 'hermes' }
              'OpenClaw' { 'openclaw' }
              default { $null }
            }
            if ($commandName -and (Get-Command $commandName -ErrorAction SilentlyContinue)) {
              Write-Host "⏭️ SKIP $Name : command already available."
              return
            }
            $response = Invoke-WebRequest -Uri $Uri -UseBasicParsing -TimeoutSec 120 -ErrorAction Stop
            $scriptText = ([string]$response.Content).TrimStart([char]0xFEFF)

            if ([string]::IsNullOrWhiteSpace($scriptText)) {
              throw "❌ Installer download for $Name was empty."
            }

            $installerScript = [scriptblock]::Create($scriptText)

            switch ($Mode) {
              'hermes' { & $installerScript -NonInteractive -Branch 'main' }
              'openclaw' { & $installerScript -NoOnboard }
              default { & $installerScript }
            }

            Refresh-InstallerPath
          }

          function Set-ChromeDefaultAssociations {
            $setupDir = Join-Path $env:ProgramData 'RDP-Setup'
            New-Item -Path $setupDir -ItemType Directory -Force | Out-Null

            $associationPath = Join-Path $setupDir 'DefaultAppAssociations.xml'
            $associationXml = @'
          <?xml version="1.0" encoding="UTF-8"?>
          <DefaultAssociations>
            <Association Identifier="http" ProgId="ChromeHTML" ApplicationName="Google Chrome" />
            <Association Identifier="https" ProgId="ChromeHTML" ApplicationName="Google Chrome" />
            <Association Identifier=".htm" ProgId="ChromeHTML" ApplicationName="Google Chrome" />
            <Association Identifier=".html" ProgId="ChromeHTML" ApplicationName="Google Chrome" />
          </DefaultAssociations>
          '@

            Set-Content -LiteralPath $associationPath -Value $associationXml -Encoding UTF8

            $policyPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
            New-Item -Path $policyPath -Force | Out-Null
            New-ItemProperty `
              -Path $policyPath `
              -Name 'DefaultAssociationsConfiguration' `
              -Value $associationPath `
              -PropertyType String `
              -Force | Out-Null

            & dism.exe /Online "/Import-DefaultAppAssociations:$associationPath" | Out-Null
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "⚠️ DISM could not import Chrome default associations (exit code $LASTEXITCODE); policy was still configured for sign-in."
            } else {
              Write-Host '🌐 ✅ Chrome default associations imported for new user profiles.'
            }
          }

          function Resolve-VSCodeCli {
            $candidates = @(
              "$env:ProgramFiles\Microsoft VS Code\bin\code.cmd",
              "${env:ProgramFiles(x86)}\Microsoft VS Code\bin\code.cmd",
              "$env:LOCALAPPDATA\Programs\Microsoft VS Code\bin\code.cmd"
            )

            foreach ($candidate in $candidates) {
              if ($candidate -and (Test-Path $candidate)) {
                return (Resolve-Path $candidate).Path
              }
            }

            $cmd = (Get-Command code.cmd -ErrorAction SilentlyContinue).Source
            if ($cmd) { return $cmd }

            return $null
          }

          function Resolve-AntigravityExecutable {
            return Resolve-AppTarget `
              -CandidatePaths @(
                "$env:LOCALAPPDATA\Programs\Antigravity IDE\Antigravity IDE.exe",
                "$env:LOCALAPPDATA\Antigravity IDE\Antigravity IDE.exe",
                "C:\Users\runneradmin\AppData\Local\Programs\Antigravity IDE\Antigravity IDE.exe",
                "$env:ProgramFiles\Antigravity IDE\Antigravity IDE.exe",
                "${env:ProgramFiles(x86)}\Antigravity IDE\Antigravity IDE.exe"
              ) `
              -SearchRoots @(
                "$env:LOCALAPPDATA\Programs\Antigravity IDE",
                "$env:LOCALAPPDATA\Antigravity IDE",
                "$env:ProgramFiles\Antigravity IDE",
                "${env:ProgramFiles(x86)}\Antigravity IDE"
              ) `
              -ExecutableNames @("Antigravity IDE.exe", "antigravity-ide.exe")
          }

          function Install-EditorExtension {
            param(
              [Parameter(Mandatory = $true)] [string] $ToolPath,
              [Parameter(Mandatory = $true)] [string] $ExtensionId,
              [Parameter(Mandatory = $true)] [string] $ExtensionName
            )

            if ([string]::IsNullOrWhiteSpace($ToolPath) -or -not (Test-Path $ToolPath)) {
              Write-Warning "⚠️ Cannot install $ExtensionName because editor CLI was not found."
              return $false
            }

            Write-Host "🧩 Installing editor extension: $ExtensionName [$ExtensionId]"
            & $ToolPath --install-extension $ExtensionId --force

            if ($LASTEXITCODE -eq 0) {
              Write-Host "✅ Extension installed: $ExtensionName"
              return $true
            }

            Write-Warning "⚠️ Extension install failed: $ExtensionName [$ExtensionId]"
            return $false
          }

          function Register-RdpLogonTask {
            param(
              [Parameter(Mandatory = $true)] [string] $TaskName,
              [Parameter(Mandatory = $true)] [string] $ScriptPath
            )

            try {
              $action = New-ScheduledTaskAction `
                -Execute "powershell.exe" `
                -Argument "-NoProfile -ExecutionPolicy Bypass -File `"$ScriptPath`""

              $trigger = New-ScheduledTaskTrigger -AtLogOn -User $env:RDP_USER

              try {
                $trigger.Delay = "PT1M"
              } catch {
                Write-Host "Trigger delay is not supported on this runner. Continuing without delay."
              }

              Register-ScheduledTask `
                -TaskName $TaskName `
                -Action $action `
                -Trigger $trigger `
                -User $env:RDP_USER `
                -Password $env:RDP_PASSWORD `
                -RunLevel Highest `
                -Force | Out-Null

              Write-Host "✅ Logon task registered for ${env:RDP_USER}: $TaskName"
            } catch {
              Write-Warning "⚠️ Could not register logon task '$TaskName': $($_.Exception.Message)"
            }
          }

          # Export helper definitions for independent worker processes.
          $helperPath = Join-Path $env:RUNNER_TEMP 'rdp-install-helpers.ps1'
          $helperNames = @(
            'Test-RdpPackageInstalled',
            'Invoke-BoundedInstaller',
            'Install-WingetPackage',
            'Resolve-AppTarget',
            'Refresh-InstallerPath',
            'Invoke-OptionalInstall',
            'Install-NpmGlobalPackage',
            'Install-MetaTrader',
            'Install-ArtCraft',
            'Install-OfficialPowerShellApp',
            'Set-ChromeDefaultAssociations',
            'Resolve-VSCodeCli',
            'Resolve-AntigravityExecutable',
            'Install-EditorExtension',
            'Register-RdpLogonTask'
          )
          $definitions = foreach ($helperName in $helperNames) {
            $definition = (Get-Command -Name $helperName -CommandType Function -ErrorAction Stop).Definition
            "function $helperName {`n$definition`n}"
          }
          Set-Content -LiteralPath $helperPath -Value ($definitions -join "`n`n") -Encoding UTF8

      - name: 📦 Install Apps in Parallel (Skip Existing)
        shell: pwsh
        run: |
          Write-Host "==========================================="
          Write-Host " 🚀 Installing requested apps, IDE and extensions"
          Write-Host "==========================================="

          $ideChoice = '${{ inputs.ide_choice }}'
          $editorChoice = '${{ inputs.editor_choice }}'
          $metatraderChoice = '${{ inputs.metatrader_choice }}'
          $routerChoice = '${{ inputs.router_choice }}'
          $codingAgentChoice = '${{ inputs.coding_agent_choice }}'
          $aiAgentChoice = '${{ inputs.ai_agent_choice }}'
          $installArtCraft = '${{ inputs.install_artcraft }}' -eq 'true'

          $wantedVSCode = $ideChoice -in @("vscode", "both")
          $wantedAntigravity = $ideChoice -in @("antigravity", "both")
          $wantedCapCut = $editorChoice -in @("capcut", "both")
          $wantedShotcut = $editorChoice -in @("shotcut", "both")

          Write-Host "💻 IDE choice          : $ideChoice"
          Write-Host "🎬 Video editor choice : $editorChoice"
          Write-Host "📈 MetaTrader choice   : $metatraderChoice"
          Write-Host "🔀 Router choice       : $routerChoice"
          Write-Host "🧑‍💻 Coding agent choice : $codingAgentChoice"
          Write-Host "🤖 AI agent choice     : $aiAgentChoice"
          Write-Host "🎨 Install ArtCraft Launcher: $installArtCraft"

          # Resolve winget only; existing apps do not require source refresh/download.
          $winget = (Get-Command winget.exe -ErrorAction SilentlyContinue).Source
          if (-not $winget) {
            $winget = Get-ChildItem -Path "$env:ProgramFiles\WindowsApps\Microsoft.DesktopAppInstaller_*\winget.exe" -File -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          }

          $helperPath = Join-Path $env:RUNNER_TEMP 'rdp-install-helpers.ps1'
          if (-not (Test-Path -LiteralPath $helperPath)) { throw "❌ Installation helper script missing: $helperPath" }
          . $helperPath

          # 🔗 Node is a shared prerequisite. Do not let concurrent workers modify npm's store.
          Install-WingetPackage -Id 'OpenJS.NodeJS.LTS' -Name 'Node.js LTS' | Out-Null
          Refresh-InstallerPath
          $config = @{
            ideChoice = $ideChoice; editorChoice = $editorChoice
            metatraderChoice = $metatraderChoice; routerChoice = $routerChoice
            codingAgentChoice = $codingAgentChoice; aiAgentChoice = $aiAgentChoice
            wantedVSCode = $wantedVSCode; wantedAntigravity = $wantedAntigravity
            wantedCapCut = $wantedCapCut; wantedShotcut = $wantedShotcut
            winget = $winget
          }
          $tasks = [Collections.Generic.List[object]]::new()
          function Add-InstallTask {
            param([string] $Name, [scriptblock] $Action, [bool] $Required = $false)
            $taskDir = Join-Path $env:RUNNER_TEMP ("rdp-task-" + $Name)
            New-Item -Path $taskDir -ItemType Directory -Force | Out-Null
            $job = Start-Job -Name $Name -ArgumentList $helperPath, $config, $Action.ToString(), $taskDir -ScriptBlock {
              param($Helpers, $Config, $Code, $TaskDir)
              $ErrorActionPreference = 'Stop'
              $env:GITHUB_ENV = Join-Path $TaskDir 'env.txt'
              $env:GITHUB_PATH = Join-Path $TaskDir 'path.txt'
              Set-Content -LiteralPath (Join-Path $TaskDir 'pid.txt') -Value $PID
              . $Helpers
              foreach ($entry in $Config.GetEnumerator()) { Set-Variable -Name $entry.Key -Value $entry.Value }
              Refresh-InstallerPath
              $clock = [Diagnostics.Stopwatch]::StartNew()
              try {
                & ([scriptblock]::Create($Code)) | Out-Host
              } finally {
                Write-Host ("⏱️ TIME GROUP {0}: {1:N1}s" -f (Split-Path $TaskDir -Leaf), $clock.Elapsed.TotalSeconds)
              }
              $global:LASTEXITCODE = 0
            }
            $tasks.Add([pscustomobject]@{ Job = $job; Name = $Name; Required = $Required; Dir = $taskDir; Started = [datetime]::UtcNow })
          }

          Add-InstallTask -Name 'gui' -Required $true -Action {
          # Base applications retained for every run.
          Install-WingetPackage `
            -Id "Google.Chrome" `
            -Name "Google Chrome" `
            -FallbackInstaller {
              $is64BitRunner = [Environment]::Is64BitOperatingSystem
              $chromeMsiUrl = if ($is64BitRunner) {
                "https://dl.google.com/dl/chrome/install/googlechromestandaloneenterprise64.msi"
              } else {
                "https://dl.google.com/dl/chrome/install/googlechromestandaloneenterprise.msi"
              }
              $chromeMsiPath = Join-Path $env:TEMP "chrome-enterprise.msi"

              Write-Host "🌐 📥 Downloading fallback Chrome installer from: $chromeMsiUrl"
              Invoke-WebRequest `
                -Uri $chromeMsiUrl `
                -OutFile $chromeMsiPath `
                -UseBasicParsing `
                -TimeoutSec 120 `
                -ErrorAction Stop

              if (-not (Test-Path $chromeMsiPath)) {
                throw "❌ Chrome MSI fallback download failed."
              }

              $chromeExit = Invoke-BoundedInstaller -FilePath 'msiexec.exe' `
                -Arguments @('/i', "`"$chromeMsiPath`"", '/qn', '/norestart') -TimeoutSeconds 300

              Remove-Item $chromeMsiPath -Force -ErrorAction SilentlyContinue

              if ($chromeExit -notin @(0, 3010, 1641)) {
                throw "❌ Chrome MSI fallback install failed with exit code $chromeExit."
              }
            }

          Install-WingetPackage -Id "RARLab.WinRAR" -Name "WinRAR"

          # Apply Chrome as the default browser for new Windows profiles and through policy.
          Set-ChromeDefaultAssociations

          # IDE choice: default none.
          if ($wantedAntigravity) {
            Invoke-OptionalInstall 'Antigravity IDE' {
              Install-WingetPackage -Id "Google.AntigravityIDE" -Name "Antigravity IDE" -Optional | Out-Null
            }
          } else {
            Write-Host "⏭️ Skipping Antigravity IDE because ide_choice=$ideChoice"
          }

          if ($wantedVSCode) {
            Invoke-OptionalInstall 'Visual Studio Code' {
              Install-WingetPackage -Id "Microsoft.VisualStudioCode" -Name "Visual Studio Code" -Scope "machine" -Optional | Out-Null
            }
          } else {
            Write-Host "⏭️ Skipping Visual Studio Code because ide_choice=$ideChoice"
          }

          if ($wantedVSCode) {
            $vscodeMachineExe = Resolve-AppTarget `
              -CandidatePaths @(
                "$env:ProgramFiles\Microsoft VS Code\Code.exe",
                "${env:ProgramFiles(x86)}\Microsoft VS Code\Code.exe"
              ) `
              -SearchRoots @(
                "$env:ProgramFiles\Microsoft VS Code",
                "${env:ProgramFiles(x86)}\Microsoft VS Code"
              ) `
              -ExecutableNames @("Code.exe")

            if ($vscodeMachineExe) {
              Write-Host "🔎 VS Code machine-wide executable found: $vscodeMachineExe"
            } else {
              Write-Warning "⚠️ VS Code executable was not found after installation. Check the winget logs."
            }
          }

          # Video editor choice: default none.
          if ($wantedCapCut) {
            Invoke-OptionalInstall 'CapCut' {
              Install-WingetPackage -Id "ByteDance.CapCut" -Name "CapCut" -Optional | Out-Null
            }
          }

          if ($wantedShotcut) {
            Invoke-OptionalInstall 'Shotcut' {
              Install-WingetPackage -Id "Meltytech.Shotcut" -Name "Shotcut" -Optional | Out-Null
            }
          }

          # MetaTrader installers are fetched from MetaQuotes' official CDN.
          if ($metatraderChoice -in @('mt4', 'both')) {
            Invoke-OptionalInstall 'MetaTrader 4' {
              Install-MetaTrader -Version 'mt4'
            }
          }

          if ($metatraderChoice -in @('mt5', 'both')) {
            Invoke-OptionalInstall 'MetaTrader 5' {
              Install-MetaTrader -Version 'mt5'
            }
          }

          }

          if ($routerChoice -ne 'none' -or $codingAgentChoice -ne 'none' -or $aiAgentChoice -ne 'none') {
          Add-InstallTask -Name 'cli' -Action {
          # Resolve npm after Node.js installation. Node.js is retained as a base dependency.
          $npm = $null
          $npmCandidates = @(
            "$env:ProgramFiles\nodejs\npm.cmd",
            "${env:ProgramFiles(x86)}\nodejs\npm.cmd"
          )

          $npm = $npmCandidates |
            Where-Object { $_ -and (Test-Path $_) } |
            Select-Object -First 1

          if (-not $npm) {
            $npm = (Get-Command npm.cmd -ErrorAction SilentlyContinue).Source
          }

          if (-not $npm) {
            Write-Error "npm.cmd was not found after Node.js installation."
            exit 1
          }

          # AI API routers: default none.
          if ($routerChoice -in @('9router', 'both')) {
            Invoke-OptionalInstall '9Router' {
              Install-NpmGlobalPackage -PackageName '9router'
            }
          }

          if ($routerChoice -in @('omniroute', 'both')) {
            Invoke-OptionalInstall 'OmniRoute' {
              Install-NpmGlobalPackage -PackageName 'omniroute'
            }
          }

          # Coding agents: default none. Codex uses its npm package; Claude Code uses its official installer.
          if ($codingAgentChoice -in @('codex', 'both')) {
            Invoke-OptionalInstall 'Codex CLI' {
              Install-NpmGlobalPackage -PackageName '@openai/codex'
            }
          }

          if ($codingAgentChoice -in @('claude', 'both')) {
            Invoke-OptionalInstall 'Claude Code' {
              Install-OfficialPowerShellApp `
                -Name 'Claude Code' `
                -Uri 'https://claude.ai/install.ps1' `
                -Mode 'plain'
            }
          }

          # Native Windows installers are run non-interactively to avoid hanging the workflow.
          if ($aiAgentChoice -in @('hermes', 'both', 'all')) {
            Invoke-OptionalInstall 'Hermes Agent' {
              Install-OfficialPowerShellApp `
                -Name 'Hermes Agent' `
                -Uri 'https://hermes-agent.nousresearch.com/install.ps1' `
                -Mode 'hermes'
            }
          }

          if ($aiAgentChoice -in @('openclaw', 'both', 'all')) {
            Invoke-OptionalInstall 'OpenClaw' {
              Install-OfficialPowerShellApp `
                -Name 'OpenClaw' `
                -Uri 'https://openclaw.ai/install.ps1' `
                -Mode 'openclaw'
            }
          }

          if ($aiAgentChoice -in @('opencode', 'all')) {
            Invoke-OptionalInstall 'OpenCode' {
              Install-NpmGlobalPackage -PackageName 'opencode-ai'
            }
          }

          }
          }

          if ($installArtCraft) {
          Add-InstallTask -Name 'artcraft' -Action {
          Install-ArtCraft
          }
          }

          # 🚀 Maximum three workers: GUI installers, CLI agents, and ArtCraft Launcher (download may overlap, MSI stays serialized).
          # GUI installers remain serial; npm commands remain serial inside the CLI worker.
          $requiredFailures = [Collections.Generic.List[string]]::new()
          $pending = [Collections.Generic.List[object]]::new()
          foreach ($task in $tasks) { $pending.Add($task) }
          try {
            while ($pending.Count -gt 0) {
              foreach ($task in @($pending.ToArray())) {
                Receive-Job -Job $task.Job -ErrorAction Continue
                $timedOut = $task.Job.State -in @('Running', 'NotStarted') -and ([datetime]::UtcNow - $task.Started).TotalSeconds -gt 1200
                if ($timedOut) {
                  # Kill worker AND descendants, rather than leaving installer processes running.
                  $pidFile = Join-Path $task.Dir 'pid.txt'
                  if (Test-Path $pidFile) {
                    $workerPid = [int](Get-Content $pidFile -Raw).Trim()
                    & taskkill.exe /PID $workerPid /T /F 2>&1 | Out-Host
                  }
                  Stop-Job -Job $task.Job -ErrorAction SilentlyContinue
                  Write-Warning "⚠️ Group $($task.Name) exceeded 20 minutes and was terminated."
                }
                if ($task.Job.State -notin @('Running', 'NotStarted')) {
                  Receive-Job -Job $task.Job -ErrorAction Continue
                  $ok = $task.Job.State -eq 'Completed' -and -not $timedOut
                  Write-Host "📋 RESULT GROUP $($task.Name): $($task.Job.State)"
                  if (-not $ok) {
                    if ($task.Required) { $requiredFailures.Add($task.Name) }
                    else { Write-Warning "⚠️ Optional group $($task.Name) failed; see log above." }
                  }
                  # Merge command files only after successful completion; no concurrent appends.
                  if ($ok) {
                    foreach ($pair in @(@('env.txt', $env:GITHUB_ENV), @('path.txt', $env:GITHUB_PATH))) {
                      $file = Join-Path $task.Dir $pair[0]
                      if (Test-Path -LiteralPath $file) {
                        Get-Content -LiteralPath $file | Add-Content -LiteralPath $pair[1] -Encoding UTF8
                      }
                    }
                  }
                  Remove-Job -Job $task.Job -Force -ErrorAction SilentlyContinue
                  $pending.Remove($task) | Out-Null
                }
              }
              if ($pending.Count -gt 0) { Start-Sleep -Seconds 2 }
            }
          } finally {
            foreach ($task in $pending) {
              $pidFile = Join-Path $task.Dir 'pid.txt'
              if (Test-Path $pidFile) {
                $workerPid = [int](Get-Content $pidFile -Raw).Trim()
                & taskkill.exe /PID $workerPid /T /F 2>&1 | Out-Host
              }
              Stop-Job -Job $task.Job -ErrorAction SilentlyContinue
              Remove-Job -Job $task.Job -Force -ErrorAction SilentlyContinue
            }
          }
          if ($requiredFailures.Count -gt 0) { throw "❌ Required installation group failed: $($requiredFailures -join ', ')" }
          Refresh-InstallerPath


          $global:LASTEXITCODE = 0

      - name: 🧩 Configure IDE Extensions and Chrome Policy
        shell: pwsh
        run: |
          . (Join-Path $env:RUNNER_TEMP 'rdp-install-helpers.ps1')
          $wantedVSCode = '${{ inputs.ide_choice }}' -in @('vscode', 'both')
          $wantedAntigravity = '${{ inputs.ide_choice }}' -in @('antigravity', 'both')
          # IDE extensions: Codex + Office Viewer
          $editorExtensions = @(
            @{ Id = "OpenAI.chatgpt"; Name = "Codex / ChatGPT by OpenAI" },
            @{ Id = "cweijan.vscode-office"; Name = "Office Viewer" }
          )

          if ($wantedVSCode) {
            $codeCli = Resolve-VSCodeCli

            if ($codeCli) {
              foreach ($extension in $editorExtensions) {
                Install-EditorExtension -ToolPath $codeCli -ExtensionId $extension.Id -ExtensionName $extension.Name | Out-Null
              }
            } else {
              Write-Warning "⚠️ VS Code CLI code.cmd was not found. VS Code extensions will be installed by the RDP logon task if possible."
            }
          }

          if ($wantedAntigravity) {
            $antigravityExe = Resolve-AntigravityExecutable

            if ($antigravityExe) {
              foreach ($extension in $editorExtensions) {
                Install-EditorExtension -ToolPath $antigravityExe -ExtensionId $extension.Id -ExtensionName $extension.Name | Out-Null
              }
            } else {
              Write-Warning "⚠️ Antigravity executable was not found yet. Extensions will be installed by launcher/logon task if the editor supports VS Code extension CLI flags."
            }
          }

          # Prepare user-context extension install tasks for the RDP user.
          # VS Code and VS Code-compatible IDE extensions are user-scoped, so this makes them ready after RDP login.
          $setupDir = Join-Path $env:ProgramData "RDP-Setup"
          New-Item -ItemType Directory -Path $setupDir -Force | Out-Null

          if ($wantedVSCode) {
            $vscodeRdpScript = Join-Path $setupDir "install-vscode-extensions-for-rdp.ps1"

            @'
          $ErrorActionPreference = "Continue"

          $extensions = @(
            "OpenAI.chatgpt",
            "cweijan.vscode-office"
          )

          function Resolve-VSCodeCli {
            $candidates = @(
              "$env:ProgramFiles\Microsoft VS Code\bin\code.cmd",
              "${env:ProgramFiles(x86)}\Microsoft VS Code\bin\code.cmd",
              "$env:LOCALAPPDATA\Programs\Microsoft VS Code\bin\code.cmd"
            )

            foreach ($candidate in $candidates) {
              if ($candidate -and (Test-Path $candidate)) {
                return (Resolve-Path $candidate).Path
              }
            }

            $cmd = (Get-Command code.cmd -ErrorAction SilentlyContinue).Source
            if ($cmd) { return $cmd }

            return $null
          }

          $codeCli = $null

          for ($i = 0; $i -lt 12 -and -not $codeCli; $i++) {
            $codeCli = Resolve-VSCodeCli
            if (-not $codeCli) {
              Start-Sleep -Seconds 10
            }
          }

          if ($codeCli) {
            foreach ($extension in $extensions) {
              & $codeCli --install-extension $extension --force
            }

            $settingsDir = Join-Path $env:APPDATA "Code\User"
            New-Item -ItemType Directory -Path $settingsDir -Force | Out-Null

            $settingsPath = Join-Path $settingsDir "settings.json"
            $settings = [ordered]@{
              "workbench.startupEditor" = "none"
              "extensions.ignoreRecommendations" = $true
              "telemetry.telemetryLevel" = "off"
            }

            $settings | ConvertTo-Json -Depth 5 | Set-Content -Path $settingsPath -Encoding UTF8
          } else {
            Write-Host "VS Code CLI was not found for user $env:USERNAME."
          }

          Unregister-ScheduledTask -TaskName "Install VS Code Extensions for RDP" -Confirm:$false -ErrorAction SilentlyContinue
          '@ | Set-Content -Path $vscodeRdpScript -Encoding UTF8

            Register-RdpLogonTask -TaskName "Install VS Code Extensions for RDP" -ScriptPath $vscodeRdpScript
          }

          if ($wantedAntigravity) {
            $antigravityRdpScript = Join-Path $setupDir "install-antigravity-extensions-for-rdp.ps1"

            @'
          $ErrorActionPreference = "Continue"

          $extensions = @(
            "OpenAI.chatgpt",
            "cweijan.vscode-office"
          )

          function Resolve-AntigravityExecutable {
            $candidateExePaths = @(
              "$env:LOCALAPPDATA\Programs\Antigravity IDE\Antigravity IDE.exe",
              "$env:LOCALAPPDATA\Antigravity IDE\Antigravity IDE.exe",
              "C:\Users\runneradmin\AppData\Local\Programs\Antigravity IDE\Antigravity IDE.exe",
              "$env:ProgramFiles\Antigravity IDE\Antigravity IDE.exe",
              "${env:ProgramFiles(x86)}\Antigravity IDE\Antigravity IDE.exe"
            )

            foreach ($candidate in $candidateExePaths) {
              if ([string]::IsNullOrWhiteSpace($candidate)) { continue }
              if (Test-Path $candidate) {
                return (Resolve-Path $candidate).Path
              }
            }

            $searchRoots = @(
              "$env:LOCALAPPDATA\Programs\Antigravity IDE",
              "$env:LOCALAPPDATA\Antigravity IDE",
              "$env:ProgramFiles\Antigravity IDE",
              "${env:ProgramFiles(x86)}\Antigravity IDE"
            )

            foreach ($root in $searchRoots) {
              if ([string]::IsNullOrWhiteSpace($root) -or -not (Test-Path $root)) { continue }

              $found = Get-ChildItem `
                -Path $root `
                -Include "Antigravity IDE.exe", "antigravity-ide.exe" `
                -File `
                -Recurse -Depth 3 `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                return $found.FullName
              }
            }

            return $null
          }

          $antigravityExe = $null

          for ($i = 0; $i -lt 12 -and -not $antigravityExe; $i++) {
            $antigravityExe = Resolve-AntigravityExecutable
            if (-not $antigravityExe) {
              Start-Sleep -Seconds 10
            }
          }

          if ($antigravityExe) {
            foreach ($extension in $extensions) {
              & $antigravityExe --install-extension $extension --force
            }

            $settingsRoots = @(
              (Join-Path $env:APPDATA "Antigravity\User"),
              (Join-Path $env:APPDATA "Antigravity IDE\User")
            )

            foreach ($settingsDir in $settingsRoots) {
              New-Item -ItemType Directory -Path $settingsDir -Force | Out-Null
              $settingsPath = Join-Path $settingsDir "settings.json"
              $settings = [ordered]@{
                "workbench.startupEditor" = "none"
                "extensions.ignoreRecommendations" = $true
              }

              $settings | ConvertTo-Json -Depth 5 | Set-Content -Path $settingsPath -Encoding UTF8
            }
          } else {
            Write-Host "Antigravity executable was not found for user $env:USERNAME."
          }

          Unregister-ScheduledTask -TaskName "Install Antigravity Extensions for RDP" -Confirm:$false -ErrorAction SilentlyContinue
          '@ | Set-Content -Path $antigravityRdpScript -Encoding UTF8

            Register-RdpLogonTask -TaskName "Install Antigravity Extensions for RDP" -ScriptPath $antigravityRdpScript
          }

          # Force install Chrome extensions for all users via Chrome enterprise policy
          $extensionUpdateUrl = "https://clients2.google.com/service/update2/crx"
          $chromePolicyPath = "HKLM:\Software\Policies\Google\Chrome\ExtensionInstallForcelist"

          New-Item -Path $chromePolicyPath -Force | Out-Null

          $chromeExtensions = @(
            "hlkenndednhfkekhgcdicdfddnkalmdm;$extensionUpdateUrl", # Cookie-Editor
            "fdpohaocaechififmbbbbbknoalclacl;$extensionUpdateUrl"  # GoFullPage
          )

          for ($i = 0; $i -lt $chromeExtensions.Count; $i++) {
            New-ItemProperty `
              -Path $chromePolicyPath `
              -Name "$($i + 1)" `
              -Value $chromeExtensions[$i] `
              -PropertyType String `
              -Force | Out-Null
          }

          Write-Host "✅ Chrome extensions policy configured"
          Write-Host "   - Cookie-Editor"
          Write-Host "   - GoFullPage"
          Write-Host "✅ App and IDE setup completed"

          $global:LASTEXITCODE = 0

      - name: 🧬 Prepare Antigravity IDE for RDP User
        if: ${{ inputs.ide_choice == 'antigravity' || inputs.ide_choice == 'both' }}
        shell: pwsh
        run: |
          Write-Host "==========================================="
          Write-Host " Preparing Antigravity IDE for RDP user"
          Write-Host "==========================================="
          Write-Host "Antigravity IDE is installed with user scope under runneradmin. This step stages it in ProgramData and prepares a per-user copy for $env:RDP_USER."

          $setupDir = Join-Path $env:ProgramData "RDP-Setup"
          $antigravityStagingRoot = Join-Path $setupDir "Antigravity IDE"
          $antigravityLauncherScript = Join-Path $setupDir "launch-antigravity-ide.ps1"
          $antigravityCopyScript = Join-Path $setupDir "copy-antigravity-ide-for-rdp.ps1"

          New-Item -ItemType Directory -Path $setupDir -Force | Out-Null

          function Resolve-AntigravityIdeExe {
            $candidateExePaths = @(
              "$env:LOCALAPPDATA\Programs\Antigravity IDE\Antigravity IDE.exe",
              "$env:LOCALAPPDATA\Antigravity IDE\Antigravity IDE.exe",
              "C:\Users\runneradmin\AppData\Local\Programs\Antigravity IDE\Antigravity IDE.exe",
              "$env:ProgramFiles\Antigravity IDE\Antigravity IDE.exe",
              "${env:ProgramFiles(x86)}\Antigravity IDE\Antigravity IDE.exe"
            )

            foreach ($candidate in $candidateExePaths) {
              if ([string]::IsNullOrWhiteSpace($candidate)) { continue }
              if (Test-Path $candidate) {
                return (Resolve-Path $candidate).Path
              }
            }

            $searchRoots = @(
              "$env:LOCALAPPDATA\Programs",
              "$env:LOCALAPPDATA",
              "C:\Users\runneradmin\AppData\Local\Programs",
              "$env:ProgramFiles",
              "${env:ProgramFiles(x86)}"
            )

            foreach ($root in $searchRoots) {
              if ([string]::IsNullOrWhiteSpace($root) -or -not (Test-Path $root)) { continue }

              $found = Get-ChildItem `
                -Path $root `
                -Include "Antigravity IDE.exe", "antigravity-ide.exe" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                return $found.FullName
              }
            }

            return $null
          }

          $antigravitySourceExe = Resolve-AntigravityIdeExe

          if (-not $antigravitySourceExe) {
            Write-Warning "⚠️ Antigravity IDE executable was not found. RDP user copy and launcher will still be prepared, but shortcut may not work until the package path is corrected."
          } else {
            $antigravitySourceDir = Split-Path $antigravitySourceExe -Parent
            Write-Host "Found Antigravity IDE source: $antigravitySourceDir"

            if (Test-Path $antigravityStagingRoot) {
              Remove-Item -Path $antigravityStagingRoot -Recurse -Force -ErrorAction SilentlyContinue
            }

            New-Item -ItemType Directory -Path $antigravityStagingRoot -Force | Out-Null
            Copy-Item -Path (Join-Path $antigravitySourceDir "*") -Destination $antigravityStagingRoot -Recurse -Force
            Write-Host "✅ Antigravity IDE staged to: $antigravityStagingRoot"
          }

          @'
          $ErrorActionPreference = "Continue"

          $sourceRoot = Join-Path $env:ProgramData "RDP-Setup\Antigravity IDE"
          $destRoot = Join-Path $env:LOCALAPPDATA "Programs\Antigravity IDE"
          $sourceExe = Join-Path $sourceRoot "Antigravity IDE.exe"
          $destExe = Join-Path $destRoot "Antigravity IDE.exe"

          if (-not (Test-Path $sourceExe)) {
            Write-Host "Antigravity IDE staged source not found: $sourceExe"
            exit 1
          }

          $shouldCopy = -not (Test-Path $destExe)

          if (-not $shouldCopy) {
            try {
              $sourceTime = (Get-Item $sourceExe).LastWriteTimeUtc
              $destTime = (Get-Item $destExe).LastWriteTimeUtc
              if ($sourceTime -gt $destTime) {
                $shouldCopy = $true
              }
            } catch {
              $shouldCopy = $true
            }
          }

          if ($shouldCopy) {
            New-Item -ItemType Directory -Path $destRoot -Force | Out-Null
            Copy-Item -Path (Join-Path $sourceRoot "*") -Destination $destRoot -Recurse -Force
          }

          if (Test-Path $destExe) {
            $extensions = @(
              "OpenAI.chatgpt",
              "cweijan.vscode-office"
            )

            foreach ($extension in $extensions) {
              & $destExe --install-extension $extension --force
            }

            Start-Process -FilePath $destExe
          } else {
            Write-Host "Antigravity IDE executable not found after copy: $destExe"
            exit 1
          }
          '@ | Set-Content -Path $antigravityLauncherScript -Encoding UTF8

          @'
          $ErrorActionPreference = "Continue"

          $sourceRoot = Join-Path $env:ProgramData "RDP-Setup\Antigravity IDE"
          $destRoot = Join-Path $env:LOCALAPPDATA "Programs\Antigravity IDE"
          $sourceExe = Join-Path $sourceRoot "Antigravity IDE.exe"
          $destExe = Join-Path $destRoot "Antigravity IDE.exe"

          if (Test-Path $sourceExe) {
            if (-not (Test-Path $destExe)) {
              New-Item -ItemType Directory -Path $destRoot -Force | Out-Null
              Copy-Item -Path (Join-Path $sourceRoot "*") -Destination $destRoot -Recurse -Force
            }
          }

          if (Test-Path $destExe) {
            $extensions = @(
              "OpenAI.chatgpt",
              "cweijan.vscode-office"
            )

            foreach ($extension in $extensions) {
              & $destExe --install-extension $extension --force
            }
          }

          Unregister-ScheduledTask -TaskName "Prepare Antigravity IDE for RDP" -Confirm:$false -ErrorAction SilentlyContinue
          '@ | Set-Content -Path $antigravityCopyScript -Encoding UTF8

          # If the RDP profile already exists, copy immediately. Otherwise the logon task and launcher will do it after RDP signs in.
          $rdpProfile = Join-Path "C:\Users" $env:RDP_USER
          $rdpAntigravityDest = Join-Path $rdpProfile "AppData\Local\Programs\Antigravity IDE"

          if ((Test-Path $rdpProfile) -and (Test-Path $antigravityStagingRoot)) {
            New-Item -ItemType Directory -Path $rdpAntigravityDest -Force | Out-Null
            Copy-Item -Path (Join-Path $antigravityStagingRoot "*") -Destination $rdpAntigravityDest -Recurse -Force
            Write-Host "✅ Antigravity IDE copied immediately to RDP profile: $rdpAntigravityDest"
          } else {
            Write-Host "RDP profile is not ready yet. Antigravity IDE will be copied when $env:RDP_USER logs in or opens the shortcut."
          }

          try {
            $action = New-ScheduledTaskAction `
              -Execute "powershell.exe" `
              -Argument "-NoProfile -ExecutionPolicy Bypass -File `"$antigravityCopyScript`""

            $trigger = New-ScheduledTaskTrigger -AtLogOn -User $env:RDP_USER

            Register-ScheduledTask `
              -TaskName "Prepare Antigravity IDE for RDP" `
              -Action $action `
              -Trigger $trigger `
              -User $env:RDP_USER `
              -Password $env:RDP_PASSWORD `
              -RunLevel Highest `
              -Force | Out-Null

            Write-Host "✅ One-time Antigravity IDE copy task registered for $env:RDP_USER"
          } catch {
            Write-Warning "⚠️ Could not register Antigravity IDE copy task: $($_.Exception.Message)"
          }

          Write-Host "✅ Antigravity IDE RDP preparation completed"

      - name: 🧷 Publish App Shortcuts for RDP User
        shell: pwsh
        run: |
          Write-Host "==========================================="
          Write-Host " Publishing installed apps to RDP user UI"
          Write-Host "==========================================="
          Write-Host "Apps may be installed under runneradmin/user scope. Shortcuts below are published through Public Desktop and the common Start Menu so they appear when logging in as $env:RDP_USER."

          $ideChoice = '${{ inputs.ide_choice }}'
          $editorChoice = '${{ inputs.editor_choice }}'
          $metatraderChoice = '${{ inputs.metatrader_choice }}'
          $routerChoice = '${{ inputs.router_choice }}'
          $codingAgentChoice = '${{ inputs.coding_agent_choice }}'
          $aiAgentChoice = '${{ inputs.ai_agent_choice }}'
          $installArtCraft = '${{ inputs.install_artcraft }}' -eq 'true'

          $wantedVSCode = $ideChoice -in @("vscode", "both")
          $wantedAntigravity = $ideChoice -in @("antigravity", "both")
          $wantedCapCut = $editorChoice -in @("capcut", "both")
          $wantedShotcut = $editorChoice -in @("shotcut", "both")
          $wantedOpenCode = $aiAgentChoice -in @("opencode", "all")

          $publicDesktop = Join-Path $env:PUBLIC "Desktop"
          $commonStartMenu = Join-Path $env:ProgramData "Microsoft\Windows\Start Menu\Programs"
          $shortcutDirectories = @($publicDesktop, $commonStartMenu)

          $rdpProfile = Join-Path "C:\Users" $env:RDP_USER
          if (Test-Path $rdpProfile) {
            $shortcutDirectories += Join-Path $rdpProfile "Desktop"
            $shortcutDirectories += Join-Path $rdpProfile "AppData\Roaming\Microsoft\Windows\Start Menu\Programs"
          }

          $shortcutDirectories = $shortcutDirectories |
            Where-Object { $_ -and $_.Trim() } |
            Select-Object -Unique

          foreach ($dir in $shortcutDirectories) {
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
          }

          function Resolve-AppTarget {
            param(
              [string[]] $CandidatePaths = @(),
              [string[]] $SearchRoots = @(),
              [string[]] $ExecutableNames = @()
            )

            foreach ($candidate in $CandidatePaths) {
              if ([string]::IsNullOrWhiteSpace($candidate)) { continue }

              $expanded = [Environment]::ExpandEnvironmentVariables($candidate)
              if (Test-Path $expanded) {
                return (Resolve-Path $expanded).Path
              }
            }

            foreach ($root in $SearchRoots) {
              if ([string]::IsNullOrWhiteSpace($root)) { continue }

              $expandedRoot = [Environment]::ExpandEnvironmentVariables($root)
              if (-not (Test-Path $expandedRoot)) { continue }

              foreach ($exeName in $ExecutableNames) {
                $found = Get-ChildItem `
                  -Path $expandedRoot `
                  -Filter $exeName `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  Select-Object -First 1

                if ($found) {
                  return $found.FullName
                }
              }
            }

            return $null
          }

          function New-AppShortcut {
            param(
              [Parameter(Mandatory = $true)] [string] $Name,
              [AllowNull()] [string] $TargetPath,
              [string] $Arguments = "",
              [string] $IconLocation = "",
              [string] $WorkingDirectory = ""
            )

            if ([string]::IsNullOrWhiteSpace($TargetPath) -or -not (Test-Path $TargetPath)) {
              Write-Warning "⚠️ Shortcut skipped for $Name because target was not found: $TargetPath"
              return
            }

            $shell = New-Object -ComObject WScript.Shell

            foreach ($dir in $shortcutDirectories) {
              $shortcutPath = Join-Path $dir "$Name.lnk"
              $shortcut = $shell.CreateShortcut($shortcutPath)
              $shortcut.TargetPath = $TargetPath
              $shortcut.Arguments = $Arguments

              if ([string]::IsNullOrWhiteSpace($WorkingDirectory)) {
                $shortcut.WorkingDirectory = Split-Path $TargetPath -Parent
              } else {
                $shortcut.WorkingDirectory = $WorkingDirectory
              }

              $shortcut.IconLocation = if ([string]::IsNullOrWhiteSpace($IconLocation)) { $TargetPath } else { $IconLocation }
              $shortcut.Save()

              Write-Host "✅ Shortcut created: $shortcutPath"
            }
          }

          $runnerLocalPrograms = Join-Path $env:LOCALAPPDATA "Programs"
          $runnerRoamingNpm = Join-Path $env:APPDATA "npm"
          $antigravityLauncher = Join-Path $env:ProgramData "RDP-Setup\launch-antigravity-ide.ps1"

          $chromeTarget = Resolve-AppTarget `
            -CandidatePaths @(
              "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
              "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
            ) `
            -SearchRoots @(
              "$env:ProgramFiles\Google",
              "${env:ProgramFiles(x86)}\Google"
            ) `
            -ExecutableNames @("chrome.exe")

          $winrarTarget = Resolve-AppTarget `
            -CandidatePaths @(
              "$env:ProgramFiles\WinRAR\WinRAR.exe",
              "${env:ProgramFiles(x86)}\WinRAR\WinRAR.exe"
            ) `
            -SearchRoots @(
              "$env:ProgramFiles\WinRAR",
              "${env:ProgramFiles(x86)}\WinRAR"
            ) `
            -ExecutableNames @("WinRAR.exe")

          $vscodeTarget = Resolve-AppTarget `
            -CandidatePaths @(
              "$env:ProgramFiles\Microsoft VS Code\Code.exe",
              "${env:ProgramFiles(x86)}\Microsoft VS Code\Code.exe",
              "$runnerLocalPrograms\Microsoft VS Code\Code.exe"
            ) `
            -SearchRoots @(
              "$env:ProgramFiles\Microsoft VS Code",
              "${env:ProgramFiles(x86)}\Microsoft VS Code",
              "$runnerLocalPrograms\Microsoft VS Code"
            ) `
            -ExecutableNames @("Code.exe")

          $antigravityIdeTarget = Resolve-AppTarget `
            -CandidatePaths @(
              "$runnerLocalPrograms\Antigravity IDE\Antigravity IDE.exe",
              "$env:LOCALAPPDATA\Antigravity IDE\Antigravity IDE.exe",
              "C:\Users\runneradmin\AppData\Local\Programs\Antigravity IDE\Antigravity IDE.exe"
            ) `
            -SearchRoots @(
              $runnerLocalPrograms,
              "$env:LOCALAPPDATA",
              "C:\Users\runneradmin\AppData\Local\Programs",
              "$env:ProgramFiles\Antigravity IDE",
              "${env:ProgramFiles(x86)}\Antigravity IDE"
            ) `
            -ExecutableNames @("Antigravity IDE.exe", "antigravity-ide.exe")

          $nodeTarget = Resolve-AppTarget `
            -CandidatePaths @(
              "$env:ProgramFiles\nodejs\node.exe",
              "${env:ProgramFiles(x86)}\nodejs\node.exe"
            ) `
            -SearchRoots @(
              "$env:ProgramFiles\nodejs",
              "${env:ProgramFiles(x86)}\nodejs"
            ) `
            -ExecutableNames @("node.exe")

          $codexTarget = Resolve-AppTarget `
            -CandidatePaths @(
              "$runnerRoamingNpm\codex.cmd",
              "$env:ProgramFiles\nodejs\codex.cmd",
              "${env:ProgramFiles(x86)}\nodejs\codex.cmd"
            ) `
            -SearchRoots @(
              $runnerRoamingNpm,
              "$env:ProgramFiles\nodejs",
              "${env:ProgramFiles(x86)}\nodejs"
            ) `
            -ExecutableNames @("codex.cmd", "codex.ps1")

          $nineRouterTarget = Resolve-AppTarget `
            -CandidatePaths @(
              "$runnerRoamingNpm\9router.cmd",
              "$env:ProgramFiles\nodejs\9router.cmd",
              "${env:ProgramFiles(x86)}\nodejs\9router.cmd"
            ) `
            -SearchRoots @(
              $runnerRoamingNpm,
              "$env:ProgramFiles\nodejs",
              "${env:ProgramFiles(x86)}\nodejs"
            ) `
            -ExecutableNames @("9router.cmd", "9router.ps1")

          $capCutTarget = Resolve-AppTarget `
            -CandidatePaths @(
              "$env:ProgramFiles\CapCut\CapCut.exe",
              "${env:ProgramFiles(x86)}\CapCut\CapCut.exe",
              "$env:LOCALAPPDATA\CapCut\CapCut.exe",
              "$env:LOCALAPPDATA\Programs\CapCut\CapCut.exe"
            ) `
            -SearchRoots @(
              "$env:ProgramFiles\CapCut",
              "${env:ProgramFiles(x86)}\CapCut",
              "$env:LOCALAPPDATA\CapCut",
              "$env:LOCALAPPDATA\Programs\CapCut"
            ) `
            -ExecutableNames @("CapCut.exe")

          $shotcutTarget = Resolve-AppTarget `
            -CandidatePaths @(
              "$env:ProgramFiles\Shotcut\shotcut.exe",
              "${env:ProgramFiles(x86)}\Shotcut\shotcut.exe",
              "$env:LOCALAPPDATA\Programs\Shotcut\shotcut.exe"
            ) `
            -SearchRoots @(
              "$env:ProgramFiles\Shotcut",
              "${env:ProgramFiles(x86)}\Shotcut",
              "$env:LOCALAPPDATA\Programs\Shotcut"
            ) `
            -ExecutableNames @("shotcut.exe")

          $mt4Target = Resolve-AppTarget `
            -CandidatePaths @(
              "$env:ProgramFiles\MetaTrader 4\terminal.exe",
              "${env:ProgramFiles(x86)}\MetaTrader 4\terminal.exe"
            ) `
            -SearchRoots @(
              "$env:ProgramFiles\MetaTrader 4",
              "${env:ProgramFiles(x86)}\MetaTrader 4"
            ) `
            -ExecutableNames @("terminal.exe")

          $mt5Target = Resolve-AppTarget `
            -CandidatePaths @(
              "$env:ProgramFiles\MetaTrader 5\terminal64.exe",
              "$env:ProgramFiles\MetaTrader 5\terminal.exe",
              "${env:ProgramFiles(x86)}\MetaTrader 5\terminal.exe"
            ) `
            -SearchRoots @(
              "$env:ProgramFiles\MetaTrader 5",
              "${env:ProgramFiles(x86)}\MetaTrader 5"
            ) `
            -ExecutableNames @("terminal64.exe", "terminal.exe")

          $claudeTarget = Resolve-AppTarget `
            -CandidatePaths @(
              "$env:USERPROFILE\.local\bin\claude.exe",
              "$env:USERPROFILE\.local\bin\claude.cmd",
              "$runnerRoamingNpm\claude.cmd"
            ) `
            -SearchRoots @(
              "$env:USERPROFILE\.local\bin",
              $runnerRoamingNpm
            ) `
            -ExecutableNames @("claude.exe", "claude.cmd", "claude.ps1")

          $hermesTarget = Resolve-AppTarget `
            -CandidatePaths @(
              "$env:LOCALAPPDATA\hermes\bin\hermes.exe",
              "$env:LOCALAPPDATA\hermes\bin\hermes.cmd"
            ) `
            -SearchRoots @("$env:LOCALAPPDATA\hermes\bin") `
            -ExecutableNames @("hermes.exe", "hermes.cmd")

          $openclawTarget = Resolve-AppTarget `
            -CandidatePaths @("$runnerRoamingNpm\openclaw.cmd") `
            -SearchRoots @($runnerRoamingNpm) `
            -ExecutableNames @("openclaw.cmd", "openclaw.ps1")

          $openCodeTarget = Resolve-AppTarget `
            -CandidatePaths @("$runnerRoamingNpm\opencode.cmd") `
            -SearchRoots @($runnerRoamingNpm) `
            -ExecutableNames @("opencode.cmd", "opencode.ps1")

          $omniRouteTarget = Resolve-AppTarget `
            -CandidatePaths @("$runnerRoamingNpm\omniroute.cmd") `
            -SearchRoots @($runnerRoamingNpm) `
            -ExecutableNames @("omniroute.cmd", "omniroute.ps1")

          $artCraftSid = (Get-LocalUser -Name $env:RDP_USER -ErrorAction Stop).SID.Value
          $artCraftRdpProfile = (Get-ItemProperty -LiteralPath "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$artCraftSid" -ErrorAction SilentlyContinue).ProfileImagePath
          if (-not $artCraftRdpProfile) { $artCraftRdpProfile = "$env:SystemDrive\Users\$env:RDP_USER" }
          $artCraftTarget = $env:ARTCRAFT_EXE
          if (-not $artCraftTarget -or -not (Test-Path $artCraftTarget)) {
            $artCraftTarget = Resolve-AppTarget `
              -CandidatePaths @("$artCraftRdpProfile\AppData\Local\Programs\ArtCraft Launcher\artcraft-launcher.exe", "$env:SystemDrive\Users\$env:RDP_USER\AppData\Local\Programs\ArtCraft Launcher\artcraft-launcher.exe") `
              -SearchRoots @("$artCraftRdpProfile\AppData\Local\Programs\ArtCraft Launcher") `
              -ExecutableNames @('artcraft-launcher.exe')
          }

          New-AppShortcut -Name "Google Chrome" -TargetPath $chromeTarget
          New-AppShortcut -Name "WinRAR" -TargetPath $winrarTarget

          if ($wantedVSCode) {
            New-AppShortcut -Name "Visual Studio Code" -TargetPath $vscodeTarget
          } else {
            Write-Host "Skipping VS Code shortcut because ide_choice=$ideChoice"
          }

          if ($wantedAntigravity) {
            if (Test-Path $antigravityLauncher) {
              $antigravityIcon = if ($antigravityIdeTarget -and (Test-Path $antigravityIdeTarget)) { $antigravityIdeTarget } else { "$env:SystemRoot\System32\shell32.dll,2" }
              New-AppShortcut -Name "Antigravity IDE" -TargetPath "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -Arguments "-NoProfile -ExecutionPolicy Bypass -File `"$antigravityLauncher`"" -IconLocation $antigravityIcon
            } else {
              New-AppShortcut -Name "Antigravity IDE" -TargetPath $antigravityIdeTarget
            }
          } else {
            Write-Host "Skipping Antigravity shortcut because ide_choice=$ideChoice"
          }

          if ($nodeTarget) {
