name: "macOS Remote noVNC"

on:
  workflow_dispatch:
    inputs:
      keepalive_minutes:
        description: "Durasi keep-alive dalam menit. Maksimum aman GitHub-hosted runner: 350 menit."
        required: true
        default: "330"
      runner_label:
        description: "Runner macOS. Default stabil: macos-15. Bisa diganti macos-latest jika diperlukan."
        required: true
        default: "macos-15"

permissions:
  contents: read

concurrency:
  group: macos-remote-novnc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-remote:
    name: "macOS noVNC"
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 355

    env:
      REMOTE_USER: remoteadmin
      KEEPALIVE_MINUTES: ${{ inputs.keepalive_minutes }}
      TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY || secrets.TAILSCALE_AUTH_KEY }}
      NOVNC_VERSION: v1.5.0

    defaults:
      run:
        shell: bash

    steps:
      - name: "✅ Preflight + generate remote password"
        run: |
          set -Eeuo pipefail

          fail() {
            echo "::error::$1"
            exit 1
          }

          [[ "${RUNNER_OS:-}" == "macOS" ]] || fail "Workflow ini harus berjalan di runner macOS."
          [[ -n "${TS_AUTHKEY:-}" ]] || fail "Secret TAILSCALE_AUTHKEY belum dibuat. Nama lama TAILSCALE_AUTH_KEY juga didukung."
          [[ "${KEEPALIVE_MINUTES}" =~ ^[0-9]+$ ]] || fail "keepalive_minutes harus angka."

          if (( KEEPALIVE_MINUTES < 5 || KEEPALIVE_MINUTES > 350 )); then
            fail "keepalive_minutes harus berada di rentang 5 sampai 350 menit."
          fi

          REMOTE_PASSWORD="$(python3 -c 'import secrets,string; alphabet=string.ascii_letters+string.digits; print("".join(secrets.choice(alphabet) for _ in range(16)))')"
          VNC_PASSWORD="${REMOTE_PASSWORD:0:8}"

          {
            echo "REMOTE_PASSWORD=${REMOTE_PASSWORD}"
            echo "VNC_PASSWORD=${VNC_PASSWORD}"
          } >> "${GITHUB_ENV}"

          echo "✅ Preflight OK"
          echo "✅ Remote password berhasil dibuat otomatis. Password akan muncul di step terakhir dan GitHub Step Summary."

      - name: "⚡ Optimize macOS runner"
        run: |
          set -Eeuo pipefail

          ok() { printf '  ✅ %s\n' "$*"; }
          warn() { printf '  ⚠️  %s\n' "$*"; }

          defaults write com.apple.universalaccess reduceTransparency -bool true 2>/dev/null || true
          defaults write com.apple.universalaccess reduceMotion -bool true 2>/dev/null || true
          defaults write NSGlobalDomain NSWindowResizeTime -float 0.001 2>/dev/null || true
          defaults write com.apple.dock autohide-delay -float 0 2>/dev/null || true
          defaults write NSGlobalDomain NSAppSleepDisabled -bool true 2>/dev/null || true
          ok "Animasi UI dikurangi"

          sudo mdutil -a -i off 2>/dev/null || warn "Spotlight tidak bisa dinonaktifkan; lanjut"
          sudo systemsetup -setsleep Never 2>/dev/null || true
          sudo systemsetup -setdisplaysleep Never 2>/dev/null || true
          ok "Sleep/display-sleep dinonaktifkan"

      - name: "🔐 Enable macOS Screen Sharing / VNC"
        run: |
          set -Eeuo pipefail

          ok() { printf '  ✅ %s\n' "$*"; }
          warn() { printf '  ⚠️  %s\n' "$*"; }
          err() { printf '  ❌ %s\n' "$*"; }
          step() { printf '\n▶ %s\n' "$*"; }

          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"
          [[ -x "$KICKSTART" ]] || { err "kickstart ARD tidak ditemukan"; exit 1; }

          step "Create/reset user: ${REMOTE_USER}"
          if id "${REMOTE_USER}" >/dev/null 2>&1; then
            sudo sysadminctl -resetPasswordFor "${REMOTE_USER}" -newPassword "${REMOTE_PASSWORD}" 2>/dev/null \
              && ok "Password user di-reset" \
              || warn "sysadminctl reset password gagal; lanjut"
          else
            sudo sysadminctl -addUser "${REMOTE_USER}" -fullName "Remote Admin" -password "${REMOTE_PASSWORD}" -admin 2>/dev/null \
              && ok "User dibuat" \
              || { err "Gagal membuat user ${REMOTE_USER}"; exit 1; }
          fi

          sudo dseditgroup -o edit -a "${REMOTE_USER}" -t user admin 2>/dev/null || true
          ok "User dipastikan berada di grup admin"

          step "Reset ARD/Screen Sharing"
          sudo "$KICKSTART" -deactivate -stop 2>/dev/null || true
          sudo launchctl bootout system /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true
          sudo launchctl disable system/com.apple.screensharing 2>/dev/null || true
          sleep 2

          step "Write VNC legacy password"
          VNC_HEX="$(python3 -c 'import os; pw=(os.environ["VNC_PASSWORD"]+"\0"*8)[:8]; key=[23,82,107,6,35,78,88,7]; enc=[int(f"{ord(ch):08b}"[::-1],2)^key[i] for i,ch in enumerate(pw)]; print(bytes(enc).hex())')"

          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCLegacyConnectionsAllowed -bool true
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCPassword -data "${VNC_HEX}"
          ok "Password VNC legacy disimpan"

          step "Activate Apple Remote Desktop"
          sudo "$KICKSTART" \
            -activate \
            -configure -access -on \
            -configure -allowAccessFor -specifiedUsers \
            -configure -users "${REMOTE_USER}" \
            -configure -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "${VNC_PASSWORD}" \
            -restart -agent -menu 2>/dev/null \
            && ok "ARD aktif" \
            || warn "kickstart ARD mengembalikan warning; mencoba launchctl fallback"

          sudo launchctl enable system/com.apple.screensharing 2>/dev/null || true
          sudo launchctl bootstrap system /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true
          sudo launchctl kickstart -k system/com.apple.screensharing 2>/dev/null || true

          step "Wait VNC port 5900"
          for attempt in {1..30}; do
            if nc -z 127.0.0.1 5900 2>/dev/null; then
              ok "VNC listening di 127.0.0.1:5900 pada attempt ${attempt}/30"
              exit 0
            fi
            sleep 2
          done

          err "VNC belum listen setelah 60 detik"
          sudo lsof -nP -iTCP:5900 -sTCP:LISTEN 2>/dev/null || true
          sudo launchctl print system/com.apple.screensharing 2>/dev/null || true
          exit 1

      - name: "🖼️ Prepare desktop session"
        continue-on-error: true
        run: |
          set -Eeuo pipefail

          ok() { printf '  ✅ %s\n' "$*"; }
          warn() { printf '  ⚠️  %s\n' "$*"; }

          open -a Finder 2>/dev/null || true
          open -a Terminal 2>/dev/null || true
          sleep 2

          for wp in \
            "/System/Library/Desktop Pictures/Sonoma.heic" \
            "/System/Library/Desktop Pictures/Monterey Graphic.heic" \
            "/System/Library/Desktop Pictures/Big Sur.heic" \
            "/System/Library/Desktop Pictures/Catalina.heic"; do
            if [[ -f "$wp" ]]; then
              osascript -e "tell application \"System Events\" to set picture of every desktop to \"$wp\"" 2>/dev/null \
                && ok "Wallpaper: $(basename "$wp")" \
                || warn "Gagal set wallpaper: $(basename "$wp")"
              break
            fi
          done

          if screencapture -x /tmp/display_test.png 2>/dev/null; then
            bytes="$(wc -c < /tmp/display_test.png | tr -d ' ')"
            ok "Display aktif; screenshot ${bytes} bytes"
          else
            warn "Runner kemungkinan headless; VNC tetap dicoba"
          fi

      - name: "📦 Install websockify + noVNC"
        run: |
          set -Eeuo pipefail

          ok() { printf '  ✅ %s\n' "$*"; }
          step() { printf '\n▶ %s\n' "$*"; }

          step "Install websockify"
          python3 -m pip install --upgrade pip -q
          python3 -m pip install websockify -q
          python3 -c "import websockify"
          ok "websockify siap"

          step "Download noVNC ${NOVNC_VERSION}"
          curl -fsSL "https://github.com/novnc/noVNC/archive/refs/tags/${NOVNC_VERSION}.tar.gz" -o /tmp/novnc.tar.gz
          sudo rm -rf /opt/novnc
          sudo mkdir -p /opt/novnc
          sudo tar xzf /tmp/novnc.tar.gz -C /opt/novnc --strip-components=1
          sudo ln -sf /opt/novnc/vnc.html /opt/novnc/index.html
          rm -f /tmp/novnc.tar.gz
          ok "noVNC terpasang di /opt/novnc"

      - name: "🔒 Generate local TLS certificate"
        run: |
          set -Eeuo pipefail

          openssl req -x509 -nodes -days 2 -newkey rsa:2048 \
            -keyout /tmp/novnc.key \
            -out /tmp/novnc.crt \
            -subj "/C=ID/ST=Jakarta/L=Jakarta/O=GitHubRunner/CN=localhost" \
            >/dev/null 2>&1
          chmod 600 /tmp/novnc.key /tmp/novnc.crt
          echo "✅ Self-signed TLS certificate dibuat"

      - name: "🌐 Start websockify HTTPS proxy"
        run: |
          set -Eeuo pipefail

          ok() { printf '  ✅ %s\n' "$*"; }
          err() { printf '  ❌ %s\n' "$*"; }

          rm -f /tmp/websockify.pid /tmp/websockify.log
          python3 -m websockify \
            --web=/opt/novnc \
            --cert=/tmp/novnc.crt \
            --key=/tmp/novnc.key \
            --ssl-only \
            --heartbeat=30 \
            --log-file=/tmp/websockify.log \
            --pid-file=/tmp/websockify.pid \
            0.0.0.0:6080 127.0.0.1:5900 \
            --daemon

          sleep 4
          if nc -z 127.0.0.1 6080 2>/dev/null; then
            ok "websockify listen di 0.0.0.0:6080"
          else
            err "websockify gagal start"
            cat /tmp/websockify.log 2>/dev/null || true
            exit 1
          fi

      - name: "🔗 Connect Tailscale"
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ env.TS_AUTHKEY }}
          hostname: mac-runner-${{ github.run_id }}
          version: latest
          timeout: 3m
          retry: 3

      - name: "🧪 Verify services"
        run: |
          set -Eeuo pipefail

          fail() { echo "::error::$1"; exit 1; }

          nc -z 127.0.0.1 5900 || fail "VNC port 5900 tidak aktif"
          nc -z 127.0.0.1 6080 || fail "noVNC/websockify port 6080 tidak aktif"
          command -v tailscale >/dev/null || fail "tailscale CLI tidak ditemukan"

          TS_IP="$(tailscale ip -4 | head -n 1 | tr -d '[:space:]')"
          [[ -n "${TS_IP}" ]] || fail "Tidak bisa mendapatkan IPv4 Tailscale"
          echo "TAILSCALE_IP=${TS_IP}" >> "${GITHUB_ENV}"
          echo "✅ Tailscale IP: ${TS_IP}"

      - name: "📡 Access info & keep alive"
        run: |
          set -Eeuo pipefail

          url="https://${TAILSCALE_IP}:6080/vnc.html"

          {
            echo "## macOS Remote noVNC Ready"
            echo ""
            echo "- URL: ${url}"
            echo "- macOS username: ${REMOTE_USER}"
            echo "- macOS password: \`${REMOTE_PASSWORD}\`"
            echo "- VNC password: \`${VNC_PASSWORD}\`"
            echo "- Catatan: browser akan menampilkan warning karena TLS self-signed. Pilih Advanced → Proceed."
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "============================================================"
          echo "macOS Remote noVNC Ready"
          echo "URL      : ${url}"
          echo "Username : ${REMOTE_USER}"
          echo "Password : ${REMOTE_PASSWORD}"
          echo "VNC Pass : ${VNC_PASSWORD}"
          echo "============================================================"

          end=$((SECONDS + KEEPALIVE_MINUTES * 60))
          tick=0
          while (( SECONDS < end )); do
            tick=$((tick + 1))
            ts="$(date '+%H:%M:%S')"

            if ! nc -z 127.0.0.1 6080 2>/dev/null; then
              echo "⚠️  [${ts}] websockify down; restart"
              python3 -m websockify \
                --web=/opt/novnc \
                --cert=/tmp/novnc.crt \
                --key=/tmp/novnc.key \
                --ssl-only \
                --heartbeat=30 \
                --log-file=/tmp/websockify.log \
                --pid-file=/tmp/websockify.pid \
                0.0.0.0:6080 127.0.0.1:5900 \
                --daemon || true
              sleep 4
            fi

            if ! nc -z 127.0.0.1 5900 2>/dev/null; then
              echo "⚠️  [${ts}] VNC down; restart screensharing"
              sudo launchctl kickstart -k system/com.apple.screensharing 2>/dev/null || true
              sleep 4
            fi

            echo "✅ [${ts}] tick #${tick} — ${url}"
            sleep 300
          done

          echo "✅ Keep-alive selesai setelah ${KEEPALIVE_MINUTES} menit."
