name: "🖥️ Remote - macOS (noVNC)"

on:
  workflow_dispatch:

jobs:
  macos-remote:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      # STREAMING_CHUNK: Optimizing macOS...
      # ══════════════════════════════════════════════════════════
      # 1. OPTIMIZE
      # ══════════════════════════════════════════════════════════
      - name: "⚡ Optimize macOS"
        run: |
          C='\033[0;36m'; G='\033[0;32m'; B='\033[1m'; R='\033[0m'
          _ok() { echo -e "  ${G}✓${R} $*"; }
          echo -e "\n${B}${C}┌────────────────────────────────────────┐${R}"
          echo -e "${B}${C}│  ⚡  Optimizing macOS Runner           │${R}"
          echo -e "${B}${C}└────────────────────────────────────────┘${R}"

          defaults write com.apple.universalaccess reduceTransparency -bool true 2>/dev/null || true
          defaults write com.apple.universalaccess reduceMotion        -bool true 2>/dev/null || true
          defaults write NSGlobalDomain NSWindowResizeTime             -float 0.001 2>/dev/null || true
          defaults write com.apple.dock autohide-delay                 -float 0 2>/dev/null || true
          defaults write NSGlobalDomain NSAppSleepDisabled             -bool true 2>/dev/null || true
          _ok "UI animations & transparency reduced"

          sudo mdutil -a -i off 2>/dev/null || true
          _ok "Spotlight indexing disabled"

          sudo systemsetup -setsleep Never        2>/dev/null || true
          sudo systemsetup -setdisplaysleep Never 2>/dev/null || true
          _ok "Sleep / display-sleep disabled"
          echo -e "\n  ${G}${B}Runner ready!${R}\n"

      # STREAMING_CHUNK: Configuring VNC...
      # ══════════════════════════════════════════════════════════
      # 2. VNC / SCREEN SHARING
      # ══════════════════════════════════════════════════════════
      - name: "🔐 Enable VNC / Screen Sharing"
        run: |
          set -e
          RED='\033[0;31m'; GRN='\033[0;32m'; YLW='\033[1;33m'
          CYN='\033[0;36m'; BLD='\033[1m';    RST='\033[0m'
          _ok()   { echo -e "  ${GRN}✓${RST} $*"; }
          _warn() { echo -e "  ${YLW}⚠${RST} $*"; }
          _err()  { echo -e "  ${RED}✗${RST} $*"; }
          _step() { echo -e "\n  ${BLD}${CYN}▸ $*${RST}"; }

          echo -e "\n${BLD}${CYN}┌────────────────────────────────────────┐${RST}"
          echo -e "${BLD}${CYN}│  🔐  VNC / Screen Sharing Setup        │${RST}"
          echo -e "${BLD}${CYN}└────────────────────────────────────────┘${RST}"

          # Generate credentials
          _step "Generating credentials"
          VNC_PASS="$(LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 8)"
          REMOTE_USER="remoteadmin"
          printf 'VNC_PASSWORD=%s\nREMOTE_USER=%s\nREMOTE_PASSWORD=%s\n' \
            "$VNC_PASS" "$REMOTE_USER" "$VNC_PASS" >> "$GITHUB_ENV"
          _ok "Credentials generated & stored in GITHUB_ENV"

          # Create / reset macOS user (Fixed: Removed non-existent 'timeout' command)
          _step "Provisioning macOS user: $REMOTE_USER"
          if ! id "$REMOTE_USER" &>/dev/null; then
            sudo sysadminctl \
              -addUser "$REMOTE_USER" -fullName "Remote Admin" \
              -password "$VNC_PASS" -admin 2>/dev/null \
              && _ok "User created" || _warn "sysadminctl failed — continuing"
          else
            sudo sysadminctl \
              -resetPasswordFor "$REMOTE_USER" -newPassword "$VNC_PASS" 2>/dev/null \
              && _ok "User password reset" || _warn "sysadminctl failed — continuing"
          fi
          sudo dseditgroup -o edit -a "$REMOTE_USER" -t user admin 2>/dev/null || true
          _ok "User added to admin group"

          # Stop old services (Fixed: Removed non-existent 'timeout' command)
          _step "Stopping existing VNC / ARD services"
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -deactivate -stop 2>/dev/null \
            && _ok "ARD stopped" || _warn "ARD stop failed — skipping"
            
          sudo launchctl disable system/com.apple.screensharing 2>/dev/null \
            || sudo launchctl unload -w \
                 /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null \
            || true
          _ok "Screen sharing disabled (clean slate)"
          sleep 2

          # Write VNC password directly to plist
          _step "Writing VNC password to system preferences"
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement \
            VNCLegacyConnectionsAllowed -bool YES
          export _VNCPW="$VNC_PASS"
          VNC_HEX=$(python3 -c "import os; pw=(os.environ['_VNCPW']+chr(0)*8)[:8]; key=[23,82,107,6,35,78,88,7]; enc=[int(f'{ord(c):08b}'[::-1],2)^key[i] for i,c in enumerate(pw)]; print(bytes(enc).hex())")
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement \
            VNCPassword -data "$VNC_HEX"
          _ok "VNC password written to preferences plist"

          # Activate ARD (Fixed: Removed non-existent 'timeout' command)
          _step "Activating Apple Remote Desktop"
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate \
            -configure -access -on \
            -configure -allowAccessFor -specifiedUsers \
            -configure -users "$REMOTE_USER" \
            -configure -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "$VNC_PASS" \
            -restart -agent -menu 2>/dev/null \
            && _ok "ARD activated" || _warn "ARD kickstart failed — using launchctl fallback"

          # Enable screensharing via launchctl
          _step "Starting Screen Sharing service"
          sudo launchctl enable system/com.apple.screensharing 2>/dev/null \
            || sudo launchctl load -w \
                 /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null \
            || true
          sudo launchctl kickstart -k system/com.apple.screensharing 2>/dev/null || true
          _ok "Screen sharing service started"
          sleep 6

          # Wait for port 5900
          _step "Waiting for VNC on :5900"
          VNC_OK=false
          for i in $(seq 1 20); do
            if nc -z localhost 5900 2>/dev/null; then
              VNC_OK=true
              _ok "VNC listening on :5900  (attempt $i / 20)"
              break
            fi
            printf "  ${YLW}...${RST} attempt %2d / 20\r" "$i"
            sleep 3
          done
          if [ "$VNC_OK" = false ]; then
            _err "VNC not listening after 60 s"
            sudo lsof -iTCP:5900 -sTCP:LISTEN 2>/dev/null || true
            sudo launchctl list | grep -i screen 2>/dev/null || true
            exit 1
          fi
          echo -e "\n  ${GRN}${BLD}✔ VNC ready!${RST}\n"

      # STREAMING_CHUNK: Populating Desktop...
      # ══════════════════════════════════════════════════════════
      # 3. DESKTOP
      # ══════════════════════════════════════════════════════════
      - name: "🖼️ Populate Desktop"
        run: |
          GRN='\033[0;32m'; YLW='\033[1;33m'; RST='\033[0m'
          _ok()   { echo -e "  ${GRN}✓${RST} $*"; }
          _warn() { echo -e "  ${YLW}⚠${RST} $*"; }

          open -a Finder   2>/dev/null || true
          open -a Terminal 2>/dev/null || true
          sleep 3
          _ok "Finder & Terminal launched"

          for wp in \
            "/System/Library/Desktop Pictures/Sonoma.heic" \
            "/System/Library/Desktop Pictures/Monterey Graphic.heic" \
            "/System/Library/Desktop Pictures/Big Sur.heic" \
            "/System/Library/Desktop Pictures/Catalina.heic"
          do
            if [ -f "$wp" ]; then
              osascript -e "tell application \"System Events\" to set picture of every desktop to \"$wp\"" \
                2>/dev/null && _ok "Wallpaper: $(basename "$wp")" && break \
                || _warn "Wallpaper script failed for $(basename "$wp")"
            fi
          done

          if screencapture -x /tmp/display_test.png 2>/dev/null; then
            SZ=$(wc -c < /tmp/display_test.png | tr -d ' ')
            _ok "Display active — screenshot ${SZ} bytes"
          else
            _warn "Headless mode — no display"
          fi

      # STREAMING_CHUNK: Installing Websockify & noVNC...
      # ══════════════════════════════════════════════════════════
      # 4. WEBSOCKIFY + NOVNC
      # ══════════════════════════════════════════════════════════
      - name: "📦 Install websockify + noVNC"
        run: |
          GRN='\033[0;32m'; CYN='\033[0;36m'; BLD='\033[1m'; RST='\033[0m'
          _ok()   { echo -e "  ${GRN}✓${RST} $*"; }
          _step() { echo -e "\n  ${BLD}${CYN}▸ $*${RST}"; }

          _step "Installing websockify"
          python3 -m pip install websockify --break-system-packages -q 2>/dev/null \
            || python3 -m pip install websockify --user -q \
            || python3 -m pip install websockify -q
          python3 -c "import websockify" && _ok "websockify ready"

          _step "Downloading noVNC v1.5.0"
          curl -fsSL \
            https://github.com/novnc/noVNC/archive/refs/tags/v1.5.0.tar.gz \
            -o /tmp/novnc.tar.gz
          sudo mkdir -p /opt/novnc
          sudo tar xzf /tmp/novnc.tar.gz -C /opt/novnc --strip-components=1
          rm -f /tmp/novnc.tar.gz
          sudo ln -sf /opt/novnc/vnc.html /opt/novnc/index.html
          _ok "noVNC v1.5.0 installed to /opt/novnc"

      # STREAMING_CHUNK: Setting up SSL...
      # ══════════════════════════════════════════════════════════
      # 5. SSL
      # ══════════════════════════════════════════════════════════
      - name: "🔒 Generate SSL Certificate"
        run: |
          GRN='\033[0;32m'; RST='\033[0m'
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout /tmp/novnc.key -out /tmp/novnc.crt \
            -subj "/C=ID/ST=Jakarta/L=Jakarta/O=Runner/CN=localhost" \
            2>/dev/null
          echo -e "  ${GRN}✓${RST} Self-signed SSL certificate generated"

      # STREAMING_CHUNK: Starting websockify server...
      # ══════════════════════════════════════════════════════════
      # 6. WEBSOCKIFY DAEMON
      # ══════════════════════════════════════════════════════════
      - name: "🌐 Start websockify"
        run: |
          RED='\033[0;31m'; GRN='\033[0;32m'; RST='\033[0m'
          _ok()  { echo -e "  ${GRN}✓${RST} $*"; }
          _err() { echo -e "  ${RED}✗${RST} $*"; }

          python3 -m websockify \
            --web=/opt/novnc \
            --cert=/tmp/novnc.crt \
            --key=/tmp/novnc.key \
            --heartbeat=30 \
            --log-file=/tmp/websockify.log \
            --pid-file=/tmp/websockify.pid \
            6080 localhost:5900 \
            --daemon
          sleep 4

          if nc -z localhost 6080 2>/dev/null; then
            _ok "websockify running on :6080 (HTTPS / WSS)"
          else
            _err "websockify failed to start"
            cat /tmp/websockify.log 2>/dev/null || true
            exit 1
          fi
          echo "WEBSOCKIFY_PID=$(cat /tmp/websockify.pid 2>/dev/null || echo '')" >> "$GITHUB_ENV"

      # STREAMING_CHUNK: Configuring Tailscale network...
      # ══════════════════════════════════════════════════════════
      # 7. TAILSCALE
      # ══════════════════════════════════════════════════════════
      - name: "🔗 Install & Connect Tailscale"
        run: |
          RED='\033[0;31m'; GRN='\033[0;32m'; YLW='\033[1;33m'
          CYN='\033[0;36m'; BLD='\033[1m';    RST='\033[0m'
          _ok()   { echo -e "  ${GRN}✓${RST} $*"; }
          _warn() { echo -e "  ${YLW}⚠${RST} $*"; }
          _err()  { echo -e "  ${RED}✗${RST} $*"; }
          _step() { echo -e "\n  ${BLD}${CYN}▸ $*${RST}"; }

          _step "Installing Tailscale"
          curl -fsSL https://tailscale.com/install.sh | sh -s -- -q 2>/dev/null \
            || curl -fsSL https://tailscale.com/install.sh | sh
          _ok "Tailscale installed"

          _step "Starting tailscaled"
          sudo tailscaled \
            --state=/tmp/tailscale.state \
            --tun=userspace-networking \
            >> /tmp/tailscaled.log 2>&1 &
          sleep 6
          if ! pgrep tailscaled &>/dev/null; then
            _err "tailscaled failed to start"
            cat /tmp/tailscaled.log || true
            exit 1
          fi
          _ok "tailscaled running (PID: $(pgrep tailscaled | head -1))"

          _step "Connecting to Tailscale network"
          sudo tailscale up \
            --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" \
            --hostname="mac-runner-$GITHUB_RUN_ID" \
            --timeout=60s
          _ok "Connected — hostname: mac-runner-$GITHUB_RUN_ID"

          _step "Resolving Tailscale IP"
          TS_IP=""; ATTEMPT=0
          while [ -z "$TS_IP" ] && [ "$ATTEMPT" -lt 20 ]; do
            sleep 4
            TS_IP="$(sudo tailscale ip -4 2>/dev/null || true)"
            ATTEMPT=$((ATTEMPT + 1))
            [ -z "$TS_IP" ] && printf "  ${YLW}...${RST} attempt %2d / 20\r" "$ATTEMPT"
          done
          if [ -z "$TS_IP" ]; then
            _err "Failed to get Tailscale IP after $ATTEMPT attempts"
            sudo tailscale status || true
            exit 1
          fi
          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"
          _ok "Tailscale IP: ${BLD}$TS_IP${RST}"

      # STREAMING_CHUNK: Finalizing Keep-Alive Output...
      # ══════════════════════════════════════════════════════════
      # 8. ACCESS INFO + KEEP-ALIVE
      # ══════════════════════════════════════════════════════════
      - name: "📡 Access Info & Keep Alive"
        run: |
          RED='\033[0;31m'; GRN='\033[0;32m'; YLW='\033[1;33m'
          CYN='\033[0;36m'; MAG='\033[0;35m'; BLD='\033[1m'
          DIM='\033[2m';    RST='\033[0m'

          echo -e "\n"
          echo -e "${BLD}${CYN}  ╔══════════════════════════════════════════════════╗${RST}"
          echo -e "${BLD}${CYN}  ║   🖥️  macOS Remote — noVNC Ready                 ║${RST}"
          echo -e "${BLD}${CYN}  ╠══════════════════════════════════════════════════╣${RST}"
          printf "${BLD}${CYN}  ║${RST}  ${BLD}URL      ${RST}  https://%s:6080/vnc.html\n" "$TAILSCALE_IP"
          printf "${BLD}${CYN}  ║${RST}  ${BLD}VNC Pass ${RST}  ${MAG}${BLD}%s${RST}\n"    "$VNC_PASSWORD"
          printf "${BLD}${CYN}  ║${RST}  ${BLD}Username ${RST}  %s\n"                       "$REMOTE_USER"
          printf "${BLD}${CYN}  ║${RST}  ${BLD}Password ${RST}  ${MAG}${BLD}%s${RST}\n"    "$REMOTE_PASSWORD"
          echo -e "${BLD}${CYN}  ╠══════════════════════════════════════════════════╣${RST}"
          echo -e "${BLD}${CYN}  ║${RST}  ${DIM}1. Buka URL di browser${RST}"
          echo -e "${BLD}${CYN}  ║${RST}  ${DIM}2. Klik Advanced → Proceed (abaikan SSL warning)${RST}"
          echo -e "${BLD}${CYN}  ║${RST}  ${DIM}3. Masukkan VNC Pass saat diminta${RST}"
          echo -e "${BLD}${CYN}  ║${RST}  ${DIM}4. Login macOS: Username + Password di atas${RST}"
          echo -e "${BLD}${CYN}  ╚══════════════════════════════════════════════════╝${RST}"
          echo

          TICK=0
          while true; do
            TICK=$((TICK + 1))
            TS="$(date '+%H:%M:%S')"
            STATUS="${GRN}●${RST}"

            if ! nc -z localhost 6080 2>/dev/null; then
              STATUS="${YLW}●${RST}"
              echo -e "  ${YLW}⚠${RST}  [$TS] websockify down — restarting..."
              python3 -m websockify \
                --web=/opt/novnc --cert=/tmp/novnc.crt --key=/tmp/novnc.key \
                --heartbeat=30 --pid-file=/tmp/websockify.pid \
                6080 localhost:5900 --daemon
              sleep 4
              nc -z localhost 6080 2>/dev/null \
                && echo -e "  ${GRN}✓${RST}  [$TS] websockify restarted" \
                || echo -e "  ${RED}✗${RST}  [$TS] websockify restart FAILED"
            fi

            if ! nc -z localhost 5900 2>/dev/null; then
              STATUS="${RED}●${RST}"
              echo -e "  ${YLW}⚠${RST}  [$TS] VNC down — restarting screensharing..."
              sudo launchctl kickstart -k system/com.apple.screensharing 2>/dev/null || true
              sleep 4
              nc -z localhost 5900 2>/dev/null \
                && echo -e "  ${GRN}✓${RST}  [$TS] VNC restarted" \
                || echo -e "  ${RED}✗${RST}  [$TS] VNC restart FAILED"
            fi

            echo -e "  ${STATUS} [$TS] tick #${TICK} — ${DIM}https://${TAILSCALE_IP}:6080/vnc.html${RST}"
            sleep 300
          done
