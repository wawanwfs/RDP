name: "🧪 Linux Workspace — Static Checks"

on:
  push:
    branches: [main]
    paths:
      - "linux/**"
      - ".github/workflows/linux-remote-workspace.yml"
      - ".github/workflows/linux-workspace-checks.yml"
  pull_request:
    paths:
      - "linux/**"
      - ".github/workflows/linux-remote-workspace.yml"
      - ".github/workflows/linux-workspace-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: "📦 Checkout"
        uses: actions/checkout@v7.0.1
      - name: "🐚 Validate Bash scripts"
        run: |
          set -euo pipefail
          for file in linux/*.sh; do
            bash -n "$file"
            echo "PASS syntax: $file"
          done
      - name: "🧪 Validate workflow, supported combinations and safety controls"
        run: |
          python3 -m pip install --disable-pip-version-check --quiet 'PyYAML==6.0.3'
          python3 - <<'PY'
          import pathlib, yaml
          workflow = pathlib.Path(".github/workflows/linux-remote-workspace.yml")
          data = yaml.load(workflow.read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
          assert isinstance(data, dict) and isinstance(data.get("jobs"), dict)
          inputs = data["on"]["workflow_dispatch"]["inputs"]
          assert inputs["distro"]["options"] == ["debian", "ubuntu", "fedora", "arch", "alpine", "igos-nusantara"]
          assert inputs["desktop"]["options"] == ["kde", "xfce", "mate", "i3", "lxqt"]
          assert inputs["distro"]["default"] == "ubuntu"
          assert inputs["desktop"]["default"] == "kde"
          assert inputs["duration_hours"]["options"] == ["1", "3", "6"]
          assert (len(inputs["distro"]["options"]) - 1) * (len(inputs["desktop"]["options"]) - 1) + 1 == 21
          assert inputs["transport"]["default"] == "auto"
          assert inputs["remote_access"]["options"] == ["rdp", "novnc", "both"]
          assert inputs["remote_access"]["default"] == "rdp"
          assert inputs["hostname_mode"]["options"] == ["same_each_run", "unique_each_run"]
          assert inputs["hostname_mode"]["default"] == "same_each_run"
          assert inputs["rdp_password_mode"]["options"] == ["same_from_secret", "random_each_run"]
          assert inputs["vnc_password_mode"]["options"] == ["same_from_secret", "random_each_run"]
          assert inputs["rdp_username"]["default"] == "RDP"
          assert inputs["tailscale_hostname"]["default"] == "rdp-runner"
          assert inputs["web_username"]["default"] == "wfs"
          assert len(inputs) <= 25
          job = data["jobs"]["linux-remote-workspace"]
          assert job["runs-on"] == "ubuntu-24.04"
          assert job["timeout-minutes"] == "360"
          text = workflow.read_text(encoding="utf-8")
          runtime = pathlib.Path("linux/workspace.sh").read_text(encoding="utf-8")
          for required in (
              "secrets.TAILSCALE_AUTH_KEY", "secrets.RDP_PASSWORD", "secrets.VNC_PASSWORD",
              "bash linux/workspace.sh keepalive", "if: always()",
              "tailscale/github-action@v4",
          ):
              assert required in text, required
          for required in (
              "127.0.0.1:13001:3001", "127.0.0.1:13000:3000",
              "FILE__PASSWORD=/run/secrets/web_password",
              "SELKIES_ENABLE_RESIZE=true",
              "127.0.0.1:13389:3389",
              "hmac.new(",
              "start_tailnet_forwarder",
              "TCP-LISTEN:$public_port,bind=$ip",
          ):
              assert required in runtime, required
          assert "tailscale funnel" not in runtime.lower()
          assert "cloudflared" not in runtime.lower()
          # tailscale/github-action already supplies its own routing flags.
          # Duplicated --accept-routes causes tailscale up to fail.
          ts_steps = [s for s in job["steps"] if s.get("uses", "").startswith("tailscale/github-action@")]
          assert len(ts_steps) == 1, "Expected exactly one Tailscale join action"
          assert "--accept-routes" not in ts_steps[0].get("with", {}).get("args", "")
          assert "--accept-dns" not in ts_steps[0].get("with", {}).get("args", "")
          assert pathlib.Path("linux/start-igos.sh").is_file()
          igos = pathlib.Path("linux/start-igos.sh").read_text(encoding="utf-8")
          assert "ign26-bayu-beta6.iso" in igos and "qemu-system-x86_64" in igos
          assert "127.0.0.1:1" in igos and "wfs-igos-viewer" in igos
          assert "bash linux/start-igos.sh" in text
          assert "remote_access=rdp" in runtime
          assert "ubuntu-xfce" in runtime
          assert pathlib.Path("linux/setup-rdp.sh").is_file()
          assert pathlib.Path("linux/install-metatrader.sh").is_file()
          trading = pathlib.Path("linux/install-metatrader.sh").read_text(encoding="utf-8")
          assert "wineboot -u" in trading and "terminal64.exe" in trading
          assert "terminal.exe" in trading and "wfs-$app.desktop" in trading
          assert "download.mql5.com/cdn/web/metaquotes.software.corp/" in trading
          assert "bash linux/install-metatrader.sh" in text
          assert "WFS_METATRADER_STEP_OUTCOME" in text
          assert "Wine/Windows terminal; no native Linux package" not in pathlib.Path("linux/install-apps.sh").read_text(encoding="utf-8")
          xrdp_setup = pathlib.Path("linux/setup-rdp.sh").read_text(encoding="utf-8")
          assert "pamtester xrdp-sesman" in xrdp_setup
          assert "getent passwd" in xrdp_setup
          assert "id \"$username\"" in xrdp_setup
          assert "xfdesktop4 xfwm4" in xrdp_setup
          assert "wfs-xrdp-xfce-session" in xrdp_setup
          assert "dbus-run-session -- xfce4-session" in xrdp_setup
          assert "dbus-run-session -- startplasma-x11" in xrdp_setup
          assert "plasma-session-x11" in xrdp_setup
          chrome_source = pathlib.Path("linux/install-chrome.sh").read_text(encoding="utf-8")
          assert "hlkenndednhfkekhgcdicdfddnkalmdm" in chrome_source
          assert "fdpohaocaechififmbbbbbknoalclacl" in chrome_source
          assert "ExtensionInstallForcelist" in chrome_source
          assert "bash linux/install-chrome.sh" in text
          assert pathlib.Path("linux/install-antigravity.sh").is_file()
          assert pathlib.Path("linux/install-hermes.sh").is_file()
          apps_source = pathlib.Path("linux/install-apps.sh").read_text(encoding="utf-8")
          assert "ensure_node()" in apps_source and "--reinstall nodejs" in apps_source
          assert "install-antigravity.sh" in apps_source and "install-hermes.sh" in apps_source
          assert "failed_count" in apps_source
          assert "# 🐧 WFS Linux Remote Workspace Dashboard" in runtime
          assert "REMOTE WORKSPACE — READY" in runtime
          assert "Per-Application Results" in runtime
          assert "External-device graphical login" in runtime
          print("PASS: native Webtop KDE defaults, LXQt, legacy optional ISO, real MT4/MT5 installer, Tailscale private ports")
          PY

  smoke-ubuntu-kde-rdp:
    name: "Smoke default Ubuntu KDE Plasma XRDP GUI"
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      WFS_DISTRO: ubuntu
      WFS_DESKTOP: kde
      WFS_DURATION: "1"
      WFS_TRANSPORT: tailnet_tls_tcp
      WFS_APPS: none
      WFS_REMOTE: both
      WFS_HOSTNAME_BASE: rdp-runner
      WFS_HOSTNAME_MODE: same_each_run
      WFS_RDP_USERNAME: RDP
      WFS_WEB_USERNAME: wfs
      WFS_RDP_PASSWORD_MODE: same_from_secret
      WFS_VNC_PASSWORD_MODE: same_from_secret
    steps:
      - name: "📦 Checkout"
        uses: actions/checkout@v7.0.1
      - name: "🔐 Prepare CI-only login secrets"
        env:
          WFS_RDP_PASSWORD: "CI-UBUNTU-KDE-RDP-ONLY-2026"
          WFS_VNC_PASSWORD: "CI-UBUNTU-KDE-WEB-ONLY-2026"
        run: bash linux/workspace.sh prepare
      - name: "🖥️ Launch actual Ubuntu KDE Webtop and native XRDP Plasma"
        timeout-minutes: 20
        run: |
          bash linux/workspace.sh start
          bash linux/setup-rdp.sh
          test "$(docker inspect -f '{{.State.Running}}' wfs-linux-webtop)" = true
          docker exec -u 0 wfs-linux-webtop test "$(docker exec -u 0 wfs-linux-webtop cat /etc/wfs-rdp-desktop)" = kde
          docker exec -u 0 wfs-linux-webtop /bin/sh -c 'command -v startplasma-x11'
      - name: "🧪 Real RDP login must start KDE session (not silent Xfce fallback)"
        timeout-minutes: 7
        run: bash linux/test-rdp-gui.sh
      - name: "🧹 Always remove test desktop"
        if: always()
        run: bash linux/workspace.sh cleanup

  smoke-ubuntu-mt5:
    name: "Smoke actual MetaTrader 5 Wine install (Ubuntu)"
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WFS_DISTRO: ubuntu
      WFS_DESKTOP: xfce
      WFS_METATRADER: mt5
      WFS_DURATION: "1"
      WFS_TRANSPORT: tailnet_tls_tcp
      WFS_APPS: none
      WFS_REMOTE: novnc
      WFS_HOSTNAME_BASE: rdp-runner
      WFS_HOSTNAME_MODE: same_each_run
      WFS_RDP_USERNAME: RDP
      WFS_WEB_USERNAME: wfs
      WFS_RDP_PASSWORD_MODE: same_from_secret
      WFS_VNC_PASSWORD_MODE: same_from_secret
    steps:
      - name: "📦 Checkout"
        uses: actions/checkout@v7.0.1
      - name: "🔐 Prepare disposable test-only Webtop"
        env:
          WFS_VNC_PASSWORD: "CI-MT5-WINE-WEB-ONLY-2026"
        run: |
          bash linux/workspace.sh prepare
          bash linux/workspace.sh start
      - name: "📈 Install real MT5 terminal with Wine, no broker login"
        timeout-minutes: 24
        run: |
          bash linux/install-metatrader.sh
          grep -F "MetaTrader 5" "$RUNNER_TEMP/wfs-linux/trading-status.tsv" | grep -F "INSTALLED"
          docker exec -u 0 wfs-linux-webtop /bin/sh -c 'test -x /usr/local/bin/wfs-mt5 && test -f /usr/share/applications/wfs-mt5.desktop'
      - name: "🧹 Always cleanup CI workspace"
        if: always()
        run: bash linux/workspace.sh cleanup

  smoke-debian-xfce:
    name: "Smoke Debian Xfce desktop on localhost"
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      WFS_DISTRO: debian
      WFS_DESKTOP: xfce
      WFS_DURATION: "1"
      WFS_TRANSPORT: tailnet_tls_tcp
      WFS_APPS: none
      WFS_REMOTE: novnc
      WFS_HOSTNAME_BASE: rdp-runner
      WFS_HOSTNAME_MODE: same_each_run
      WFS_RDP_USERNAME: RDP
      WFS_WEB_USERNAME: wfs
      WFS_RDP_PASSWORD_MODE: same_from_secret
      WFS_VNC_PASSWORD_MODE: same_from_secret
    steps:
      - name: "📦 Checkout"
        uses: actions/checkout@v7.0.1

      - name: "🔐 Prepare dummy smoke-test-only authentication"
        env:
          WFS_VNC_PASSWORD: "CI-ONLY-LOCAL-TEST-PASSWORD-2026"
        run: |
          bash linux/workspace.sh prepare
          grep -Fx "WFS_HOSTNAME=rdp-runner" "$GITHUB_ENV"
          echo "PASS: same_each_run retains hostname rdp-runner without Run ID."

      - name: "🖥️ Launch actual Debian Xfce Webtop and test authenticated HTTPS"
        timeout-minutes: 15
        run: |
          bash linux/workspace.sh start
          test "$(docker inspect -f '{{.State.Running}}' wfs-linux-webtop)" = true
          docker port wfs-linux-webtop 3001 | grep -F '127.0.0.1:13001'
          docker port wfs-linux-webtop 3000 | grep -F '127.0.0.1:13000'
          echo 'Runtime smoke passed: Docker desktop is running; HTTPS returned 200 with password; all ports bind to loopback.'

      - name: "🧹 Always remove test desktop"
        if: always()
        run: bash linux/workspace.sh cleanup

  smoke-debian-both:
    name: "Smoke Debian native xrdp plus real Xfce GUI login"
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      WFS_DISTRO: debian
      WFS_DESKTOP: xfce
      WFS_DURATION: "1"
      WFS_TRANSPORT: tailnet_tls_tcp
      WFS_APPS: none
      WFS_REMOTE: both
      WFS_HOSTNAME_BASE: wfs-ci
      WFS_HOSTNAME_MODE: unique_each_run
      WFS_RDP_USERNAME: RDP
      WFS_WEB_USERNAME: wfs
      WFS_RDP_PASSWORD_MODE: random_each_run
      WFS_VNC_PASSWORD_MODE: same_from_secret
    steps:
      - name: "📦 Checkout"
        uses: actions/checkout@v7.0.1

      - name: "🔑 Prepare both password modes using test-only values"
        env:
          WFS_RDP_PASSWORD: "CI-RDP-ONLY-NOT-PRODUCTION-2026"
          WFS_VNC_PASSWORD: "CI-VNC-ONLY-NOT-PRODUCTION-2026"
        run: |
          bash linux/workspace.sh prepare
          test -s "$RUNNER_TEMP/wfs-linux/rdp-password"
          test -s "$RUNNER_TEMP/wfs-linux/web-password"
          test "$(wc -c < "$RUNNER_TEMP/wfs-linux/rdp-password")" -eq 24
          test "$(cat "$RUNNER_TEMP/wfs-linux/web-password")" = "CI-VNC-ONLY-NOT-PRODUCTION-2026"
          grep -Fx "WFS_HOSTNAME=wfs-ci-$GITHUB_RUN_ID" "$GITHUB_ENV"
          test "$WFS_RDP_USERNAME" = "RDP"
          ! grep -q "^WFS_RDP_USERNAME=rdp$" "$GITHUB_ENV"
          echo 'PASS: two independent passwords, deterministic per-run RDP mode, hostname and preserved web secret.'

      - name: "🖥️ Launch Webtop and native Xorg xrdp"
        timeout-minutes: 19
        run: |
          bash linux/workspace.sh start
          bash linux/setup-rdp.sh
          test "$(docker inspect -f '{{.State.Running}}' wfs-linux-webtop)" = true
          docker port wfs-linux-webtop 3389 | grep -F '127.0.0.1:13389'
          docker port wfs-linux-webtop 3001 | grep -F '127.0.0.1:13001'
          echo 'PASS: RDP handshake, authenticated web login and localhost-only mappings.'

      - name: "🖥️ Real FreeRDP GUI login and nonblack Xfce session check"
        timeout-minutes: 7
        run: bash linux/test-rdp-gui.sh

      - name: "🧹 Always remove both-mode test desktop"
        if: always()
        run: bash linux/workspace.sh cleanup

  smoke-tailnet-both:
    name: "Real Tailscale: browser and xrdp, without Serve permission"
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      WFS_DISTRO: debian
      WFS_DESKTOP: xfce
      WFS_DURATION: "1"
      WFS_TRANSPORT: auto
      WFS_APPS: none
      WFS_REMOTE: both
      WFS_HOSTNAME_BASE: wfs-ci-tailnet
      WFS_HOSTNAME_MODE: unique_each_run
      WFS_RDP_USERNAME: RDP
      WFS_WEB_USERNAME: webci
      WFS_RDP_PASSWORD_MODE: random_each_run
      WFS_VNC_PASSWORD_MODE: same_from_secret
    steps:
      - name: "📦 Checkout"
        uses: actions/checkout@v7.0.1
      - name: "🔐 Prepare dummy test-only credentials"
        env:
          WFS_RDP_PASSWORD: "CI-RDP-ONLY-NOT-PRODUCTION-2026"
          WFS_VNC_PASSWORD: "CI-WEB-ONLY-NOT-PRODUCTION-2026"
        run: bash linux/workspace.sh prepare
      - name: "🖥️ Start Debian Xfce and native xrdp"
        timeout-minutes: 12
        run: |
          bash linux/workspace.sh start
          bash linux/setup-rdp.sh
      - name: "🐾 Join private Tailscale tailnet"
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          hostname: ${{ env.WFS_HOSTNAME }}
          version: latest
      - name: "🌐 Publish private Tailscale web and RDP endpoints"
        timeout-minutes: 3
        run: bash linux/workspace.sh publish
      - name: "🔬 Verify TLS, RDP and cross-step listener survival"
        timeout-minutes: 1
        run: |
          set -euo pipefail
          test -n "$WFS_LINUX_IP"
          test -n "$WFS_LINUX_URL"
          test -n "$WFS_RDP_ADDRESS"
          echo "$WFS_LINUX_URL" | grep -Eq '^https://100\.[0-9]+\.[0-9]+\.[0-9]+:6082/'
          echo "$WFS_RDP_ADDRESS" | grep -Eq '^100\.[0-9]+\.[0-9]+\.[0-9]+:3389$'
          curl --silent --show-error --insecure --fail --max-time 15 \
            --user "webci:$(cat "$RUNNER_TEMP/wfs-linux/web-password")" "$WFS_LINUX_URL" >/dev/null
          python3 - <<'PY'
          import os, socket
          addr = os.environ["WFS_LINUX_IP"]
          for port in (6082, 3389):
              with socket.create_connection((addr, port), timeout=5):
                  print(f"PASS: private Tailscale {addr}:{port} reachable from independent step")
          PY
          ss -ltn | grep -F "$WFS_LINUX_IP:6082"
          ss -ltn | grep -F "$WFS_LINUX_IP:3389"
          echo 'PASS: Tailscale, browser TLS and xrdp, listeners persist between steps.'
      - name: "📊 Render dashboard and assert password-safe output"
        env:
          WFS_APPS_STEP_OUTCOME: skipped
          WFS_ARTCRAFT_STEP_OUTCOME: skipped
          WFS_ARTCRAFT_SELECTED: "false"
        run: |
          set -euo pipefail
          bash linux/workspace.sh summary
          grep -F "# 🐧 WFS Linux Remote Workspace Dashboard" "$GITHUB_STEP_SUMMARY"
          grep -F "Recommended Login" "$GITHUB_STEP_SUMMARY"
          grep -F "Connection & Runner Details" "$GITHUB_STEP_SUMMARY"
          grep -F "Selected Applications & Install Status" "$GITHUB_STEP_SUMMARY"
          grep -F "RDP address" "$GITHUB_STEP_SUMMARY"
          grep -F "webci" "$GITHUB_STEP_SUMMARY"
          grep -F "rdp" "$GITHUB_STEP_SUMMARY"
          if grep -Fq "CI-WEB-ONLY-NOT-PRODUCTION-2026" "$GITHUB_STEP_SUMMARY"; then
            echo "::error::Web password leaked into GitHub Summary"
            exit 1
          fi
          if grep -Fq "CI-RDP-ONLY-NOT-PRODUCTION-2026" "$GITHUB_STEP_SUMMARY"; then
            echo "::error::RDP password leaked into GitHub Summary"
            exit 1
          fi
          echo 'PASS: rendered dashboard has links, health, users and app status without credentials.'

      - name: "🧹 Always cleanup"
        if: always()
        run: bash linux/workspace.sh cleanup

  smoke-ubuntu-apps:
    name: "Ubuntu: NodeSource npm, 9Router, Codex and Developer bundle"
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      WFS_DISTRO: ubuntu
      WFS_DESKTOP: xfce
      WFS_DURATION: "1"
      WFS_TRANSPORT: tailnet_tls_tcp
      WFS_APPS: developer
      WFS_REMOTE: novnc
      WFS_HOSTNAME_BASE: wfs-apps-ci
      WFS_HOSTNAME_MODE: unique_each_run
      WFS_RDP_USERNAME: RDP
      WFS_WEB_USERNAME: wfs
      WFS_RDP_PASSWORD_MODE: same_from_secret
      WFS_VNC_PASSWORD_MODE: same_from_secret
      WFS_IDE: none
      WFS_EDITOR: none
      WFS_METATRADER: none
      WFS_ROUTER: 9router
      WFS_CODING_AGENT: codex
      WFS_AI_AGENT: none
    steps:
      - name: "📦 Checkout"
        uses: actions/checkout@v7.0.1
      - name: "🔐 Prepare test-only web login"
        env:
          WFS_VNC_PASSWORD: "CI-WEB-APP-TEST-NOT-PRODUCTION-2026"
        run: bash linux/workspace.sh prepare
      - name: "🐧 Launch actual Ubuntu desktop and selected apps"
        timeout-minutes: 19
        run: |
          set -euo pipefail
          bash linux/workspace.sh start
          bash linux/install-apps.sh
          bash linux/install-chrome.sh
          docker exec -u 0 wfs-linux-webtop /bin/sh -c 'command -v google-chrome-stable && grep -Fq "ExtensionInstallForcelist" /etc/opt/chrome/policies/managed/wfs-required-extensions.json'
          docker exec -u 0 wfs-linux-webtop /bin/sh -c 'command -v npm && command -v node && command -v 9router && command -v codex'
          grep -F $'9Router\tINSTALLED' "$RUNNER_TEMP/wfs-linux/apps-status.tsv"
          grep -F $'Codex CLI\tINSTALLED' "$RUNNER_TEMP/wfs-linux/apps-status.tsv"
          grep -F $'Node.js + npm\tINSTALLED' "$RUNNER_TEMP/wfs-linux/apps-status.tsv"
          ! grep -F $'\tFAILED' "$RUNNER_TEMP/wfs-linux/apps-status.tsv"
          echo 'PASS: Developer apps installed and verified, no npm dependency conflict.'
      - name: "🧹 Cleanup apps test container"
        if: always()
        run: bash linux/workspace.sh cleanup
