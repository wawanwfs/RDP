name: "🐧 WFS Linux Remote Workspace"
run-name: "🐧 Linux Workspace • ${{ inputs.remote_access }} • ${{ inputs.distro }} / ${{ inputs.desktop }} • ${{ inputs.duration_hours }}h"

on:
  workflow_dispatch:
    inputs:
      distro:
        description: "Distro Linux (container di Ubuntu runner)"
        required: true
        type: choice
        default: "debian"
        options:
          - "debian"
          - "ubuntu"
          - "fedora"
          - "arch"
          - "alpine"
      desktop:
        description: "Desktop: Xfce/MATE ringan, KDE mewah, i3 super ringan"
        required: true
        type: choice
        default: "xfce"
        options:
          - "xfce"
          - "mate"
          - "kde"
          - "i3"
      remote_access:
        description: "Remote seperti Windows: RDP, noVNC/web Selkies, atau keduanya"
        required: true
        type: choice
        default: "novnc"
        options:
          - "rdp"
          - "novnc"
          - "both"
      ide_choice:
        description: "IDE seperti Windows: VS Code / Antigravity / Both"
        required: true
        type: choice
        default: "none"
        options:
          - "none"
          - "antigravity"
          - "vscode"
          - "both"
      editor_choice:
        description: "Editor: CapCut / Shotcut / Both (CapCut Windows-only)"
        required: true
        type: choice
        default: "none"
        options:
          - "none"
          - "capcut"
          - "shotcut"
          - "both"
      metatrader_choice:
        description: "MetaTrader: MT4 / MT5 / Both (Wine & GUI setup may be required)"
        required: true
        type: choice
        default: "none"
        options:
          - "none"
          - "mt4"
          - "mt5"
          - "both"
      router_choice:
        description: "AI API Router: 9Router / OmniRoute / Both"
        required: true
        type: choice
        default: "none"
        options:
          - "none"
          - "9router"
          - "omniroute"
          - "both"
      coding_agent_choice:
        description: "Coding Agent: Codex / Claude / Both"
        required: true
        type: choice
        default: "none"
        options:
          - "none"
          - "codex"
          - "claude"
          - "both"
      ai_agent_choice:
        description: "AI Agent: Hermes / OpenClaw / OpenCode / Both / All"
        required: true
        type: choice
        default: "none"
        options:
          - "none"
          - "hermes"
          - "openclaw"
          - "opencode"
          - "both"
          - "all"
      tailscale_hostname:
        description: "Nama hostname Tailscale (bebas, default rdp-runner; unik jika mode unique_each_run)"
        type: string
        required: true
        default: "rdp-runner"
      hostname_mode:
        description: "Mode hostname: sama pada setiap run (default) atau unik per run"
        required: true
        type: choice
        default: "same_each_run"
        options:
          - "same_each_run"
          - "unique_each_run"
      rdp_username:
        description: "Username login xrdp Linux (case-sensitive; default RDP sama seperti Windows)"
        required: true
        type: string
        default: "RDP"
      web_username:
        description: "Username login desktop browser Selkies"
        required: true
        type: string
        default: "wfs"
      rdp_password_mode:
        description: "RDP password: tetap dari RDP_PASSWORD atau acak per run tanpa membocorkan log"
        required: true
        type: choice
        default: "same_from_secret"
        options:
          - "same_from_secret"
          - "random_each_run"
      vnc_password_mode:
        description: "Web password: tetap dari VNC_PASSWORD atau acak per run tanpa membocorkan log"
        required: true
        type: choice
        default: "same_from_secret"
        options:
          - "same_from_secret"
          - "random_each_run"
      duration_hours:
        description: "Durasi setelah desktop ready (batas total job 6 jam)"
        required: true
        type: choice
        default: "6"
        options:
          - "1"
          - "3"
          - "6"
      transport:
        description: "Auto: HTTPS 443 jika tersedia, fallback HTTPS self-signed over Tailscale TCP 6082"
        required: true
        type: choice
        default: "auto"
        options:
          - "auto"
          - "tailnet_https"
          - "tailnet_tls_tcp"
      apps_bundle:
        description: "Aplikasi opsional; none paling cepat dan ringan"
        required: true
        type: choice
        default: "none"
        options:
          - "none"
          - "developer"
          - "office"
          - "media"
          - "all"
      install_artcraft:
        description: "Coba install ArtCraft Launcher Linux stable terbaru (tidak didukung native di Alpine)"
        required: true
        type: boolean
        default: false
      install_hoptodesk:
        description: "Install HopToDesk remote desktop client"
        required: true
        type: boolean
        default: true
      enable_pulseaudio:
        description: "Install and start PulseAudio virtual output in the Linux container"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  linux-remote-workspace:
    name: "Linux GUI via Tailscale / RDP / Browser"
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      WFS_DISTRO: ${{ inputs.distro }}
      WFS_DESKTOP: ${{ inputs.desktop }}
      WFS_DURATION: ${{ inputs.duration_hours }}
      WFS_TRANSPORT: ${{ inputs.transport }}
      WFS_APPS: ${{ inputs.apps_bundle }}
      WFS_REMOTE: ${{ inputs.remote_access }}
      WFS_HOSTNAME_BASE: ${{ inputs.tailscale_hostname }}
      WFS_HOSTNAME_MODE: ${{ inputs.hostname_mode }}
      WFS_RDP_USERNAME: ${{ inputs.rdp_username }}
      WFS_WEB_USERNAME: ${{ inputs.web_username }}
      WFS_RDP_PASSWORD_MODE: ${{ inputs.rdp_password_mode }}
      WFS_VNC_PASSWORD_MODE: ${{ inputs.vnc_password_mode }}
      WFS_IDE: ${{ inputs.ide_choice }}
      WFS_EDITOR: ${{ inputs.editor_choice }}
      WFS_METATRADER: ${{ inputs.metatrader_choice }}
      WFS_ROUTER: ${{ inputs.router_choice }}
      WFS_CODING_AGENT: ${{ inputs.coding_agent_choice }}
      WFS_AI_AGENT: ${{ inputs.ai_agent_choice }}
    steps:
      - name: "📦 Checkout Linux workspace scripts"
        uses: actions/checkout@v7.0.1

      - name: "🔐 Reuse Windows RDP_PASSWORD and VNC_PASSWORD securely"
        env:
          WFS_RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          WFS_VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: bash linux/workspace.sh prepare

      - name: "🧪 Detect host KVM for Android Emulator"
        id: kvm
        run: |
          if [[ -c /dev/kvm ]]; then
            echo "WFS_HOST_KVM=available" >> "$GITHUB_ENV"
            echo "::notice title=KVM available::Runner exposes /dev/kvm."
            stat -c 'KVM device: %n | owner=%U | group=%G | mode=%a' /dev/kvm
          else
            echo "WFS_HOST_KVM=unavailable" >> "$GITHUB_ENV"
            echo "::warning title=KVM unavailable::Runner does not expose /dev/kvm; hardware acceleration cannot be enabled."
          fi

      - name: "🐧 Start selected Linux distro + responsive desktop"
        timeout-minutes: 15
        run: bash linux/workspace.sh start

      - name: "🔊 Install and start PulseAudio virtual output"
        id: pulseaudio
        if: inputs.enable_pulseaudio
        timeout-minutes: 8
        continue-on-error: true
        run: bash linux/install-pulseaudio.sh

      - name: "🖥️ Install official HopToDesk remote desktop client"
        id: hoptodesk
        if: inputs.install_hoptodesk
        timeout-minutes: 8
        continue-on-error: true
        run: bash linux/install-hoptodesk.sh

      - name: "🖥️ Start native Linux xrdp server for RDP / both"
        if: inputs.remote_access == 'rdp' || inputs.remote_access == 'both'
        timeout-minutes: 15
        run: bash linux/setup-rdp.sh

      - name: "🌐 Install Google Chrome + mandatory Cookie-Editor and GoFullPage extensions"
        timeout-minutes: 10
        run: bash linux/install-chrome.sh

      - name: "🐾 Connect temporary runner to private Tailscale tailnet"
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          hostname: "${{ env.WFS_HOSTNAME }}"
          version: latest

      - name: "🌐 Publish selected private RDP and/or web endpoints through Tailscale"
        timeout-minutes: 3
        run: bash linux/workspace.sh publish

      - name: "📦 Install optional Linux application bundle"
        id: apps
        if: inputs.apps_bundle != 'none' || inputs.ide_choice != 'none' || inputs.editor_choice != 'none' || inputs.metatrader_choice != 'none' || inputs.router_choice != 'none' || inputs.coding_agent_choice != 'none' || inputs.ai_agent_choice != 'none'
        timeout-minutes: 25
        continue-on-error: true
        run: bash linux/install-apps.sh

      - name: "🎨 Install latest verified Linux ArtCraft Launcher"
        id: artcraft
        if: inputs.install_artcraft
        timeout-minutes: 8
        continue-on-error: true
        run: bash linux/install-artcraft.sh

      - name: "📊 Generate Linux Remote Workspace Dashboard"
        env:
          WFS_APPS_STEP_OUTCOME: ${{ steps.apps.outcome }}
          WFS_ARTCRAFT_STEP_OUTCOME: ${{ steps.artcraft.outcome }}
          WFS_ARTCRAFT_SELECTED: ${{ inputs.install_artcraft }}
          WFS_HOPTODESK_STEP_OUTCOME: ${{ steps.hoptodesk.outcome }}
          WFS_HOPTODESK_SELECTED: ${{ inputs.install_hoptodesk }}
          WFS_PULSE_STEP_OUTCOME: ${{ steps.pulseaudio.outcome }}
          WFS_PULSE_SELECTED: ${{ inputs.enable_pulseaudio }}
          WFS_KVM_STEP_OUTCOME: ${{ steps.kvm.outcome }}
        run: bash linux/workspace.sh summary

      - name: "🟢 Remote READY — Keep Alive for RDP and web"
        timeout-minutes: 355
        run: bash linux/workspace.sh keepalive

      - name: "🧹 Stop desktop and delete temporary password"
        if: always()
        run: bash linux/workspace.sh cleanup
